<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학성여고 탐구 설계 노트 — 학생용</title>
<style>
:root{
  --paper:#F3F5F2; --card:#FFFFFF; --ink:#1C2333; --ink2:#4A5160; --mute:#8A8F98; --line:#D9DDD5; --soft:#F7F8F5;
  --teal:#16706A; --teal-soft:#E1EFEC; --amber:#B97F00; --amber-soft:#FBF1D6; --red:#C23B22; --red-soft:#F9E3DE; --blue:#2F5FA8; --blue-soft:#E4EBF7; --vio:#6B4FA8; --vio-soft:#ECE6F6;
  --a:#E9C84A; --b:#8CC98A; --c:#7DB9DC; --d:#B7A3DD; --e:#E79A93;
  --radius:6px; --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:19px} h2{font-size:16px} h3{font-size:14px} h4{font-size:13px}
p{margin:0 0 8px}
.top{display:flex;align-items:center;gap:16px;padding:10px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:230px}
.brand small{color:var(--mute);font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;border-radius:var(--radius);padding:7px 13px;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button .n{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-size:11px;text-align:center;margin-right:5px;font-weight:700}
.tabs button.on .n{background:#fff;color:var(--ink)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.wrap{max-width:1480px;margin:0 auto;padding:18px 22px 70px}
.screen{display:none}.screen.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel>h2{margin-bottom:4px}
.panel .sub{color:var(--ink2);font-size:13px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:1100px){.grid2,.cols,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:6px 11px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.danger{color:var(--red)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-right:1px solid var(--line);color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--teal);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
label.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;background:#fff;width:100%}
textarea{min-height:56px;resize:vertical}
input.num{width:64px;text-align:right;padding:5px 6px}
input.num.s{width:52px}
select.s{width:auto;padding:5px 6px}
.field{margin-bottom:10px}
.muted{color:var(--mute)} .small{font-size:12px} .b{font-weight:700}
.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;background:var(--soft);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.teal{background:var(--teal-soft);border-color:#BFDCD7;color:var(--teal)}
.tag.amber{background:var(--amber-soft);border-color:#EBD9A6;color:#8A5E00}
.tag.red{background:var(--red-soft);border-color:#EDC3BA;color:var(--red)}
.tag.blue{background:var(--blue-soft);border-color:#C5D3EA;color:var(--blue)}
.tag.vio{background:var(--vio-soft);border-color:#D3C7EA;color:var(--vio)}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
table.grid th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--soft);border-top:1px solid var(--line);white-space:nowrap}
table.grid td.c,table.grid th.c{text-align:center}
table.grid td.r,table.grid th.r{text-align:right}
table.grid tr.click{cursor:pointer}
table.grid tr.click:hover td{background:#FAFBF8}
table.grid tr.detail td{background:#FBFCFA;padding:12px 14px}
.scroll{overflow-x:auto}
/* 분포 막대 */
.dist{display:flex;height:18px;border-radius:3px;overflow:hidden;min-width:150px;background:#EEF0EC}
.dist i{display:block;height:100%;font-style:normal;font-size:10.5px;line-height:18px;text-align:center;color:#2b2b2b;overflow:hidden;white-space:nowrap}
.dist .A{background:var(--a)}.dist .B{background:var(--b)}.dist .C{background:var(--c)}.dist .D{background:var(--d)}.dist .E{background:var(--e)}
.dist.big{height:24px}.dist.big i{line-height:24px;font-size:11.5px}
.ratio{display:flex;height:16px;border-radius:3px;overflow:hidden;min-width:110px}
.ratio i{display:block;height:100%;font-style:normal;font-size:10.5px;line-height:16px;text-align:center;color:#fff;white-space:nowrap;overflow:hidden}
.ratio .j1{background:#4F86B8}.ratio .j2{background:#86AFD2}.ratio .p{background:#D9A520;color:#3b2c00}.ratio .pb{background:#B9BDB4;color:#333}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:6px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--k)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--soft)}
.kpi span{display:block;font-size:12px;color:var(--ink2)}
.kpi b{display:block;font-size:22px;line-height:1.3}
.kpi small{color:var(--mute);font-size:11.5px}
.note{border-left:0;background:var(--amber-soft);border-radius:var(--radius);padding:9px 12px;font-size:13px;color:#5b4300;margin:8px 0}
.note.teal{background:var(--teal-soft);color:#0f4d49}
.note.red{background:var(--red-soft);color:#7e2515}
.note.gray{background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;background:#fff;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.fixed{background:var(--soft);color:var(--ink2);cursor:default}
.chip .mk{font-size:10px;margin-left:3px;opacity:.9;white-space:nowrap}
.chip.rec{border-color:var(--amber)}
.chip.uni{box-shadow:inset 0 -2px 0 var(--blue)}
.chip.warn{border-style:dashed;border-color:var(--red)}
.chip.dis{opacity:.4;cursor:not-allowed}
.termgrid{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:8px;overflow-x:auto}
.term{border:1px solid var(--line);border-radius:var(--radius);background:var(--soft);padding:8px;min-width:170px}
.term h3{display:flex;justify-content:space-between;margin-bottom:6px}
.term .blk{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:7px;margin-top:7px}
.term .blk h4{display:flex;justify-content:space-between;font-weight:600;color:var(--ink2);margin-bottom:5px;font-size:12px}
.term .chips{flex-direction:column;gap:4px}
.term .chip{white-space:normal;border-radius:6px;text-align:left;display:flex;justify-content:space-between;gap:4px;align-items:center}
.ok{color:var(--teal);font-weight:700}.bad{color:var(--red);font-weight:700}.mid{color:var(--amber);font-weight:700}
.st{display:inline-block;min-width:44px;text-align:center;border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:700}
.st.met{background:var(--teal-soft);color:var(--teal)}.st.partial{background:var(--amber-soft);color:#8A5E00}.st.unmet{background:var(--red-soft);color:var(--red)}.st.info{background:var(--soft);color:var(--ink2)}
.v{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700}
.v.안정{background:#DDEEE0;color:#1E6B34}.v.적정{background:var(--teal-soft);color:var(--teal)}.v.소신{background:var(--amber-soft);color:#8A5E00}.v.상향{background:#FBE5D2;color:#9A4A0B}.v.과상{background:var(--red-soft);color:var(--red)}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:#fff}
.card+.card{margin-top:10px}
.card h3{margin-bottom:6px}
.act{border:1px solid var(--line);border-radius:var(--radius);padding:10px;background:var(--soft);margin-bottom:8px}
.act .hd{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.five{display:flex;gap:4px;flex-wrap:wrap}
.five span{font-size:11.5px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);background:#fff;color:var(--mute)}
.five span.on{background:var(--teal-soft);border-color:#BFDCD7;color:var(--teal);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
.step{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:#fff}
.step .no{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.04em}
.step h3{margin:2px 0 6px}
ul.cl{list-style:none;margin:0;padding:0}
ul.cl li{display:flex;gap:7px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
ul.cl li:last-child{border-bottom:0}
ul.cl input{margin-top:3px;width:auto}
ul.pl{margin:4px 0 8px;padding-left:18px} ul.pl li{margin-bottom:3px}
.ladder{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:6px 0}
.ladder b{color:var(--teal);white-space:nowrap}
.hint{font-size:12px;color:var(--mute)}
.warnline{color:var(--red);font-size:12px}
.okline{color:var(--teal);font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:20px 0 0}
.rep h2{margin-top:2px}
.rep .sec{border-top:2px solid var(--ink);padding-top:10px;margin-top:18px}
.rep .sec>h2{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.rep .sec>h2 small{font-weight:400;color:var(--mute);font-size:12px}
.printonly{display:none}
@media print{
  html,body{background:#fff;font-size:11.5px}
  .top,.noprint,.tools,.foot,.toast{display:none!important}
  .wrap{padding:0;max-width:none}
  .screen{display:none!important}.screen.on{display:block!important}
  .panel{border:0;padding:0;margin-bottom:10px}
  .card,.act,.kpi,.step{break-inside:avoid}
  .printonly{display:block}
  table.grid th{background:#F4F5F2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dist i,.ratio i,.tag,.st,.v,.note{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  input,select,textarea{border-color:#ccc}
}


.rolebox{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:var(--radius);padding:10px 14px;margin:0 0 12px;font-size:13px}
.rolebox ul{margin:4px 0 0 18px;padding:0}.rolebox li{margin:2px 0}
.rolesel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.rolesel .seg button{padding:4px 10px;font-size:12.5px}
.chip.base{border-color:var(--teal)}.chip.base .mk{color:var(--teal)}.chip.base.on .mk{color:inherit}
tr.sub td{background:var(--soft)}
#radar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px;text-align:center}
.hgwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:900px){.hgwrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  table.grid{display:block;overflow-x:auto;max-width:100%}
  .top{padding:8px 10px;gap:8px}.tools{margin-left:0}.wrap{padding-left:10px;padding-right:10px}
  .panel{padding:12px}.termgrid{grid-template-columns:1fr!important}
  .row{flex-wrap:wrap}.seg{max-width:100%}
  input[type=text],input[type=date],select,textarea{max-width:100%}
}

/* 탐구 설계 */
.rmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.rmkw{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:9px 11px;white-space:normal}
.rmkw:hover{border-color:var(--teal)}
.rmkw.on{border-color:var(--teal);background:var(--teal-soft)}
.rmkw b{display:block;font-size:13.5px}
.rmkw .q{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.rmkw .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.rmhead{border-left:4px solid var(--teal)}
.rmhead .big{font-size:17px;font-weight:700;margin:8px 0 3px;letter-spacing:-.01em}
.rmnav{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.rmnav .chip:hover{border-color:var(--teal)}
.rmflow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin:4px 0 12px}
.rmbox{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--soft)}
.rmbox.on{border-color:#BFDCD7;background:var(--teal-soft)}
.rmbox .lab{display:block;font-size:11.5px;color:var(--ink2);font-weight:700;margin-bottom:3px}
.rmbox b{font-size:14.5px}
.rmarr{align-self:center;font-size:18px;color:var(--teal);font-weight:700}
.rmscale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
.rmscale .card{margin:0}
.rmscale .card h3 small{font-weight:400;color:var(--ink2);display:block;font-size:12px;margin-top:2px}
.rmweeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rmweeks .card{margin:0}
table.grid.vtop td{vertical-align:top}
.rmplan textarea{min-height:92px}
.rmsix{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.rmsix div{border:1px solid var(--line);border-radius:var(--radius);padding:7px 8px;font-size:12px;background:var(--soft)}
.rmsix .no{display:block;font-size:11px;font-weight:700;color:var(--teal);margin-bottom:2px}
details.rmd{border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-top:10px;background:#fff}
details.rmd summary{cursor:pointer;font-weight:700}
details.rmd[open] summary{margin-bottom:8px}
details.rmd h4{margin:4px 0}
@media (max-width:900px){.rmflow{grid-template-columns:minmax(0,1fr)}.rmarr{justify-self:center;transform:rotate(90deg)}.rmscale,.rmweeks{grid-template-columns:minmax(0,1fr)}.rmsix{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{
  table.grid{display:table!important;overflow:visible!important}
  .panel{padding:0!important}
  .rmhead{border-left:0}.rmbox,.rmbox.on,.rmsix div{background:#fff}
  .rmflow{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.rmarr{transform:none}
  .rmscale{grid-template-columns:repeat(3,minmax(0,1fr))}.rmweeks{grid-template-columns:repeat(2,minmax(0,1fr))}.rmsix{grid-template-columns:repeat(6,minmax(0,1fr))}
  .rmsec .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.rmsec .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rmsec tr,.rmweeks .card,.rmscale .card{break-inside:avoid}
  .rmsec h2,.rmsec h3{break-after:avoid}
  details.rmd{border:0;padding:0}details.rmd summary{list-style:none}details.rmd:not([open]){display:none}
  .rmwrite{white-space:pre-wrap;min-height:64px;font-size:11.5px}
  .rmmine:has(#rm-myq-print:empty){display:none}
}
@media (max-width:760px){.rmsec table.grid.vtop th,.rmsec table.grid.vtop td{min-width:92px}.rmplan td:nth-child(2){min-width:240px}.rmplan td:last-child{min-width:220px}}
.rmall td{font-size:12.5px}
@media print{.rmall td,.rmall th{font-size:9.5px;padding:4px 5px}.rmall tr{break-inside:avoid}}
/* 내 키워드로 설계 */
.rmmode{padding:10px 16px}
.rmsub{margin-top:6px}.rmsub .hint{display:block;margin-bottom:3px}
.chip.sm{padding:2px 9px;font-size:12px}
#rm-build label.f{font-size:13px;color:var(--ink);margin-bottom:5px}
#rm-build label.f b{display:inline-block;width:19px;height:19px;line-height:19px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-size:11.5px;text-align:center;margin-right:5px}
#rm-build .field{margin-bottom:14px}
#rm-build .row input[type=text]{flex:1;min-width:150px}
#rm-live{margin-top:2px}
.rmscale details.rmd{margin-top:8px;padding:5px 9px}
.rmscale details.rmd summary{font-weight:400;font-size:12px;color:var(--ink2)}
.rmcon input[type=text]{width:100%}
@media print{.rmcon input[type=text]{border:0;padding:0}}
.rmcand{border:1px dashed var(--line);border-radius:var(--radius);padding:8px 12px;margin-top:8px;background:var(--soft)}
.rmcand h4{font-weight:600;color:var(--ink2);margin-bottom:4px}
.rmcand table.grid td{background:transparent}
/* 인쇄 문서 · 공통 */
.bkhelp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bkhelp .rmbox{background:#fff}
.bkhelp .rmbox .small{display:block}
.bkacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bkacts .card{margin:0}
.bkact .field{margin-bottom:8px}
.bkact label.f b,.bksec label.f b{color:var(--ink)}
.bksec label.f .hint{margin-left:4px}
.bkq4 td>div.hint{padding:6px 0}
.bksec .rmcand{margin-top:10px}
.bkcon td{padding:5px 6px}
.bkcon textarea{min-height:44px}
@media (max-width:900px){.bkacts{grid-template-columns:minmax(0,1fr)}.bkhelp{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.bksec .rmsix{grid-template-columns:repeat(2,minmax(0,1fr))!important}.bkq4 td,.bkq4 th,.bkcon td,.bkcon th{min-width:150px}.bkq4 td:first-child,.bkcon td:last-child,.bkcon th:last-child{min-width:0}}
.bkdoc h1.bkdt{font-size:17px;text-align:center;margin:0 0 8px;letter-spacing:.02em}
.bkdoc h3{margin:12px 0 5px;font-size:12.5px;break-after:avoid}
.bkdoc .bkn{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:#E9EEEA;color:var(--ink);font-size:11px;text-align:center;margin-right:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bkdoc table{width:100%;border-collapse:collapse}
.bkdoc table.bkid{margin:0 0 6px auto;width:auto}
.bkdoc table.bkid th,.bkdoc table.bkid td{border:1px solid #CFD3CC;padding:3px 8px;font-size:11px}
.bkdoc table.bkid th{background:#F4F5F2;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bkdoc table.bkid td{min-width:74px}
.bkdoc table.grid th,.bkdoc table.grid td{border:1px solid #CFD3CC;padding:5px 7px;font-size:11px;line-height:1.5;white-space:normal}
.bkdoc table.bkt2 th{width:21%;text-align:center;font-weight:600}
.bkdoc table.bkt2 td{height:30px}
.bkdoc tr.bkrow td{height:58px}
.bkdoc tr{break-inside:avoid}
.bkdoc .bkkeep{break-inside:avoid}

<script id="db" type="application/json">{"ach":{"std":{"경제":[["12경제01-01","인간 생활에서 자원의 희소성으로 인해 발생하는 경제 문제의 중요성을 인식하고, 경제학의 분석 대상과 성격을 이해한다."],["12경제01-02","경제 문제를 해결하는 다양한 방식의 장단점을 비교하고, 시장경제의 기본 원리와 이를 뒷받침하는 제도를 파악한다."],["12경제01-03","인간은 경제적 유인에 반응함을 인식하고, 편익과 비용을 고려하여 합리적으로 선택하는 능력과 한계 분석을 이용한 의사 결정 능력을 계발한다."],["12경제02-01","수요와 공급에 의한 시장 균형의 결정과 변동 원리를 파악하고, 이를 다양한 시장에 적용한다."],["12경제02-03","시장 기능과 공공 부문의 활동을 비교하고, 자원 배분의 효율성과 형평성에 미치는 영향을 평가한다."],["12경제03-01","여러 가지 거시 경제 변수를 탐색하고, 국가 경제 전반의 활동 수준을 파악한다."],["12경제03-02","경제 성장의 의미와 요인을 이해하고, 한국 경제의 변화와 경제적 성과를 균형 있는 시각에서 평가한다."],["12경제03-03","경기 변동의 의미와 요인을 이해하고, 경기 안정화 방안으로 재정 정책과 통화 정책을 분석한다."],["12경제04-02","비교 우위에 따른 특화와 교역을 중심으로 무역 원리를 이해하고, 자유 무역과 보호 무역 정책의 경제적 효과를 설명한다."],["12경제04-03","외환 시장에서 환율의 결정 원리를 이해하고, 환율 변동이 국가 경제와 개인의 경제생활에 미치는 영향을 탐구한다."]],"경제 수학":[["12경수01-01","통계 자료를 활용하여 경제지표의 의미를 이해하고, 경제지표의 변화를 설명할 수 있다."],["12경수01-02","환율과 관련된 실생활 문제를 해결할 수 있다."],["12경수01-03","세금과 관련된 실생활 문제를 해결할 수 있다."],["12경수01-04","단리와 복리를 이용하여 이자와 원리합계를 구하고, 미래에 받을 금액의 현재가치를 구할 수 있다."],["12경수01-05","연금의 뜻을 알고, 연금의 현재가치를 구할 수 있다."],["12경수02-01","여러 가지 경제 현상을 함수로 나타낼 수 있다."],["12경수02-02","함수와 그래프를 활용하여 수요곡선과 공급곡선의 의미를 탐구하고 이해한다."],["12경수02-03","효용의 의미를 이해하고, 효용을 함수와 그래프로 나타낼 수 있다."],["12경수02-04","수요와 공급의 상호 작용에 의해 균형가격이 결정되는 경제 현상을 설명할 수 있다."],["12경수02-05","세금과 소득의 변화가 균형가격에 미치는 영향을 탐구하고 이해한다."],["12경수02-06","부등식의 영역의 개념을 이해하고, 이를 활용하여 경제 현상의 문제를 해결할 수 있다."],["12경수03-01","여러 가지 경제 현상을 행렬로 나타내고, 연산할 수 있다."],["12경수03-02","역행렬의 뜻을 알고, 2×2 행렬의 역행렬을 구할 수 있다."],["12경수03-03","행렬의 연산과 역행렬을 활용하여 경제 현상의 문제를 해결할 수 있다."],["12경수04-01","미분의 개념을 이해하고 경제 현상을 나타내는 함수를 미분할 수 있다."],["12경수04-02","미분을 이용하여 그래프의 개형을 탐구하고 해석할 수 있다."],["12경수04-03","미분을 활용하여 탄력성의 의미를 탐구하고 이해한다."],["12경수04-04","미분을 활용하여 경제 현상의 최적화 문제를 해결할 수 있다."]],"공통국어1":[["10공국1-01-01","대화의 원리를 고려하여 대화하고 자신의 듣기⋅말하기 과정과 공동체의 담화 관습을 성찰한다."],["10공국1-01-02","논제의 필수 쟁점별로 논증을 구성하고 논증이 타당한지 평가하며 토론한다."],["10공국1-02-01","다양한 글이나 자료를 읽으며 논증의 타당성을 평가하고 자신의 관점을 바탕으로 논증을 재구성한다."],["10공국1-02-02","자신의 진로나 관심 분야와 관련한 다양한 글이나 자료를 찾아 주제 통합적으로 읽고 읽은 결과를 공유한다."],["10공국1-03-01","내용 전개의 일반적 원리를 고려하여 사회적 쟁점에 대한 자신의 견해를 정교하게 표현하는 글을 쓴다."],["10공국1-03-02","다양한 언어 공동체의 특성을 고려하며 필자의 개성이 드러나는 글을 쓴다."],["10공국1-04-01","언어 공동체가 다변화함에 따라 다양해진 언어 실천 양상을 분석하고 언어 주체로서 책임감을 가지며 국어생활을 한다."],["10공국1-04-02","음운 변동을 탐구하여 발음과 표기에 올바르게 적용한다."],["10공국1-04-03","다양한 분야의 글과 담화에 나타난 문법 요소 및 어휘의 표현 효과를 평가하고 적절한 표현을 생성한다."],["10공국1-05-01","문학 소통의 특성을 고려하며 문학 소통에 참여한다."],["10공국1-05-02","갈래에 따른 형상화 방법의 특성을 고려하며 작품을 수용한다."],["10공국1-05-03","작품 구성 요소의 유기적 관계와 맥락에 유의하여 작품을 수용하고 생산한다."],["10공국1-06-01","사회적 의제를 다룬 매체 자료를 비판적으로 분석한다."],["10공국1-06-02","소통 맥락과 매체 특성을 고려하여 다양한 목적의 매체 자료를 제작한다."]],"공통국어2":[["10공국2-01-01","청중의 관심과 요구에 맞게 내용을 구성하여 발표하고 청중의 질문에 효과적으로 답변한다."],["10공국2-01-02","쟁점과 이해관계를 고려하여 문제를 해결할 수 있는 대안을 탐색하며 협상한다."],["10공국2-01-03","사회적 소통 과정에서 말의 영향력을 고려하여 책임감 있게 듣고 말한다."],["10공국2-02-01","복합양식으로 구성된 글이나 자료에 내재된 필자의 관점이나 의도, 표현 방법을 평가하며 읽는다."],["10공국2-02-02","동일한 화제의 글이나 자료라도 서로 다른 관점과 형식으로 표현됨을 이해하며 읽기 목적을 고려하여 글이나 자료를 주제 통합적으로 읽는다."],["10공국2-02-03","의미 있는 사회적 독서 활동에 참여함으로써 타인과 교류하고 다양한 지식이나 정보, 삶에 대한 가치관 등을 이해하는 태도를 지닌다."],["10공국2-03-01","언어 공동체가 공유하는 작문 관습의 특성을 이해하고 쓰기 과정과 전략을 점검하며 책임감 있게 글을 쓴다."],["10공국2-03-02","논증 요소에 따른 분석을 바탕으로 효과적으로 내용을 조직하여 논증하는 글을 쓴다."],["10공국2-03-03","신뢰할 수 있는 정보를 종합하여 복합양식 자료가 포함된 공동 보고서를 쓴다."],["10공국2-04-01","과거 및 현재의 국어생활에 나타나는 국어의 변화를 이해하고 국어문화 발전에 참여한다."],["10공국2-04-02","한글 맞춤법의 원리를 적용하여 국어생활을 성찰하고 문제를 해결한다."],["10공국2-05-01","한국 문학사의 흐름을 고려하여 작품을 수용한다."],["10공국2-05-02","주체적인 관점에서 작품을 해석하고 평가하며 문학을 생활화하는 태도를 지닌다."],["10공국2-06-01","매체 비평 자료를 비판적으로 수용하고 자신의 관점을 담아 매체 비평 자료를 제작한다."],["10공국2-06-02","매체의 변화가 소통 문화에 끼치는 영향을 탐구한다."]],"공통수학1":[["10공수1-01-01","다항식의 사칙연산의 원리를 설명하고, 그 계산을 할 수 있다."],["10공수1-01-02","항등식의 성질과 나머지정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["10공수1-01-03","다항식의 인수분해를 할 수 있다."],["10공수1-02-01","복소수의 뜻과 성질을 설명하고, 사칙연산을 수행할 수 있다."],["10공수1-02-02","이차방정식의 실근과 허근을 이해하고, 판별식을 이용하여 이차방정식의 근을 판별할 수 있다."],["10공수1-02-03","이차방정식의 근과 계수의 관계를 설명할 수 있다."],["10공수1-02-04","이차방정식과 이차함수를 연결하여 그 관계를 설명할 수 있다."],["10공수1-02-05","이차함수의 그래프와 직선의 위치 관계를 판단할 수 있다."],["10공수1-02-07","간단한 삼차방정식과 사차방정식을 풀 수 있다."],["10공수1-02-08","미지수가 2개인 연립이차방정식을 풀 수 있다."],["10공수1-02-09","미지수가 1개인 연립일차부등식을 풀 수 있다."],["10공수1-02-10","절댓값을 포함한 일차부등식을 풀 수 있다."],["10공수1-02-11","이차부등식과 이차함수를 연결하여 그 관계를 설명하고, 이차부등식과 연립이차부등식을 풀 수 있다."],["10공수1-03-01","합의 법칙과 곱의 법칙을 이해하고, 적절한 전략을 사용하여 경우의 수와 관련된 문제를 해결할 수 있다."],["10공수1-03-02","순열의 개념을 이해하고, 순열의 수를 구하는 방법을 설명할 수 있다."],["10공수1-03-03","조합의 개념을 이해하고, 조합의 수를 구하는 방법을 설명할 수 있다."],["10공수1-04-01","행렬의 뜻을 알고, 실생활 상황을 행렬로 표현할 수 있다."],["10공수1-04-02","행렬의 연산을 수행하고, 관련된 문제를 해결할 수 있다."]],"공통수학2":[["10공수2-01-01","선분의 내분을 이해하고, 내분점의 좌표를 계산할 수 있다."],["10공수2-01-02","두 직선의 평행 조건과 수직 조건을 탐구하고 이해한다."],["10공수2-01-03","점과 직선 사이의 거리를 구하고, 관련된 문제를 해결할 수 있다."],["10공수2-01-04","원의 방정식을 구하고, 그래프를 그릴 수 있다."],["10공수2-01-05","좌표평면에서 원과 직선의 위치 관계를 판단하고, 이를 활용하여 문제를 해결할 수 있다."],["10공수2-01-06","평행이동을 탐구하고, 실생활과 연결하여 문제를 해결할 수 있다."],["10공수2-01-07","원점, x축, y축, 직선 y=x에 대한 대칭이동을 탐구하고, 실생활과 연결하여 문제를 해결할 수 있다."],["10공수2-02-01","집합의 개념을 이해하고, 집합을 표현할 수 있다."],["10공수2-02-02","두 집합 사이의 포함관계를 판단할 수 있다."],["10공수2-02-03","집합의 연산을 수행하고, 벤 다이어그램을 이용하여 나타낼 수 있다."],["10공수2-02-04","명제와 조건의 뜻을 알고, ‘모든’, ‘어떤’을 포함한 명제를 이해하고 설명할 수 있다."],["10공수2-02-05","명제의 역과 대우를 이해하고 설명할 수 있다."],["10공수2-02-06","충분조건과 필요조건을 이해하고 판단할 수 있다."],["10공수2-02-07","대우를 이용한 증명법과 귀류법을 이해하고 관련된 명제를 증명할 수 있다."],["10공수2-02-08","절대부등식의 뜻을 알고, 간단한 절대부등식을 증명할 수 있다."],["10공수2-03-01","함수의 개념을 설명하고, 그 그래프를 이해한다."],["10공수2-03-02","함수의 합성을 설명하고, 합성함수를 구할 수 있다."],["10공수2-03-03","역함수의 개념을 설명하고, 역함수를 구할 수 있다."],["10공수2-03-04","유리함수의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다.(식 표기는 교육과정 원문 확인)"],["10공수2-03-05","무리함수의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다.(식 표기는 교육과정 원문 확인)"]],"공통영어1":[["10공영1-01-01","말이나 글에 포함된 세부 정보를 파악한다."],["10공영1-01-02","말이나 글의 주제나 요지를 파악한다."],["10공영1-01-03","말이나 글의 분위기나 화자나 인물의 심정 및 의도 등을 추론한다."],["10공영1-01-04","말이나 글에 나타난 일이나 사건의 논리적 관계를 파악한다."],["10공영1-01-05","말이나 글에 포함된 표현의 함축적 의미를 추론한다."],["10공영1-01-06","말이나 글의 전개 방식이나 구조를 파악한다."],["10공영1-01-07","말이나 글의 이해를 위한 적절한 전략을 적용한다."],["10공영1-01-08","말이나 글에 나타난 다양한 관점이나 의견을 포용적인 태도로 분석한다."],["10공영1-02-01","실물, 그림, 사진, 도표 등을 활용하여 내용을 설명한다."],["10공영1-02-02","사실적 정보나 지식을 말이나 글로 전달한다."],["10공영1-02-03","경험이나 계획 등을 말하거나 기술한다."],["10공영1-02-04","자신의 생각이나 의견, 감정, 감상 등을 표현한다."],["10공영1-02-05","듣거나 읽은 내용을 요약하여 말하거나 기술한다."],["10공영1-02-06","어휘나 표현을 점검하여 내용을 명확하게 전달한다."],["10공영1-02-07","적절한 전략과 다양한 매체를 활용하여 상황과 목적에 맞게 말하거나 쓴다."],["10공영1-02-08","상대방의 생각이나 관점을 존중하고 언어 예절을 갖추어 표현한다."]],"공통영어2":[["10공영2-01-01","말이나 글에 포함된 세부 정보를 파악한다."],["10공영2-01-02","말이나 글의 주제나 요지를 파악한다."],["10공영2-01-03","말이나 글의 분위기나 등장인물의 심정 및 의도 등을 추론한다."],["10공영2-01-04","말이나 글에 나타난 일이나 사건의 논리적 관계를 파악한다."],["10공영2-01-05","말이나 글에 포함된 표현의 함축적 의미를 추론한다."],["10공영2-01-06","말이나 글의 전개 방식이나 구조를 파악한다."],["10공영2-01-07","다양한 매체의 말이나 글을 비판적으로 이해한다."],["10공영2-01-08","말이나 글의 이해를 위한 적절한 전략을 적용한다."],["10공영2-02-01","실물, 그림, 사진, 도표 등을 활용하여 내용을 설명한다."],["10공영2-02-02","사실적 정보나 지식을 말이나 글로 전달한다."],["10공영2-02-03","경험이나 계획 등을 말하거나 기술한다."],["10공영2-02-04","자신의 생각이나 의견, 감정, 감상 등을 표현한다."],["10공영2-02-05","듣거나 읽은 내용을 요약하여 말하거나 기술한다."],["10공영2-02-06","다양한 소통의 목적에 맞게 말하거나 글로 표현한다."],["10공영2-02-07","어휘나 표현을 점검하여 내용을 명확하게 전달한다."],["10공영2-02-08","적절한 전략과 다양한 매체를 활용하여 상황과 목적에 맞게 말하거나 쓴다."],["10공영2-02-09","다른 사람과 의견을 조율하며 문제 해결을 위해 협력한다."]],"과학의 역사와 문화":[["12과사01-01","인류 문명의 탄생 과정에서 인류의 지혜가 담긴 과학적 사례를 발견하고, 이를 통해 과학이 인류 문명의 형성 과정에 기여하였음을 이해할 수 있다."],["12과사01-02","고대 그리스 철학자의 과학적 사고나 주장 등을 조사하고, 그리스 문명이 고대에서 현대에 이르기까지 인간의 삶에 미친 영향을 설명할 수 있다."],["12과사01-03","중세 시대 유럽과 중동 지역을 중심으로 종교나 문화가 과학에 기여한 바를 이해하고, 고대 그리스의 과학과 중세 과학의 특징을 비교할 수 있다."],["12과사01-04","르네상스와 과학혁명이 일어난 사회문화적 배경을 조사하고, 과학과 예술 사이의 융합적 사례를 설명할 수 있다."],["12과사01-05","과학 지식의 형성 과정에서 과학자의 신념이나 세계관이 영향을 준 사례를 조사하여 발표할 수 있다."],["12과사02-01","상대성 이론 등과 같은 현대 과학의 등장이 당시의 사회문화에 끼친 영향을 이해함으로써 과학의 사회적 가치를 느낄 수 있다."],["12과사02-02","현대 과학의 등장 과정에서 나타난 과학자들의 논쟁이나 토론 사례를 조사하고, 과학적 의사소통에서 지켜야 할 규범과 태도를 이해할 수 있다."],["12과사02-03","현대 예술 작품이나 건축물에 과학적 원리가 적용된 사례를 조사하고, 과학과 문화의 관련성을 추론할 수 있다."],["12과사02-04","감염병이 사회에 영향을 미친 대표적인 사례를 찾고, 과학이 사회 문제 해결에 기여함을 인식할 수 있다."],["12과사02-05","과학기술이 교통수단의 발달에 미친 영향을 인식하고, 교통수단의 발전이 가져올 미래 사회의 변화를 예측할 수 있다."],["12과사02-06","산업혁명 이후 나타난 과학기술이 인류 문명에 미친 긍정적 효과와 부정적 효과에 대해 토론할 수 있다."],["12과사03-01","과학기술의 발전을 통해 새롭게 나타난 문화적 변화를 찾아보고, 과학을 주제로 하는 예술 작품이나 콘텐츠를 제작하여 발표할 수 있다."],["12과사03-02","일상생활이나 미디어에서 사용되는 과학 용어를 조사하고, 과학 용어가 우리 사회에 미치는 파급효과를 설명할 수 있다."],["12과사03-03","과학기술의 발전이 음악에 영향을 끼친 사례를 탐색하고 인공지능으로 음악을 창작하거나 로봇을 활용한 연주를 통해 과학의 심미적 가치를 느낄 수 있다."],["12과사03-04","인간과 기계, 사물 등을 연결하는 과학기술의 발전 동향을 파악하고 미래 사회의 변화를 예측할 수 있다."],["12과사03-05","가상 현실이나 증강 현실을 활용한 우리 주변의 사례를 조사하고, 이러한 기술이 미래 사회에 미칠 수 있는 영향에 대해 토론할 수 있다."],["12과사03-06","집단적 의사결정을 통해 과학기술과 관련된 사회적 문제를 해결한 사례를 조사하여 과학기술에 대한 시민의 이해와 균형 있는 가치 판단의 필요성을 인식할 수 있다."]],"과학탐구실험1":[["10과탐1-01-01","과학사에서 패러다임의 전환을 가져온 결정적 실험을 따라 해보고, 과학의 발전 과정에 관해 설명할 수 있다."],["10과탐1-01-02","과학사의 다양한 사례들로부터 과학의 본성을 추론할 수 있다."],["10과탐1-02-01","직접적인 관찰을 통한 탐구를 수행하고, 귀납적 탐구 방법을 설명할 수 있다."],["10과탐1-02-02","가설 설정을 포함한 과학사의 대표적인 탐구실험을 수행하고, 연역적 탐구 방법의 특징을 예증할 수 있다."],["10과탐1-02-03","탐구 수행에서 얻은 정성적 혹은 정량적 데이터를 분석하고 그 결과를 다양하게 표상하고 소통할 수 있다."],["10과탐1-02-04","흥미와 호기심을 갖고 과학 탐구에 참여하고, 분야 간 협동 연구 등을 통해 협력적 탐구 활동을 수행하며, 도출한 결과를 증거에 근거하여 해석하고 평가할 수 있다."]],"과학탐구실험2":[["10과탐2-01-01","영화, 건축, 요리, 스포츠, 미디어 등 생활 속의 과학 원리를 실험 등을 통해 탐구하고, 과학 원리를 활용한 놀이 체험을 통해 과학의 즐거움과 유용성을 느낄 수 있다."],["10과탐2-01-02","사회적 이슈나 생활 속에서 과학 탐구 문제를 발견하고, 이를 해결하기 위한 과학 탐구 활동을 계획하고 수행할 수 있다."],["10과탐2-01-03","과학 개념을 적용하여 실생활 문제의 해결방안을 창의적으로 고안하고, 필요한 도구를 설계⋅제작할 수 있다."],["10과탐2-02-01","첨단 과학기술 속의 과학 원리를 찾아내는 탐구 활동을 통해 과학 지식이 활용된 사례를 추론할 수 있다."],["10과탐2-02-02","과학 원리가 적용된 첨단 과학기술 및 탐구 산출물을 발표하고 공유하며, 이를 확산할 수 있다."],["10과탐2-02-03","탐구 활동 과정에서 지켜야 할 생명 존중, 연구 진실성, 지식 재산권 존중 등과 같은 연구 윤리와 함께, 과학기술 이용과 관련된 과학 윤리 및 안전 사항을 준수할 수 있다."]],"교육의 이해":[["12교이01-01","교육적 존재로서의 인간의 본질을 인간의 삶과 연계하여 이해하며 교육의 중요성에 대해 성찰한다."],["12교이01-02","기존의 교육 개념과 새롭게 강조되고 있는 교육 개념을 비교 분석하여 그 특징을 이해하고 이를 바탕으로 교육에 관한 자신의 관점과 태도를 정립한다."],["12교이01-03","사회 변화에 적응하기 위한 평생 학습의 필요성을 이해하고, 평생 학습 사회의 주인공에게 요구되는 자기주도적 학습 역량의 중요성에 대해 성찰한다."],["12교이02-01","학습에 대한 다양한 관점에 기반하여 학습의 의미와 원리를 이해하고 자신에게 맞는 효과적인 학습 전략과 방법을 탐색하고 적용한다."],["12교이02-02","학습자 특성에 대한 이해를 바탕으로 학습자의 능동적인 참여와 사고를 촉진하는 효과적인 교수 전략과 방법을 탐색하고 적용한다."],["12교이03-01","교육 제도가 형성되고 변화해 온 역사적 배경과 사회적 맥락에 비추어 현대 교육 제도의 특징과 문제점을 분석하고 미래 발전 방향을 탐색한다."],["12교이03-02","현대 사회의 교육은 사회 통합과 평등의 실현에 기여하기도 하지만, 사회적 불평등을 재생산하기도 함을 이해하고, 그 원인을 분석하고 대안을 탐색한다."],["12교이03-03","한국 사회에는 해결해야 할 다양한 교육 문제들이 존재함을 인식하고, 이의 해결에 필요한 사회적 책임감과 실천 태도를 기른다."],["12교이04-01","미래 사회 변화에 대처하고 지속가능성을 확보하기 위해 강조되는 디지털 및 인공지능 소양 함양 교육과 생태전환 교육 등의 중요성을 이해하고 구체적 실천 방안을 탐색한다."],["12교이04-02","디지털 정보 기술과 인공지능 기술로 인한 미래 학습 환경과 교육 방법의 변화를 예측해 보고 미래 교수⋅학습의 주체에게 요구되는 역량이 무엇인지 탐색한다."]],"국제 관계의 이해":[["12국관01-01","근대 이후 국제 관계의 형성과 변화 과정을 파악한다."],["12국관01-02","국제 사회를 이해하는 주요 관점인 현실주의와 자유주의를 중심으로 구체적인 국제 관계의 사례를 분석하고, 대안적 관점들을 탐색한다."],["12국관01-03","국제 문제를 해결하기 위한 다양한 행위 주체의 활동을 탐색하고, 그 성과와 문제점에 대하여 토론한다."],["12국관02-01","국가 간 불평등의 원인을 파악하고, 이러한 불평등이 야기하는 갈등 상황을 분석한다."],["12국관02-02","공정 무역과 공적 개발 원조 등 국제 사회의 상생을 위한 노력을 조사하고, 다양한 행위 주체의 협력 방안을 탐색한다."],["12국관02-03","국제 사회에서 우리나라의 위상을 파악하고, 국제 사회의 불평등 문제를 해결하기 위한 우리나라의 역할을 토론한다."],["12국관03-01","인류가 직면한 평화와 안전의 상황을 다각적으로 조사한다."],["12국관03-02","개인, 국가, 국제 사회의 평화와 안전을 위협하는 요인을 정치, 경제, 사회, 문화의 다양한 영역에 걸쳐 파악하고, 이를 해결하기 위한 실천 방안을 탐색한다."],["12국관03-03","역동적인 국제 관계 속에서 우리나라가 당면한 평화와 안전의 문제를 파악하고, 평화와 안전을 도모할 수 있는 구체적인 방안에 대하여 토론한다."],["12국관04-01","국제 분쟁을 해결하기 위한 외교와 국제법의 필요성과 기능을 탐색한다."],["12국관04-02","국제법의 특징과 법원(法 源)을 조사하고, 국제 사법 재판소의 역할과 한계를 파악한다."],["12국관04-03","국제 사회에서 다양한 지역 통합이 이루어지는 현상과 그 이유를 확인하고, 지역 기구의 구성원으로서 우리나라의 역할을 토론한다."]],"금융과 경제생활":[["12금융01-01","행복하고 안전한 금융 생활에 필요한 금융 정보를 탐색하고 평가하며, 단기와 장기의 관점을 고려하여 합리적인 금융 의사 결정을 한다."],["12금융01-02","디지털 금융 환경에서 나타난 금융 서비스의 변화된 특징을 이해하고 디지털 금융 서비스를 효과적으로 이용한다."],["12금융01-03","안전한 금융 거래를 위한 계약(약관)의 중요성을 인식하고, 금융 사기 예방과 피해 구제를 위해 마련된 주요 금융 소비자 보호 제도를 탐구한다."],["12금융02-01","소득이 수입의 주요 원천임을 이해하고 소득에 영향을 미치는 다양한 요인을 탐구한다."],["12금융02-02","소비 지출과 비소비 지출을 구분하고 지출에 영향을 미치는 요인을 파악하여 합리적인 소비를 실천한다."],["12금융02-03","예산의 의미와 예산 관리 방법을 이해하고 자신의 금융 생활에서 예산을 수립⋅점검⋅평가한다."],["12금융03-01","저축의 경제적 의의와 다양한 저축 상품의 특징을 이해하고 저축에 영향을 미치는 요인을 탐구한다."],["12금융03-02","기본적인 금융 투자 상품의 종류와 특징을 이해하고 투자에 영향을 미치는 요인을 탐구한다."],["12금융03-03","저축과 투자의 장단점을 고려하여 자기 책임의 원칙에 따라 저축과 투자를 결정하며, 활용할 수 있는 예금자 보호 제도와 투자자 보호 제도를 탐색한다."],["12금융04-01","신용 사용의 결과를 고려한 책임감 있는 신용 관리 태도를 기르고, 신용에 영향을 미치는 요인을 파악하여 자신의 신용을 효과적으로 관리하는 방법을 탐구한다."],["12금융04-02","위험 관리의 필요성과 위험 관리 방법으로서 보험의 원리를 이해하고, 주요 보험 상품의 특징을 비교한다."],["12금융04-03","고령 사회에서 노후 설계의 필요성을 이해하고, 연금의 종류와 특징을 파악하여 안정적인 노후 대비 계획을 설계한다."]],"기본수학1":[["10기수1-01-01","다항식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."],["10기수1-01-02","다항식의 곱셈과 나눗셈의 원리를 이해하고, 그 계산을 할 수 있다."],["10기수1-01-03","인수분해 공식을 이용하여 다항식의 인수분해를 할 수 있다."],["10기수1-02-01","간단한 이차방정식을 풀 수 있다."],["10기수1-02-02","이차방정식에서 판별식을 이해하고, 근의 존재성을 판단할 수 있다."],["10기수1-02-03","이차함수의 뜻을 알고, 이차함수의 그래프의 성질을 설명할 수 있다."],["10기수1-02-04","이차방정식과 이차함수를 연결하여 그 관계를 이해한다."],["10기수1-02-05","이차함수의 최대, 최소를 이해하고, 간단한 문제를 해결할 수 있다."],["10기수1-02-06","부등식의 성질을 설명하고, 일차부등식을 풀 수 있다."],["10기수1-02-07","미지수가 1개인 연립일차부등식을 풀 수 있다."],["10기수1-02-08","절댓값을 포함한 간단한 일차부등식을 풀 수 있다."],["10기수1-02-09","이차부등식과 이차함수를 연결하여 그 관계를 이해하고, 간단한 이차부등식을 풀 수 있다."],["10기수1-03-01","합의 법칙과 곱의 법칙을 이해하고, 적절한 전략을 사용하여 경우의 수와 관련된 문제를 해결할 수 있다."],["10기수1-03-02","순열의 개념을 이해하고, 순열의 수를 구할 수 있다."],["10기수1-03-03","조합의 개념을 이해하고, 조합의 수를 구할 수 있다."],["10기수1-04-01","행렬의 뜻을 알고, 실생활 상황을 행렬로 표현할 수 있다."],["10기수1-04-02","행렬의 연산을 수행하고, 간단한 문제를 해결할 수 있다."]],"기본수학2":[["10기수2-01-01","두 점 사이의 거리를 계산할 수 있다."],["10기수2-01-02","직선의 방정식을 구하고, 그래프를 그릴 수 있다."],["10기수2-01-03","두 직선의 평행 조건과 수직 조건을 이해하고, 관련된 문제를 해결할 수 있다."],["10기수2-01-04","원의 방정식을 구하고, 그래프를 그릴 수 있다."],["10기수2-01-05","좌표평면에서 원과 직선의 위치 관계를 판단할 수 있다."],["10기수2-01-06","평행이동을 이해하고, 실생활과 연결할 수 있다."],["10기수2-01-07","원점, x축, y축, 직선 y=x에 대한 대칭이동을 이해하고, 실생활과 연결할 수 있다."],["10기수2-02-01","집합의 개념을 이해하고, 집합을 표현할 수 있다."],["10기수2-02-02","두 집합 사이의 포함관계를 판단할 수 있다."],["10기수2-02-03","두 제안한다."],["12기가01-02","생활문화에 대한 문화감수성을 바탕으로 한국 의식주 생활문화의 독창적 요소를 탐색 하고, 다른 나라의 생활문화를 비교⋅분석한다."],["12기가01-03","식생활문화에 반영된 미래 변화의 요소를 발견하고 이를 비판적으로 수용하여 식생활 문제를 개선하고 건강한 식생활 문화를 실천한다."],["12기가01-04","의생활문화에 반영된 미래 변화의 요소를 발견하고 이를 비판적으로 수용하여 삶의 질을 높이며 지속가능한 의생활 문화를 제안한다."],["12기가01-05","주생활문화에 반영된 미래 변화의 요소를 발견하고 이를 비판적으로 수용하여 안전한 주생활 문화를 영위하는 방안을 제안한다."],["12기가02-01","저출생⋅고령사회에서 생활 설계의 필요성을 인식하고, 전 생애에 걸친 안정적인 삶을 준비하기 위한 생활을 설계한다."],["12기가02-02","경제적 자립의 태도를 갖추기 위해 개인과 가족의 상황에 맞는 가계 재무 설계의 필요성을 이해하고, 가정경제 관리 방안을 계획한다."],["12기가02-03","소비자의 안전을 위협하는 다양한 문제를 비판적으로 성찰하여 소비자 시민성을 반영한 소비생활을 실천한다."],["12기가02-04","생활복지서비스와 일상생활에서 생성되는 빅데이터 적용의 의미를 파악하고 이를 활용하여 생활에 적용할 수 있는 새로운 복지 방안을 제안한다."],["12기가02-05","개인 및 가족의 생애 주기에 따른 맞춤형 스마트 복지 현황을 파악하고 자신이 설정한 삶의 목표 실현에 적용할 수 있는 복지서비스 정책을 제안한다."],["12기가03-01","성년기의 성과 사랑에 관하여 탐구하고, 성인으로서의 독립과 자신과 타인을 보호하는 건강한 관계 맺기의 의미를 추론한다."],["12기가03-02","부모됨의 의미를 성찰하고 건강한 임신과 출산의 방안을 탐색하여 책임 있는 부모가 되기 위해 필요한 역량을 탐색한다."],["12기가03-03","가족 내 소통과 협력의 태도를 기르기 위하여 중년기와 청소년기의 발달 특성을 인식하고 차이와 공통점을 탐구하여 자신과 가족의 생활에 적용한다."],["12기가03-04","후반기 인생 설계의 중요성과 웰다잉의 의미 탐색을 위하여 노년기의 발달 특성을 이해 하며 노년기 삶의 존중 및 나이듦에 대한 긍정적 인식을 함양하고, 유니버설디자인의 배경과 맥락을 파악하여 노년기 생활에 적용할 수 있는 방안을 탐구한다."],["12기가03-05","가족생활에서 발생하는 다양한 위기의 회복과 치유 방안을 탐색하고 회복탄력성을 발휘하여 성장하는 방안을 추론한다."],["12기가04-01","공학이 발달해 온 역사와 공학의 세계를 탐구하는 과정에서 공학의 가치를 인식하고, 미래 사회를 예측한다."],["12기가04-02","공학의 개념을 정의하고 공학의 설계 과정을 이해하며, 공학의 혁신 사례를 조사하여 공학의 가치를 인식한다."],["12기가04-03","기술, 수학, 과학, 예술 등과 융합하여 공학이 발전된 사례를 분석하여 공학의 융합적 특성과 중요성을 이해한다."],["12기가04-04","공학적 문제해결 사례를 통해 창의성, 팀워크, 의사소통 역량과 같은 공학적 소양의 중요성과 필요성을 인식한다."],["12기가04-05","다양한 공학 분야를 탐색하여 공학자의 역할을 이해하고, 자신의 흥미, 적성, 능력에 맞는 공학 분야의 진로를 탐색한다."],["12기가05-01","공학적 문제를 해결하기 위한 아이디어 시각화 과정에서 제도의 기본 규칙에 대한 이해를 바탕으로 컴퓨터를 이용한 디지털 기반의 설계를 적용하며, 아이디어 시각화를 통한 의사소통의 중요성을 인식한다."],["12기가05-02","디지털 기반 설계 및 제조 과정을 이용해 공학적 문제를 해결할 수 있는 제품을 제작하고 산출물을 평가하는 과정에서 공학에 대한 도전적 태도를 기른다."],["12기가05-03","로봇의 구성 및 활용 사례를 바탕으로, 자동화를 위한 제어 장치의 활용 방법을 탐구하고 로봇을 제작하여 인공 세계와 공학 제품에 대한 호기심을 갖는다."],["12기가05-04","친환경 에너지의 종류와 원리, 활용 사례를 탐구하며, 에너지 전환과 관련된 공학적 문제를 해결하는 과정에서 창의적 자신감과 태도를 갖는다."],["12기가05-05","첨단 수송수단 및 항공우주 분야에 사용되는 공학적 지식을 분석하고, 발달 현황 및 미래의 방안을 토의하고 발표하며, 첨단 수송수단 및 항공우주와 관련된 공학 문제를 창의적으로 해결한다."],["12기가06-02","초연결사회와 정보통신 관련 공학 문제를 공학적 문제해결 과정을 통해 해결하고, 산출물 평가를 통해 공학적 의사소통의 중요성을 인식한다."],["12기가06-03","스마트 도시 건설에 필요한 핵심 기술과 동향을 파악하며, 관련한 건설공학 문제를 창의적으로 해결하고 그 과정과 산출물을 평가한다."],["12기가06-04","생명공학이 인류의 식량자원 확보, 온실가스 배출감소, 생명 연장, 의공학의 발전에 기여할 수 있는 방안을 탐구하고, 생명공학과 관련된 문제를 창의적으로 해결하는 과정에서 공학의 가치를 인식한다."],["12기가06-05","다양한 지식과 융합된 공학의 세계를 탐구하고 융합 공학 문제를 해결하며, 그 과정에서 공학에 대한 긍정적 태도와 공학 윤리 실천의 중요성을 인식한다."]],"기하":[["12기하01-01","포물선의 뜻을 알고, 포물선을 방정식으로 표현할 수 있다."],["12기하01-02","타원의 뜻을 알고, 타원을 방정식으로 표현할 수 있다."],["12기하01-03","쌍곡선의 뜻을 알고, 쌍곡선을 방정식으로 표현할 수 있다."],["12기하01-04","이차곡선의 접선의 방정식을 구할 수 있다."],["12기하02-01","직선과 직선, 직선과 평면, 평면과 평면의 위치 관계에 대한 간단한 증명을 할 수 있다."],["12기하02-02","삼수선 정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["12기하02-03","도형의 정사영의 뜻을 알고, 도형과 정사영의 관계를 탐구할 수 있다."],["12기하02-04","좌표공간에서 두 점 사이의 거리와 선분의 내분점의 좌표를 구할 수 있다."],["12기하02-05","구를 방정식으로 표현할 수 있다."],["12기하03-01","벡터의 뜻을 알고, 벡터의 덧셈, 뺄셈, 실수배를 할 수 있다."],["12기하03-02","위치벡터의 뜻을 알고, 벡터와 좌표를 대응시켜 표현할 수 있다."],["12기하03-03","내적의 뜻을 알고, 두 벡터의 내적을 구할 수 있다."],["12기하03-04","벡터를 이용하여 직선의 방정식을 구할 수 있다."],["12기하03-05","좌표공간에서 벡터를 이용하여 평면의 방정식과 구의 방정식을 구할 수 있다."]],"기후변화와 지속가능한 세계":[["12기지01-01","지구적 차원에서 나타나는 기후변화의 심각성을 사례를 통해 파악하고, 기후변화를 바라보는 관점의 다양성을 이해한다."],["12기지01-02","기후변화는 자연적 요인뿐만 아니라 인간의 다양한 활동 및 산업과 관련되어 있다는 점을 이해하고, 탄소중립을 위한 사회 변화의 방향을 탐구한다."],["12기지02-01","세계 여러 지역에서 발생하고 있는 기후재난의 실제를 파악하고, 이를 둘러싼 쟁점을 다양한 자료를 통하여 분석한다."],["12기지02-02","기후변화의 영향은 지리적 조건 및 사회적⋅경제적 조건에 따라 차별적으로 나타나고 있음을 이해하고, 이와 관련한 쟁점과 사례를 조사한다."],["12기지02-03","기후정의의 관점에서 기후변화에 따른 불평등 문제의 해결 방안을 모색하고, 기후변화에 대한 인간의 책임과 의무에 대해 성찰한다."],["12기지03-01","기후변화 대응을 위한 국제 사회의 협력과 시민사회의 노력 사례를 조사하고 기후변화를 둘러싼 이해당사자들의 서로 다른 입장과 가치를 비교한다."],["12기지03-02","기후변화 문제와 관련하여 국가 차원의 대응으로서 정치, 사회, 경제 영역에서의 생태전환을 위한 실천 사례를 조사하고, 이를 분석 평가한다."],["12기지03-03","지역 공동체의 생태전환을 위한 다양한 노력 사례를 조사하고 지역의 지속가능한 사회⋅생태 체계를 탐색한다."],["12기지03-04","기후변화에 대응하기 위한 적정기술과 순환경제의 역할의 중요성을 파악하고, 에너지 전환의 중요성에 대한 이해를 바탕으로 지속가능한 세계의 모습을 제안한다."],["12기지04-01","지속가능발전목표(SDGs)의 의미를 이해하고, 이의 실천과 관련한 지역 사례들을 조사하여 환경적, 경제적, 사회적 측면에서 통합적으로 분석한다."],["12기지04-02","지속가능한 세계는 개인의 일상생활 방식과 관련되어 있음을 이해하고, 다양한 소비 영역에서 요구되는 지속가능한 생활방식을 탐색하고 실천 방안을 제안한다."],["12기지04-03","정의, 책임 그리고 배려 등과 같은 생태시민의 덕목을 사례 탐구를 통해 이해하고, 인간 및 비인간이 함께 평화롭게 살아가는 공존의 세계를 위한 다층적 스케일에서의 실천 방안을 찾아 적극적으로 참여한다."]],"기후변화와 환경생태":[["12기환01-01","날씨와 기후의 특성을 이해하고, 이를 비교하여 설명할 수 있다."],["12기환01-02","기후시스템이 유지되는 되먹임 과정을 이해하고 생물권과 다른 권역 간 상호작용을 설명할 수 있다."],["12기환01-03","기후변화가 생태계와 우리의 생활환경에 영향을 미친 사례를 조사하여 발표할 수 있다."],["12기환02-01","기후위기가 일어나는 주요 원인을 이해하고, 기후위기의 심각성을 인식할 수 있다."],["12기환02-02","빙상의 융해와 열팽창으로 인한 해수면 상승을 기후변화와 연계하여 설명할 수 있다."],["12기환02-04","기후변화 시나리오에 따른 미래 생태계 변화 예측 보고서를 찾아보고, 미래의 기후와 생태계의 변화 양상을 추론할 수 있다."],["12기환02-05","꽃의 개화 시기 변화 자료를 조사하고, 꽃의 개화 시기 변화가 우리 생활에 끼치는 영향을 추론할 수 있다."],["12기환02-06","꿀벌을 비롯한 곤충의 개체 수 감소 원인을 기후변화와 연계하여 설명할 수 있다."],["12기환02-07","수생태계의 물꽃 현상을 이해하고, 기후변화가 수생태계의 생물다양성에 끼치는 영향을 추론할 수 있다."],["12기환02-08","모기나 파리와 같은 곤충 매개 감염병이 새롭게 출현하거나 급격히 확산되는 현상을 기후변화와 연계하여 설명할 수 있다."],["12기환03-01","산호의 멸종으로 인한 백화현상의 예를 통해 기후변화가 해양생태계에 미치는 영향을 살펴보고, 바다 사막화를 예방하거나 복원할 수 있는 과학기술의 사례를 제시할 수 있다."],["12기환03-02","기후변화에 따라 가속화되는 사막화, 대형산불, 지역적 가뭄과 홍수 등을 이해하고, 이를 극복하기 위한 인류의 노력에 대해 토의할 수 있다."],["12기환03-03","탄소중립 사회를 이루기 위한 탄소 저감 관련 과학기술 개발 현황을 알아보고, 이의 적용 사례를 제시할 수 있다."]],"논리와 사고":[["12논리01-01","인간 사고의 형태 중 논리적 사고를 구별하고, 추론과 논증의 특징을 이해한다."],["12논리01-02","다양한 논리적 오류를 분석하고 평가한다."],["12논리01-03","비판적 태도를 바탕으로 합리적 의사 결정을 한다."],["12논리02-01","연역과 귀납의 특징을 이해하고, 이들을 비교하여 구별한다."],["12논리02-02","논증을 분석하여 연역 논증의 타당성과 건전성, 귀납 논증의 설득력을 평가한다."],["12논리02-03","좋은 논증을 구성하여 토론 및 글쓰기에 활용한다."],["12논리03-01","논리 기호를 활용하여 복잡한 주장을 형식화하고 그 논리적 관계를 밝힌다."],["12논리03-02","논리 기호를 활용하여 논증의 타당성을 판단하고 증명한다."],["12논리03-03","자연 연역의 추론 규칙을 활용하여 함축된 정보를 파악한다."],["12논리03-04","연역 논리와 코딩은 모두 논리 절차에 따라 문제를 해결한다는 것을 이해한다."],["12논리04-01","귀납 추론의 종류를 이해하고, 귀납 논증을 평가한다."],["12논리04-02","가설과 증거 사이의 논리적 관계를 분석하고 사회 과학 및 자연 과학에서 활용되는 과학적 방법의 특징을 이해한다."],["12논리04-03","증거를 중시하는 관점에서 과학적 추론에 사용되는 확률과 통계의 역할을 이해한다."],["12논리04-04","머신 러닝에서 활용되는 귀납 논리의 특징을 이해한다."]],"논술":[["12논술01-01","논술은 지식의 수용과 전달 및 합리적 설득을 위한 의사소통 방법임을 이해하고, 합리적 설득과 비합리적 설득의 차이를 비교⋅탐색한다."],["12논술01-02","비판적 사고의 의미와 필요성을 이해하고 논술이 비판적 사고에 기반한 글쓰기임을 인식한다."],["12논술01-03","자료 활용 방법과 글쓰기 윤리를 이해하고 글쓰기에 적용한다."],["12논술02-01","텍스트 분석 및 요약의 필요성을 이해하고, 텍스트의 유형별 차이를 비교⋅탐색한다."],["12논술02-02","텍스트 유형별 분석 방법을 이해하고 분석에 적용한다."],["12논술02-03","텍스트에 대한 분석 결과 및 요약의 일반 규칙을 적용하여 텍스트의 유형에 맞는 요약문을 작성한다."],["12논술03-01","논증적 텍스트 평가의 의미와 필요성을 이해하고, 필수 평가 요소와 일반 평가 요소의 차이를 비교⋅탐색한다."],["12논술03-02","필수 평가 요소와 일반 평가 요소를 적용하여 논증적 텍스트를 평가한다."],["12논술03-03","평가 내용을 중심으로 평가문을 작성한다."],["12논술04-01","주장하는 글쓰기의 의미와 작성 시 주의 사항을 이해하고, 자신의 견해를 논리적이고 체계적으로 밝히는 글쓰기의 필요성을 인식한다."],["12논술04-02","합리적 설득의 의미와 필요성을 이해하고, 다양한 자료와 정보를 활용하여 적절한 근거를 제시하며 주장의 정당성을 입증하는 글을 작성한다."],["12논술04-03","퇴고⋅수정하는 방법에 대한 이해를 바탕으로 글의 구성이나 내용을 정확하고 치밀하게 검토하며 글을 완성한다."]],"대수":[["12대수01-01","거듭제곱과 거듭제곱근의 뜻을 알고, 그 성질을 이용하여 계산할 수 있다."],["12대수01-02","지수가 유리수, 실수까지 확장될 수 있음을 이해하고, 이를 설명할 수 있다."],["12대수01-03","지수법칙을 이해하고, 이를 이용하여 식을 간단히 나타낼 수 있다."],["12대수01-04","로그의 뜻을 알고, 그 성질을 이용하여 계산할 수 있다."],["12대수01-05","상용로그를 이해하고, 이를 실생활과 연결하여 문제를 해결할 수 있다."],["12대수01-06","지수함수와 로그함수의 뜻을 알고, 이를 설명할 수 있다."],["12대수01-07","지수함수와 로그함수의 그래프를 그릴 수 있고, 그 성질을 설명할 수 있다."],["12대수01-08","지수함수, 로그함수를 활용하여 문제를 해결할 수 있다."],["12대수02-01","일반각과 호도법의 뜻을 알고, 그 관계를 설명할 수 있다."],["12대수02-02","삼각함수의 개념을 이해하여 사인함수, 코사인함수, 탄젠트함수의 그래프를 그리고, 그 성질을 설명할 수 있다."],["12대수02-03","사인법칙과 코사인법칙을 이해하고, 실생활 문제를 해결할 수 있다."],["12대수03-01","수열의 뜻을 설명할 수 있다."],["12대수03-02","등차수열의 뜻을 알고, 일반항, 첫째항부터 제n항까지의 합을 구할 수 있다."],["12대수03-03","등비수열의 뜻을 알고, 일반항, 첫째항부터 제n항까지의 합을 구할 수 있다."],["12대수03-04","∑의 뜻과 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["12대수03-05","여러 가지 수열의 첫째항부터 제n항까지의 합을 구하는 방법을 설명할 수 있다."],["12대수03-06","수열의 귀납적 정의를 설명할 수 있다."],["12대수03-07","수학적 귀납법의 원리를 이해하고, 이를 이용하여 명제를 증명할 수 있다."]],"데이터 과학":[["12데과01-01","데이터 과학의 개념을 이해하고, 문제 해결 사례를 데이터 기반 의사 결정 상황에 적용한다."],["12데과01-02","정형 데이터와 비정형 데이터를 구분하고, 데이터 속성에서 데이터의 잠재적 가치를 파악한다."],["12데과01-03","데이터셋의 집합인 데이터베이스를 이해하고, 서로 다른 데이터셋의 데이터를 분석이 가능한 형태로 통합하는 것의 의미를 파악한다."],["12데과01-04","데이터로 인한 사회 변화를 인식하고, 진로 및 직업과 관련한 데이터 기반 문제 해결 사례를 분석한다."],["12데과02-01","데이터를 편향되지 않도록 수집하고, 수집된 데이터의 특성을 분석한다."],["12데과02-02","이상치와 결측치 탐색 및 정규화를 통해 전처리하여 오류 가능성을 최소화하고, 데이터 분석을 위해 시각화한다."],["12데과02-03","데이터를 분석하기 위해 데이터 속성 간의 관계를 파악하고 통합한다."],["12데과02-04","동일한 데이터를 서로 다른 분석 방법을 적용하여 분석 결과를 비교한다."],["12데과03-01","데이터 모델 개념을 이해하고 데이터 분석에 활용할 수 있는 도구를 탐색한다."],["12데과03-02","동일한 데이터를 통계적 회귀모델과 기계학습을 통한 회귀모델로 분석하여 결과 해석 내용을 비교한다."],["12데과03-03","데이터의 속성에 대한 유사성을 측정하고 분석하여 군집을 형성하고, 군집 분석 결과의 의미를 해석한다."],["12데과03-04","데이터 간의 관계를 분석하고 상호 연관성을 파악하여 결과의 의미를 해석한다."],["12데과03-05","데이터 분석 방법에 따른 데이터 모델의 분석 결과를 비교하고 평가한다."],["12데과03-06","다양한 분석 방법을 비교하고 평가하여 분석 목적에 가장 적합한 분석 방법을 적용한다."],["12데과04-01","분야별 데이터 과학의 적용 사례를 조사하여 분석하고, 데이터로 해결 가능한 주제를 찾아 적합성을 판단한다."],["12데과04-02","수집된 데이터를 탐색적으로 분석하여 데이터 속 의미를 파악하고, 문제 해결을 위한 창의적인 방법을 구상한다."],["12데과04-03","데이터 분석을 진행할 때, 2개 이상의 방법을 사용하여 분석하고 결과를 비교한다."],["12데과04-04","복잡하고 어려운 문제라도 끝까지 해결하기 위한 자세를 갖추고 분석하여, 분석 결과에 대한 의미를 해석한다."],["12데과04-05","분석을 위한 목적부터 데이터 수집 및 분석에 이르는 전 과정을 성찰하고, 사회적 영향을 고려하여 분석 결과의 활용방안을 탐색한다."]],"도시의 미래 탐구":[["12도탐01-01","도시의 의미를 이해하고, 도시의 특성이 도시적 생활양식에 미치는 영향을 일상 공간을 사례로 탐구한다."],["12도탐01-02","도시의 발달과정에 대한 이해를 바탕으로 하여 다양한 유형의 도시를 비교하고, 내가 사는 도시의 발달과정을 탐구한다."],["12도탐01-03","살기 좋은 도시에 대한 다양한 관점을 비교하고, 살기 좋은 도시의 사례와 특징을 조사한다."],["12도탐02-01","도시 간의 상호 작용과 교류에 의해 형성되는 도시 체계를 이해하고, 도시 공간 구조는 고정되지 않고 지속해서 재구성됨을 인식한다."],["12도탐02-02","문화 자산을 활용한 도시 브랜딩과 건축이 도시의 경관과 도시에 대한 인식 변화에 미친 영향을 탐구한다."],["12도탐02-03","서비스업의 성장과 소비주의 심화가 도시 경제와 도시의 경관, 생활양식 변화에 미친 영향을 분석한다."],["12도탐02-04","첨단 산업과 모빌리티의 발달이 도시의 성장과 쇠퇴에 미치는 영향을 조사하고, 정보통신기술의 발달로 출현하고 있는 스마트 도시를 사례로 살고 싶은 도시의 미래 모습을 예측한다."],["12도탐03-01","도시의 환경 문제와 재난은 자연적 요인과 사회적 요인이 복합적으로 작용하여 발생하고 있음을 사례를 통해 파악하고, 이를 공간 정의의 관점에서 분석하여 해결 방안을 탐색한다."],["12도탐03-02","부동산에 대한 인식 변화와 도시의 주거 문제 심화 사례를 조사하고, 이를 공간 정의의 관점에서 분석하여 해결 방안을 탐색한다."],["12도탐03-03","국제 이주에 따라 도시의 인구 구성과 공간 구조가 변화하여 발생하는 문제를 조사하고, 도시 구성원들의 다양성과 차이를 존중하고 공존하는 방안을 모색한다."],["12도탐04-01","지속가능성과 회복력이 높은 도시가 되기 위한 요건에 대해 토의하고 이와 관련한 도시 계획 및 도시 혁신 사례를 탐구한다."],["12도탐04-02","도시의 공공성을 높이기 위한 도시 정치의 중요성을 이해하고, 도시를 만들어가는 주체로서 시민이 가져야 할 바람직한 태도를 함양하여 도시 정치에 적극적으로 참여한다."]],"독서 토론과 글쓰기":[["12독토01-01","개인이나 공동체의 관심사를 고려하여 읽을 책을 선정한 후 질문을 생성하고 주체적으로 해석하며 책을 읽는다."],["12독토01-02","대화, 토의, 토론 등 적절한 방법을 활용하여, 서로 다른 생각과 관점을 존중하며 독서 토론을 한다."],["12독토01-03","독서 토론의 내용을 바탕으로 쓰기 목적, 독자, 매체를 고려하여 글을 쓰고 공유한다."],["12독토01-04","인간의 삶에 대한 다양한 시각과 해석이 담긴 책을 읽고 독서 토론하고 글을 쓰며 자아를 탐색하고 타자와 세계를 이해한다."],["12독토01-05","다양한 분야의 정보가 담긴 책을 읽고 독서 토론하고 글을 쓰며 학습이나 삶에 필요한 지식을 확장하고 교양을 함양한다."],["12독토01-06","사회적인 현안이나 쟁점이 담긴 책을 읽고 독서 토론하고 글을 쓰며 공동체 문제를 해결하고 사회적 담론에 참여한다."],["12독토01-07","독서 토론과 글쓰기의 특성을 이해하고 독서, 독서 토론, 글쓰기에 능동적으로 참여한다."]],"독서와 작문":[["12독작01-01","독서와 작문의 의사소통 방법과 특성을 이해하고 문어 의사소통 생활을 주도적으로 실천하고 성찰한다."],["12독작01-02","독서의 목적과 작문의 맥락을 고려하여 가치 있는 글이나 자료를 탐색하고 선별한다."],["12독작01-03","글에 드러난 정보를 바탕으로 글의 내용을 파악하고 글에 드러나지 않은 정보를 추론하며 읽는다."],["12독작01-04","글의 내용이나 관점, 표현 방법, 필자의 의도나 사회⋅문화적 이념을 평가하며 읽는다."],["12독작01-05","글을 읽으며 다양한 내용 조직 방법과 표현 전략을 찾고 이를 글쓰기에 활용한다."],["12독작01-06","자신의 글을 분석적⋅비판적 관점으로 읽고, 내용과 형식을 효과적으로 고쳐 쓴다."],["12독작01-07","인간과 예술을 다룬 인문⋅예술 분야의 글을 읽고 삶과 예술에 대한 자신의 생각을 담은 글을 쓴다."],["12독작01-08","사회적⋅역사적 현상이나 쟁점 등을 다룬 사회⋅문화 분야의 글을 읽고 사회⋅문화적 사건이나 역사적 인물에 대한 관점을 담은 글을 쓴다."],["12독작01-09","과학⋅기술의 원리나 지식을 다룬 과학⋅기술 분야의 글을 읽고 과학⋅기술의 개념 이나 현상을 설명하는 글을 쓴다."],["12독작01-10","글이나 자료에서 가치 있는 정보를 수집하고 효과적으로 조직하면서 정보를 전달하는 글을 쓴다."],["12독작01-11","글이나 자료에서 타당한 근거를 수집하고 효과적인 설득 전략을 활용하여 논증하는 글을 쓴다."],["12독작01-12","정서 표현과 자기 성찰의 글을 읽고 자신의 정서를 진솔하게 표현하거나 자신의 삶을 성찰하는 글을 쓴다."],["12독작01-13","다양한 글을 주제 통합적으로 읽고 학습의 목적과 교과의 특성을 고려하여 학습을 위한 글을 쓴다."],["12독작01-14","매체의 유형과 특성을 고려하며 글이나 자료를 읽고 쓴다."],["12독작01-15","독서와 작문의 관습과 소통 문화를 이해하고 공동체의 소통 문화 및 담론 형성에 책임감 있게 참여한다."]],"독일 문화":[["12독문01-01","독일어권 문화에 대한 다양한 내용을 이해한다."],["12독문01-02","독일어권 문화에 대한 다양한 내용을 이해하여 독일어 의사소통 상황에 활용한다."],["12독문01-03","독일어권 문화에 대한 자료를 다양한 매체를 활용하여 조사하고, 정리한 내용을 설명한다."],["12독문01-04","독일어권 문화와 자신의 관심 분야를 연계하여 조사하고 정리･심화한다."],["12독문01-05","독일어권 문화에 대한 자료를 분석하고 비판적으로 해석하여 다양한 매체를 통해 공유한다."],["12독문01-06","독일어권 문화와 우리 문화의 차이점과 공통점을 비교한다."],["12독문01-07","독일어권 문화에 대해 호기심을 갖고 탐구 활동에 적극적으로 참여한다."]],"독일어":[["12독어01-01","낱말이나 간단한 구를 듣고 소리와 낱말을 식별한다."],["12독어01-02","낱말이나 간단한 구, 간단한 문장을 듣고 의미를 이해한다."],["12독어01-03","일상적이고 친숙한 주제의 대화나 자료를 듣고 정보와 맥락을 파악한다."],["12독어01-04","듣기 자료나 상대방의 말을 경청하며 적극적으로 호응한다."],["12독어02-01","낱말이나 간단한 구, 간단한 문장을 발음 규칙에 유의하여 말한다."],["12독어02-02","간단한 의사소통 표현을 사용하여 상황과 맥락에 맞게 대화한다."],["12독어02-03","일상적이고 친숙한 주제에 대해 자신의 생각이나 느낌을 말한다."],["12독어02-04","상대방을 존중하며 말하기 활동에 적극적으로 참여한다."],["12독어03-01","낱말이나 간단한 구, 간단한 문장을 발음 규칙에 유의하여 소리 내어 읽는다."],["12독어03-02","낱말이나 간단한 구, 간단한 문장을 읽고 의미와 내용을 이해한다."],["12독어03-03","간단한 대화문이나 텍스트를 읽고 정보와 맥락을 파악한다."],["12독어04-01","낱말이나 간단한 구, 간단한 문장을 어법에 맞게 쓴다."],["12독어04-02","간단한 대화문이나 텍스트를 상황과 목적에 맞게 작성한다."],["12독어04-03","글쓰기에 흥미를 갖고 쓰기 활동에 적극적으로 참여한다."],["12독어05-01","독일어권 문화 내용을 이해한다."],["12독어05-02","독일어권 문화 내용을 다양한 매체를 활용하여 조사하고 설명한다."],["12독어05-03","독일어권 문화 내용을 이해하여 독일어 의사소통 상황에 활용한다."],["12독어05-04","독일어권 문화에 대해 호기심을 갖고 탐구 활동에 적극적으로 참여한다."]],"독일어 회화":[["12독회01-01","낱말이나 구, 문장을 강세와 억양에 유의하여 자연스럽게 말한다."],["12독회01-02","구나 문장을 활용하여 다양한 상황을 묘사한다."],["12독회01-03","다양한 주제에 대한 사실적 정보를 설명한다."],["12독회01-04","자신의 감정이나 의사를 적절한 표현으로 말한다."],["12독회01-05","다양한 주제에 대해 자신의 생각과 입장을 논리적으로 말한다."],["12독회01-06","상황과 맥락에 맞게 다양한 의사소통 표현을 활용하여 대화한다."],["12독회01-07","상대방의 말을 듣고 의도를 파악하거나 추론하여 대화를 이어간다."],["12독회01-08","일상생활과 관련하여 세부 정보를 묻거나 대답한다."],["12독회01-09","다양한 매체를 통해 이해한 내용을 요약하여 말한다."],["12독회01-10","대면 또는 비대면 의사소통 활동에 흥미와 자신감을 가지고 협력적으로 참여한다."]],"동아시아 역사 기행":[["12동역01-01","역사 기행을 통한 탐구의 방법을 이해하고, 동아시아의 범위와 특징을 파악한다."],["12동역01-02","생태환경을 바탕으로 형성된 유목 세계, 농경 세계, 해양 세계의 삶을 이해한다."],["12동역02-01","동아시아의 지역 간 교류를 보여주는 문화유산을 탐구한다."],["12동역02-02","종교와 사상을 중심으로 동아시아 각 지역 간 교류 양상을 파악한다."],["12동역02-03","몽골의 팽창 및 17세기 전후 동아시아 전쟁이 초래한 변화를 이해한다."],["12동역02-04","이슬람과 유럽 세력의 참여를 통해 확대된 동아시아 교류의 모습을 탐구한다."],["12동역03-01","동아시아 지역에서 전개된 제국주의 열강의 침략 전쟁을 탐구한다."],["12동역03-02","아시아⋅태평양 전쟁과 이에 대한 저항과 연대의 움직임을 파악한다."],["12동역03-03","제국주의 열강의 침략과 전쟁이 지역 생활과 생태환경에 끼친 영향을 탐구한다."],["12동역04-01","냉전 시기 동아시아 지역에서 전개된 전쟁을 탐구하고, 각국의 정치⋅사회적 변화를 파악한다."],["12동역04-02","경제 및 대중문화 교류가 확대되는 모습을 이해하고, 다문화 사회의 현실을 파악하여 공존을 위한 노력을 모색한다."],["12동역04-03","동아시아의 역사 및 영토 갈등과 새롭게 대두되는 문제를 파악하고 해결하려는 자세를 갖는다."]],"러시아 문화":[["12러문01-01","러시아 문화 내용을 이해한다."],["12러문01-02","러시아의 문화 내용을 러시아어 의사소통 상황에 활용한다."],["12러문01-03","러시아 문화의 세계적 의미를 이해한다."],["12러문01-04","디지털 등 다양한 매체를 활용하여 러시아 문화의 내용을 조사한다."],["12러문01-05","러시아 문화와 우리 문화의 공통점과 차이점을 이해한다."],["12러문01-06","러시아 문화와 자신의 관심 분야를 연계하여 조사하고 내용을 정리ㆍ심화한다."],["12러문01-07","타 문화 수용과 문화다양성 존중의 태도와 자세의 필요성에 대해 이해한다."]],"러시아어":[["12러어01-01","발음 규칙에 유의하여 철자, 낱말을 식별한다."],["12러어01-02","낱말이나 간단한 구, 문장을 듣고 의미를 파악한다."],["12러어01-03","일상적이고 친숙한 주제의 대화나 자료를 듣고 정보와 맥락을 파악한다."],["12러어01-04","듣기 자료나 타인의 말을 듣고 그 의도를 파악하고 적절히 반응한다."],["12러어02-01","낱말이나 간단한 구, 문장을 강세와 억양에 유의하여 말한다."],["12러어02-02","간단한 의사소통 표현을 사용하여 상황과 맥락에 맞게 대화한다."],["12러어02-03","일상적이고 친숙한 주제에 대해 자신의 생각이나 느낌을 말한다."],["12러어02-04","타인을 존중하며 말하기 활동에 적극적으로 참여한다."],["12러어03-01","낱말이나 간단한 구, 문장을 강세와 억양에 유의하여 소리 내어 읽는다."],["12러어03-02","낱말이나 간단한 구, 문장을 읽고 의미와 내용을 이해한다."],["12러어03-03","간단한 대화문이나 글을 읽고 정보와 맥락을 파악한다."],["12러어03-04","다양한 관점과 의견을 존중하며 읽기 활동에 자기주도적으로 참여한다."],["12러어04-01","낱말, 간단한 구, 문장을 정서법과 어법에 맞게 쓴다."],["12러어04-02","간단한 글과 서식을 상황과 목적에 맞게 작성한다."],["12러어04-03","글쓰기에 흥미를 갖고 쓰기 활동에 자기주도적으로 참여한다."],["12러어05-01","러시아 문화 내용을 이해한다."],["12러어05-02","러시아 문화 내용을 조사하여 설명한다."],["12러어05-03","러시아 문화 내용을 러시아어 의사소통 상황에 활용한다."],["12러어05-04","러시아 문화에 관심을 갖고 수업이나 과제 활동에 자기주도적으로 참여한다."]],"러시아어 회화":[["12러회01-01","낱말, 구, 문장을 발음･강세･억양에 유의하여 말한다."],["12러회01-02","구나 문장을 활용하여 다양한 상황을 묘사한다."],["12러회01-03","다양한 주제에 대한 사실적 정보를 설명한다."],["12러회01-04","자신의 감정이나 의사를 적절한 표현으로 말한다."],["12러회01-05","다양한 주제에 대해 자신의 생각과 입장을 논리적으로 말한다."],["12러회01-06","상황과 맥락에 맞게 다양한 의사소통 표현을 활용하여 대화한다."],["12러회01-07","타인의 말을 듣고 의도를 파악하거나 추론하여 대화를 이어간다."],["12러회01-08","일상생활과 관련하여 세부 정보를 묻거나 대답한다."],["12러회01-09","다양한 매체를 통해 이해한 내용을 요약하여 말한다."],["12러회01-10","대면 또는 비대면 의사소통 활동에 흥미와 자신감을 가지고 협력적으로 참여한다."]],"로봇과 공학세계":[["12로봇01-01","로봇의 공학적 특성과 구성을 이해하고, 융합공학으로서의 로봇을 탐구하여 로봇에 대한 가치를 인식한다."],["12로봇01-02","로봇 하드웨어와 소프트웨어의 탐구를 통해 로봇의 작동 원리를 이해하고 간단한 로봇을 제작하여 로봇에 대한 흥미와 자신감 및 도전 의식을 갖는다."],["12로봇01-03","로봇의 활용 분야를 이해하고 생활 속 다양한 로봇 활용 분야를 탐구하여 로봇 개발과 활용에 대한 긍정적인 사고를 함양한다."],["12로봇01-04","인공지능 기술을 활용한 로봇의 특징과 문제점을 조사⋅분석하고 이를 통해 로봇 개발 및 활용에 대한 바람직한 윤리의식을 함양한다."],["12로봇02-02","건설 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다."],["12로봇02-03","생명 및 환경 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다."],["12로봇02-04","에너지 및 수송 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다."],["12로봇02-05","정보통신 및 인공지능 기술 분야 공학의 개념과 특징을 이해하고 관련 진로를 탐색하며, 관련 분야의 로봇 활용의 가치를 인식한다."],["12로봇02-06","기타 공학 분야의 개념과 특징을 이해하고 해당 분야에서 활용되는 로봇을 탐색하여 로봇 및 공학과 관련된 직업에 대한 흥미와 관심을 높인다."],["12로봇02-07","공학의 각 분야에서 활용되는 로봇의 발전 방향을 조사⋅탐구하고, 로봇의 개발과 활용에 대한 바람직한 윤리의식을 기른다."],["12로봇03-01","로봇공학 프로젝트 수행을 위하여 사용자 공감하기를 바탕으로 로봇공학 문제를 확인하고 정의한다."],["12로봇03-02","로봇공학 프로젝트 수행 과정에서 로봇을 구성하는 하드웨어 및 관련 부품을 제어하는 소프트웨어의 특성을 이해하고, 정보를 수집하고 탐색한다."],["12로봇03-03","로봇공학 프로젝트 수행을 위하여 로봇 제어의 원리를 이해하고, 관련 문제해결을 위한 소프트웨어 알고리즘을 구상한다."],["12로봇03-04","로봇공학 프로젝트 문제해결을 위한 대안 선정, 제작, 작동을 체험하며, 이를 통해 로봇 제작에 대한 흥미와 협력적 태도를 갖는다."],["12로봇03-05","로봇공학 프로젝트 수행 과정과 결과에 대한 평가 및 개선을 통해 창의적 자신감 및 의사소통 능력을 기른다."],["12로봇03-06","제작한 로봇을 시연 및 공유하며 로봇의 활용 분야를 제안하여 로봇에 대한 긍정적 사고와 문제해결에 대한 자신감을 갖는다."]],"매체 의사소통":[["12매의01-01","매체의 기능과 역할에 대한 이해를 바탕으로 시대별 매체 환경과 소통 문화의 변화 과정을 탐색한다."],["12매의01-02","소셜 미디어나 온라인 동영상 플랫폼 등의 디지털 매체 환경에서 청소년 문화가 지닌 문제와 가능성을 탐구한다."],["12매의01-03","영화, 게임, 웹툰 등의 매체 자료가 현실을 재현하는 방식을 분석하며 생산자의 의도나 관점을 파악한다."],["12매의01-04","디지털 매체 환경에서 매체 생산자의 관점을 파악하고 매체 자료의 신뢰성을 판단한다."],["12매의01-05","사회적 규범과 규제가 매체 자료의 생산과 소통에 미치는 영향을 조사하고 그 의미를 탐구한다."],["12매의01-06","개인적⋅사회적 관심사에 대한 자신의 관점이 드러나는 주제를 선정하여 설득력 있는 매체 자료를 제작하고 공유한다."],["12매의01-07","매체 자료의 생산자이자 수용자로서 권리와 책임을 인식하고 사회적 가치와 문제에 대해 소통한다."]],"문학":[["12문학01-01","문학이 인간과 세계에 대한 이해를 돕고, 삶의 의미를 깨닫게 하며, 정서적⋅미적으로 삶을 고양함을 이해한다."],["12문학01-02","문학의 여러 갈래들의 특성과 문학의 맥락에 대해 이해한다."],["12문학01-03","주요 작품을 중심으로 한국 문학의 범위와 갈래, 변화 양상을 탐구한다."],["12문학01-04","한국 문학에 반영된 시대 상황을 이해하고 문학과 역사의 상호 영향 관계를 탐구한다."],["12문학01-05","한국 작품과 외국 작품을 비교하며 읽고 한국 문학의 보편성과 특수성을 파악한다."],["12문학01-06","문학 작품에서는 내용과 형식이 긴밀하게 연관됨을 이해하며 작품을 수용한다."],["12문학01-07","작품을 공감적, 비판적, 창의적으로 감상하며, 다양한 방식으로 작품에 대해 비평한다."],["12문학01-08","작품을 읽고 새로운 시각으로 재구성하거나 주체적인 관점에서 작품을 창작한다."],["12문학01-09","다양한 매체로 구현된 작품의 창의적 표현 방법과 심미적 가치를 문학적 관점에서 수용하고 소통한다."],["12문학01-10","문학을 통하여 자아를 성찰하고, 타자를 이해하며 상호 소통한다."],["12문학01-11","문학을 통해 공동체가 처한 여러 문제들을 이해하고 문제 해결에 참여하는 태도를 지닌다."],["12문학01-12","주체적인 문학 활동을 생활화하여 지속적으로 문학을 즐기는 태도를 지닌다."]],"문학과 영상":[["12문영01-03","문학 작품과 영상물 간의 영향 관계와 상호 작용의 효과를 파악한다."],["12문영01-05","소재가 유사한 문학 작품과 영상물을 비교하면서 통합적으로 수용한다."],["12문영01-06","문학 작품과 영상물을 효과적으로 전달할 수 있는 경로와 매체를 선택하여 공유한다."],["12문영01-07","문학과 영상에 관련된 진로와 분야에서 요구하는 문화적 소양에 대해 탐구한다."],["12문영01-08","문학 작품과 영상물을 비판적으로 수용하며 자신의 삶을 성찰한다."],["12문영01-09","문학 작품과 영상물을 통해 창의적 사고를 표현하고 세계와 적극적으로 소통하는 태도를 가진다."],["12문영01-10","문학 작품과 영상물의 수용과 생산 활동에 따르는 윤리적 책임을 인식하면서 주체적이고 능동적으로 참여한다."]],"물리학":[["12물리01-01","물체에 작용하는 알짜힘과 돌림힘이 0일 때 평형을 이룸을 알고, 다양한 구조물의 안정성을 분석할 수 있다."],["12물리01-02","뉴턴 운동 법칙으로 등가속도 운동을 설명하고, 교통안전 사고 예방에 적용할 수 있다."],["12물리01-03","작용과 반작용 관계와 운동량 보존 법칙을 알고, 스포츠, 교통수단, 발사체 등에 적용할 수 있다."],["12물리01-04","일과 운동 에너지의 관계를 이해하고, 위치 에너지와 역학적 에너지 보존 법칙을 설명할 수 있다."],["12물리01-05","역학적 에너지가 열의 형태로 전환될 때 에너지 총량이 변하지 않음을 설명할 수 있다."],["12물리01-06","열이 역학적 에너지로 전환되는 과정의 효율을 정성적으로 이해하고, 영구기관이 불가능함을 사례를 통해 논증할 수 있다."],["12물리02-01","전하를 띤 입자들이 전기장과 전위차를 형성하여 서로 전기적으로 상호작용함을 설명할 수 있다."],["12물리02-02","전기 회로에서 저항의 연결에 따라 소비 전력이 달라짐을 알고, 다양한 전기 기구에서 적용되는 사례를 찾을 수 있다."],["12물리02-03","축전기에서 전기 에너지를 저장하는 원리가 각종 센서와 전기 신호 입력 장치 등 실생활 제품에서 활용됨을 설명할 수 있다."],["12물리02-04","자성체의 종류를 알고 일상생활과 산업 기술에서 자성체가 활용되는 예를 찾을 수 있다."],["12물리02-05","전류의 자기 작용을 이용하여 에너지를 전환하는 장치의 원리를 알고, 스피커와 전동기 등을 설계할 수 있다."],["12물리02-06","전자기 유도 현상이 센서, 무선통신, 무선충전 등 에너지 전달 기술에 적용되어 현대 문명에 미친 영향을 인식할 수 있다."],["12물리03-01","빛의 중첩과 간섭을 통해 빛의 파동성을 알고, 이를 이용한 기술과 현상을 예를 들어 설명할 수 있다."],["12물리03-02","빛의 굴절을 이용하여 볼록렌즈에서 상이 맺히는 과정을 설명하고, 반도체와 디스플레이 제작 공정에서 중요하게 활용됨을 인식할 수 있다."],["12물리03-03","빛과 물질의 이중성이 전자 현미경과 영상 정보 저장 등 다양한 분야에 활용됨을 설명할 수 있다."],["12물리03-04","수소 선스펙트럼 결과를 바탕으로 보어(Bohr)의 수소 원자 모형을 제시하고, 보어 모형의 한계를 언급한다."],["12물리03-06","모든 관성계에서 빛의 속력이 동일하다는 원리로부터 시간 팽창, 길이 수축 현상이 나타남을 알고, 이러한 지식이 사회에 미친 영향을 조사할 수 있다."]],"물질과 에너지":[["12물에01-01","기체의 온도, 압력, 부피, 몰수 사이의 관계를 통합적으로 이해하고, 이상 기체 방정식을 근사적으로 활용하는 사례를 조사하여 화학의 유용함을 인식할 수 있다."],["12물에01-02","혼합 기체의 부분 압력과 몰 분율의 관계를 알고, 일상생활에서 유용하게 사용되는 혼합 기체에 호기심을 가질 수 있다."],["12물에01-03","물질이 액체로 존재할 수 있는 이유를 분자 간 상호작용으로 이해하고, 액체의 종류에 따라 끓는점이 달라짐을 설명할 수 있다."],["12물에01-04","고체를 결정과 비결정으로 구분하고, 결정성 고체를 화학 결합의 종류에 따라 분류할 수 있다."],["12물에02-01","다른 액체와 구별되는 물의 성질을 수소 결합으로 설명하고, 경이로운 물의 성질에 흥미를 느낄 수 있다."],["12물에02-02","실험 데이터를 이용하여 용액의 농도에 따른 증기압, 끓는점, 어는점의 변화를 비교하고, 일상생활에서 나타나는 사례와 연관 지어 설명할 수 있다."],["12물에02-03","용액의 농도에 따른 삼투현상을 이해하고, 일상생활에서 삼투현상이 나타나는 사례를 찾아 화학 원리가 유용하게 적용됨을 인식할 수 있다."],["12물에03-01","엔탈피의 의미를 알고, 엔탈피를 이용하여 열화학 반응식을 표현할 수 있다."],["12물에03-02","측정하기 어려운 화학 반응의 엔탈피를 헤스 법칙으로 구하여 화학 법칙의 유용성을 인식할 수 있다."],["12물에03-03","엔트로피의 의미를 이해하고, 엔탈피와 엔트로피의 변화로 화학 변화의 자발성을 설명할 수 있다."],["12물에04-01","화학 반응 속도를 반응물의 농도로 표현할 수 있음을 알고, 자료 해석을 통하여 반응 속도식을 구할 수 있다."],["12물에04-02","1차 반응의 반감기가 반응물의 농도에 의존하지 않음을 이해하고, 1차 반응의 반감기가 활용되는 사례를 조사⋅발표할 수 있다."],["12물에04-03","화학 반응에서 유효 충돌과 활성화 에너지의 의미를 알고, 화학 반응이 일어나기 위한 조건에 관심을 가질 수 있다."],["12물에04-04","농도, 온도, 촉매에 따라 반응 속도가 달라짐을 이해하고, 일상생활에서 각각의 예를 찾아 화학의 유용성을 인식할 수 있다."]],"미디어 영어":[["12미영01-01","영어 검색 엔진을 활용하여 필요한 정보를 찾아낸다."],["12미영01-02","다양한 주제에 대한 창의적 문제 해결을 위해 미디어를 활용하여 협업한다."],["12미영01-03","미디어 정보에서 핵심어를 추출하여 내용을 요약하거나 재구성한다."],["12미영01-04","미디어 정보를 비판적 태도로 검색, 선정, 비교 및 분석한다."],["12미영01-05","목적이나 대상에 적합한 미디어를 활용하여 의견이나 정보를 공유한다."],["12미영01-06","미디어 정보를 융합하고 적절한 도구를 활용하여 콘텐츠를 제작한다."],["12미영01-07","미디어에서 접하는 다양한 시청각 단서를 이해하거나 적절하게 표현한다."],["12미영01-08","미디어에 제시된 작품을 감상하고 다양한 관점에서 평가한다."],["12미영01-09","미디어 정보를 창의적⋅비판적으로 처리하기 위해 정보의 출처를 확인하고 정보 보안을 준수한다."],["12미영01-10","오류 수정을 위해 디지털 도구를 적절히 활용한다."]],"미술":[["12미01-01","자신과 세계를 지각하고 미적으로 인식하며, 대상과 현상의 미적 가치를 발견하고 분석할 수 있다."],["12미01-02","시각 문화의 다양성과 의미 전달 방식을 이해하여 시각 문화를 비판적으로 수용하고 향유할 수 있다."],["12미01-03","이미지를 활용한 소통방식을 탐구하여 미술이 삶 속에서 가지는 의미에 대해 공감할 수 있다."],["12미01-04","삶과 연결된 미술을 이해하여 공동체와 생태환경으로 확장할 수 있다."],["12미02-01","다양한 발상으로 주제를 심화하여 작품을 계획할 수 있다."],["12미02-02","주제에 적합한 표현 매체와 방법을 실험하고 융합하는 과정에 집중할 수 있다."],["12미02-03","표현 과정을 성찰하고 새로운 표현 효과를 탐색하여 다음 작품에 반영할 수 있다."],["12미02-04","주제를 확장하기 위한 미술 활동에 관심을 가지고 참여할 수 있다."],["12미03-01","미술의 시대적, 지역적, 사회⋅문화적 변천 과정을 이해하고 작품을 감상하며 자신의 견해를 논리적으로 표현할 수 있다."],["12미03-02","비평 방법을 활용하여 미술과 시대, 사회, 환경과의 상호 관련성을 분석하고 가치를 판단할 수 있다."],["12미03-03","미술 작품 감상과 비평의 관점을 활용한 소통으로 미술 문화의 다원적 가치를 이해하고 존중할 수 있다."],["12미03-04","전시의 목적과 유형을 이해하여 전시를 기획하고 참여할 수 있다."]],"미술 감상과 비평":[["12미감01-01","미술의 역사, 정치, 경제, 사회적 변천 과정과 특징을 분석하여 작가와 작품의 미술 사적 의의를 이해할 수 있다."],["12미감01-02","자신의 삶과 관련된 작가와 작품을 탐색하여 공감하고 진로와 연결할 수 있다."],["12미감01-03","온오프라인 전시 공간에서 작품을 감상하고 해석하며 서로의 의견을 포용할 수 있다."],["12미감01-04","작가와 작품의 특징을 맥락적으로 이해하는 과정에서 문화 다양성을 수용하고 공동체 의식을 함양할 수 있다."],["12미감02-01","미술 작품의 특징, 지식과 정보 등의 근거를 바탕으로 작품의 의미를 이해하고 설명할 수 있다."],["12미감02-02","다양한 미술 비평 방법을 이해하고 활용하여 작품을 해석하고 평가할 수 있다."],["12미감02-03","비평 관점에 따라 자신의 반응을 명료화하고 작품의 가치를 판단하며 미술 용어를 활용하여 논리적으로 표현할 수 있다."],["12미감02-04","사회적 이슈를 비롯하여 타 분야와 연계한 비평 활동으로 형성된 비판적 사고를 사회와 삶으로 확장할 수 있다."]],"미술 창작":[["12미창01-01","다양한 정보를 수집하여 자신의 진로나 관심 분야와 연결된 주제를 탐색할 수 있다."],["12미창01-02","창의적 발상 방법을 알고 아이디어를 시각화할 수 있다."],["12미창01-03","표현 기법과 매체를 탐구하고 이해하여 발견된 문제를 해결할 수 있다."],["12미창01-04","주제에 적합한 표현 매체와 방법을 선정하고 몰입하여 작품을 창작할 수 있다."],["12미창02-01","표현 기법과 매체를 적극적으로 실험하고 융합하여 효과를 발견하고 작품에 적용할 수 있다."],["12미창02-02","도전적 문제 해결 태도로 주제, 표현 기법, 매체 등 작품의 내용과 형식을 심화하여 창작할 수 있다."],["12미창02-03","전시 목적과 방법에 따라 전시를 기획하고 구성하면서 서로 다른 미적 인식을 비판적으로 수용할 수 있다."],["12미창02-04","창작의 과정과 결과의 연결성을 성찰하고 다양성을 존중하여 그 결과를 확장할 수 있다."]],"미술과 매체":[["12미매01-01","시대별, 지역별 매체의 변화를 비교하고 미술과 매체를 관련지을 수 있다."],["12미매01-02","미술에서 매체의 역할과 의미를 탐색하고 미적 가치를 발견할 수 있다."],["12미매01-03","미술에 활용되는 아날로그와 디지털 매체의 개념과 종류를 이해하고 개방적 태도로 표현 매체를 선택할 수 있다."],["12미매01-04","매체의 특성과 표현 원리를 실험하고 작품에 반영할 수 있다."],["12미매02-01","아날로그 매체와 디지털 매체를 창의적으로 활용하여 표현할 수 있다."],["12미매02-02","아날로그와 디지털 매체를 타 분야와 연결하고 융합하며 매체의 가치를 공유할 수 있다."],["12미매02-03","작품의 정교한 표현과 보존 방법을 이해하고 다양한 매체로 표현한 작품을 전시할 수 있다."],["12미매02-04","전시된 작품 속 매체의 효과에 반응하고 공감하며 비판적으로 수용할 수 있다."]],"미적분Ⅰ":[["12미적Ⅰ-01-01","함수의 극한의 뜻을 알고, 이를 설명할 수 있다."],["12미적Ⅰ-01-02","함수의 극한에 대한 성질을 이해하고, 함수의 극한값을 구할 수 있다."],["12미적Ⅰ-01-03","함수의 연속을 극한으로 탐구하고 이해한다."],["12미적Ⅰ-01-04","연속함수의 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["12미적Ⅰ-02-01","미분계수를 이해하고, 이를 구할 수 있다."],["12미적Ⅰ-02-02","함수의 미분가능성과 연속성의 관계를 설명하고, 이를 활용할 수 있다."],["12미적Ⅰ-02-03","함수 y=xⁿ(n은 양의 정수)의 도함수를 구할 수 있다."],["12미적Ⅰ-02-04","함수의 실수배, 합, 차, 곱의 미분법을 알고, 다항함수의 도함수를 구할 수 있다."],["12미적Ⅰ-02-05","미분계수와 접선의 기울기의 관계를 이해하고, 접선의 방정식을 구할 수 있다."],["12미적Ⅰ-02-06","함수에 대한 평균값 정리를 설명하고, 이를 활용할 수 있다."],["12미적Ⅰ-02-07","함수의 증가와 감소, 극대와 극소를 판정하고 설명할 수 있다."],["12미적Ⅰ-02-08","함수의 그래프의 개형을 그릴 수 있다."],["12미적Ⅰ-02-09","방정식과 부등식에 대한 문제를 해결할 수 있다."],["12미적Ⅰ-02-10","미분을 속도와 가속도에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."],["12미적Ⅰ-03-01","부정적분의 뜻을 알고, 이를 설명할 수 있다."],["12미적Ⅰ-03-02","함수의 실수배, 합, 차의 부정적분을 알고, 다항함수의 부정적분을 구할 수 있다."],["12미적Ⅰ-03-03","정적분의 개념을 탐구하고, 그 성질을 이해한다."],["12미적Ⅰ-03-04","부정적분과 정적분의 관계를 이해하고, 다항함수의 정적분을 구할 수 있다."],["12미적Ⅰ-03-05","곡선으로 둘러싸인 도형의 넓이에 대한 문제를 해결할 수 있다."],["12미적Ⅰ-03-06","적분을 속도와 거리에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."]],"미적분Ⅱ":[["12미적Ⅱ-01-01","수열의 수렴, 발산의 뜻을 알고, 이를 판정할 수 있다."],["12미적Ⅱ-01-02","수열의 극한에 대한 성질을 이해하고, 이를 활용하여 극한값을 구하는 방법을 설명할 수 있다."],["12미적Ⅱ-01-03","등비수열의 수렴, 발산을 판정하고, 수렴하는 경우 그 극한값을 구할 수 있다."],["12미적Ⅱ-01-04","급수의 수렴, 발산의 뜻을 알고, 이를 판정할 수 있다."],["12미적Ⅱ-01-05","등비급수의 합을 구하고, 이를 활용할 수 있다."],["12미적Ⅱ-02-01","지수함수와 로그함수의 극한을 구하고 미분할 수 있다."],["12미적Ⅱ-02-02","삼각함수의 덧셈정리를 설명하고, 이를 활용할 수 있다."],["12미적Ⅱ-02-03","삼각함수의 극한을 구하고, 사인함수와 코사인함수를 미분할 수 있다."],["12미적Ⅱ-02-04","함수의 몫을 미분할 수 있다."],["12미적Ⅱ-02-05","합성함수를 미분할 수 있다."],["12미적Ⅱ-02-06","매개변수로 나타낸 함수를 미분할 수 있다."],["12미적Ⅱ-02-07","음함수와 역함수를 미분할 수 있다."],["12미적Ⅱ-02-08","다양한 곡선의 접선의 방정식을 구할 수 있다."],["12미적Ⅱ-02-09","함수의 그래프의 개형을 그릴 수 있다."],["12미적Ⅱ-02-10","방정식과 부등식에 대한 문제를 해결할 수 있다."],["12미적Ⅱ-02-11","미분을 속도와 가속도에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."],["12미적Ⅱ-03-01","함수 y=xⁿ(n은 실수), 지수함수, 삼각함수의 부정적분과 정적분을 구할 수 있다."],["12미적Ⅱ-03-02","치환적분법을 이해하고, 이를 활용할 수 있다."],["12미적Ⅱ-03-03","부분적분법을 이해하고, 이를 활용할 수 있다."],["12미적Ⅱ-03-04","정적분과 급수의 합 사이의 관계를 탐구하고 이해한다."],["12미적Ⅱ-03-05","곡선으로 둘러싸인 도형의 넓이에 대한 문제를 해결할 수 있다."],["12미적Ⅱ-03-06","입체도형의 부피에 대한 문제를 해결할 수 있다."],["12미적Ⅱ-03-07","적분을 속도와 거리에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."]],"법과 사회":[["12법사01-01","가족관계와 관련된 기본적인 내용인 혼인, 출생, 상속 등을 이해하고, 이를 일상생활의 사례에 적용한다."],["12법사01-02","채권 관계와 관련된 기본적인 내용인 계약, 불법행위 등과 사적 자치를 이해하고, 이를 일상생활의 사례에 적용한다."],["12법사01-03","물권 관계와 관련된 기본적인 내용인 부동산⋅동산에 관한 권리의 기능과 특징, 권리와 의무로 구성되는 법(률)관계를 이해하고, 이를 일상생활의 사례에 적용하여 법적 문제를 해결한다."],["12법사02-01","민주주의와 법치주의의 발전 과정을 이해하고, 우리나라 권력 분립의 원리를 탐구한다."],["12법사02-02","우리나라 헌법의 기본 원리와 기본권 내용을 이해하고, 기본권 제한의 요건과 한계를 탐구한다."],["12법사02-03","형법의 의의와 기능을 죄형 법정주의를 중심으로 이해하고, 범죄의 성립 요건과 형벌의 종류, 형사 절차를 탐구한다."],["12법사02-04","법원과 헌법재판소의 법적 문제 해결 과정을 탐구하고, 사법의 의미와 한계를 인식하여 입법론적 해결이 필요한 경우를 탐구한다."],["12법사03-01","법으로 보장되는 근로자의 권리를 이해하고, 이를 일상생활의 사례에 적용한다."],["12법사03-02","인간다운 생활을 보장하려는 사회보장과 경쟁 및 소비자를 보호하기 위한 법적 근거를 탐구하고, 구체적인 사례에서 공공 쟁점을 찾아 토론한다."],["12법사03-03","현대적 법(률)관계의 특징과 지적 재산권의 의미를 이해하고, 이와 관련된 일상생활에서의 사례를 찾아보고 관련 쟁점을 토론한다."],["12법사04-01","학생과 청소년이 누릴 수 있는 권리와 의무를 이해하고, 이를 학교와 일상생활의 사례에 적용한다."],["12법사04-02","학교폭력의 해결 과정을 살펴보며, 학교생활에서 발생하였거나 발생할 수 있는 법적 문제를 발견하고 그 해결 방안을 탐구한다."],["12법사04-03","법적 문제를 해결하는데 필요한 법, 조약, 판례, 입법자료 등을 찾아보고, 민주시민으로서 나와 사회가 당면한 사회적 논의에 참여하는 태도를 가진다."]],"베트남 문화":[["12베문01-01","베트남의 개관 및 생활 문화, 언어문화, 전통문화, 예술 문화 등에 대해 이해한다."],["12베문01-02","베트남 문화 내용을 베트남어 의사소통 상황에 활용한다."],["12베문01-03","베트남 문화에 대해 조사하고, 정보를 분석･정리한다."],["12베문01-04","다양한 매체를 활용하여 베트남 문화에 관한 정보를 전달한다."],["12베문01-05","베트남 문화와 자신의 관심 분야를 연계하여 조사하고, 내용을 정리･심화한다."],["12베문01-06","상호문화적 관점에서 한국 문화와 베트남 문화의 공통점과 차이점을 이해하고 표현한다."],["12베문01-07","베트남 문화에 대해 호기심을 가지고 수업이나 과제 활동에 적극적으로 참여한다."]],"베트남어":[["12베어01-01","낱말이나 간단한 구, 문장을 듣고 발음 및 성조를 식별한다."],["12베어01-02","낱말이나 간단한 구, 문장을 듣고 의미를 파악한다."],["12베어01-03","일상생활과 관련된 간단한 글이나 대화를 듣고 세부 정보나 주제를 파악한다."],["12베어01-04","간단한 듣기 자료나 상대방의 말을 경청하고 적절하게 반응한다."],["12베어02-01","낱말이나 간단한 구, 문장을 발음과 성조에 유의하여 말한다."],["12베어02-02","낱말이나 간단한 의사소통 표현을 상황에 맞게 말한다."],["12베어02-03","일상에서 접하는 대상이나 상황에 대해 묘사하거나 설명한다."],["12베어02-04","일상생활과 관련된 주제에 대해 자신의 생각이나 감정을 말한다."],["12베어02-05","상대방을 존중하는 태도로 말하기 활동에 적극적으로 참여한다."],["12베어03-01","낱말이나 간단한 구, 문장을 발음과 성조에 유의하여 소리 내어 읽는다."],["12베어03-02","낱말이나 간단한 구, 문장을 읽고 의미를 파악한다."],["12베어03-03","간단한 글이나 대화문을 읽고 세부 정보나 주제를 파악한다."],["12베어04-01","낱말이나 간단한 구, 문장을 철자와 성조에 유의하여 쓴다."],["12베어04-02","낱말이나 간단한 구, 문장을 어법에 맞게 쓴다."],["12베어04-03","간단한 글이나 대화문을 상황과 목적에 맞게 작성한다."],["12베어04-04","글쓰기에 흥미를 갖고 표현을 점검하여 고쳐 쓴다."],["12베어05-01","베트남의 개관 및 생활 문화, 언어문화, 전통문화, 예술 문화 등에 대해 이해한다."],["12베어05-02","베트남 문화 내용을 베트남어 의사소통 상황에 활용한다."],["12베어05-03","베트남 문화에 대해 조사하고, 정보를 요약하거나 분석한다."],["12베어05-04","베트남 문화와 관련된 주제에 대해 자신의 생각을 정리하여 설명한다."],["12베어05-05","상호문화적 관점에서 한국 문화와 베트남 문화의 공통점과 차이점을 이해하고 표현한다."]],"베트남어 회화":[["12베회01-01","낱말이나 구, 문장을 발음과 성조에 유의하여 말한다."],["12베회01-02","일상생활과 관련된 글이나 대화를 듣고 내용을 파악한다."],["12베회01-03","낱말이나 구, 문장을 활용하여 상황이나 대상을 묘사한다."],["12베회01-04","다양한 의사소통 표현을 활용하여 자신의 생각이나 감정을 말한다."],["12베회01-05","일상생활에서의 경험이나 사건을 설명한다."],["12베회01-06","다양한 주제에 대해 사실적 정보를 전달한다."],["12베회01-07","듣거나 읽은 내용을 요약하여 말한다."],["12베회01-08","상대방의 말을 듣고 의도를 파악하여 대화를 이어간다."],["12베회01-09","일상생활과 관련하여 세부 정보를 묻거나 답한다."],["12베회01-10","상대방의 말을 경청하고 존중하는 자세로 대화에 적극적으로 참여한다."]],"보건":[["12보건01-02","몸과 마음의 신호와 건강지표를 통해 개인적, 사회적 건강상태를 평가하여 건강관리를 계획하고 생활화한다."],["12보건01-03","생애주기별 건강 특성을 고려한 건강관리 전략을 건강관리 제도와 연관지어 탐색한다."],["12보건01-04","건강관리의 역사를 통해 건강관리에 대한 관점과 전략을 비판적으로 검토하여 건강관리 및 제도 변화 모색에 시사점을 적용한다."],["12보건01-05","개인⋅공동체의 질병예방과 건강관리에 건강생활기술과 건강관리모델을 적용하여 평가하고, 국가적⋅국제적 수준의 건강문제와 이에 대한 건강옹호 방안을 탐색한다."],["12보건02-02","물질 및 행위 중독의 특성, 위험과 영향요인을 분석하고, 개인적, 사회적 측면에서 중독 예방과 지지체계를 탐색하여 제시한다."],["12보건02-03","정서⋅정신건강을 이루는 요소와 관련된 개인적, 사회적 요인을 연계하여 탐구하고, 자아 존중감과 회복 탄력성 및 유대 증진 방안을 도출하여 건강을 관리한다."],["12보건02-04","감정 및 정서가 삶에 미치는 영향과 행복 및 스트레스, 우울⋅불안⋅질병 등을 초래하는 상황의 조건과 의미를 탐구하여, 개인과 공동체의 행복한 삶의 양식을 지지한다."],["12보건02-05","삶과 죽음 및 상실의 개인적, 사회적, 문화적 의미와 이에 대한 질문을 스스로 구성하고 응답하여, 삶의 소중함을 깨닫고 죽음⋅상실에 대한 쟁점에 대해 의사 결정을 할 수 있다."],["12보건03-01","성의 개념을 생물학적 성(sex), 사회⋅문화적 성(gender) 등으로 비교⋅이해하도록 한다."],["12보건03-02","성적 발달과 신체상 및 몸에 대한 권리에 대해 알아보고 성 건강을 관리하며 개선방안을 제안한다."],["12보건03-03","사랑과 성적자기결정권을 사회적 조건과 연계하여 균형 있게 탐색하여 안전하고 행복한 선택을 위한 대처전략을 세우고 실천⋅옹호한다."],["12보건03-04","성 건강 및 권리의 사회적 맥락을 탐색하여 생리, 임신과 피임, 미혼부모 등 건강관리에 균형 있게 적용하고 대안을 모색하는 태도를 갖는다."],["12보건03-05","성매개감염병을 포함하여 성 건강을 위협하는 문제들을 성문화 및 성역할과 관련지어 비판적으로 탐색하여 건강관리에 적용하고 성미디어 문해력 향상을 포함한 개인적⋅사회적 대안과 제도 개선을 제안한다."],["12보건03-06","성폭력을 포함한 성 건강 관련 쟁점 이슈들에 대해 다양한 입장의 근거와 맥락, 고정관념, 차별, 불평등한 상황을 파악하여 건강관리에 적용하고, 법과 제도⋅문화 등 변화 방안을 제안⋅옹호한다."],["12보건04-01","건강안전의 의미와 사회적 영향요인, 위험요인을 평가하고, 개인⋅공동체⋅국가 수준의 예방과 대처, 안전 문화를 포함한 건강안전 지향적 환경 개선을 탐색하고 실천한다."],["12보건04-02","인체의 기초 생리와 병리에 대한 이해를 바탕으로 주요 급⋅만성 질병의 위험요인을 사회적 조건과 관련지어 탐색하고 대비하여 질병이 있어도 함께 건강하게 살아갈 수 있도록 관리한다."],["12보건04-03","감염병과 면역의 원리를 이해하고 개인과 공동체가 지켜야 할 건강수칙과 대응 방안을 사회적 차원에서 비판적으로 탐색하여 생활에 적용한다."],["12보건04-04","직업병과 근로 조건, 작업 환경을 포함한 영향요인 및 법과 제도를 분석하여 안전 수칙을 포함한 예방관리 방안 및 개선방안을 제안한다."],["12보건04-05","다양한 응급상황에서 심폐소생술 및 자동심장충격기 사용을 포함한 응급처치 방법을 익혀서 협력적으로 적용하며, 응급의료체계와 자원의 활용을 포함한 건강 안전 방안을 탐색하고 발전시킨다."],["12보건05-02","권리의식과 책임감을 가지고 건강증진을 위한 건강자원의 활용 가능성, 제도와 정책 개선 방안 제안 등 건강 지향적 환경을 탐색하고 옹호한다."],["12보건05-03","디지털⋅인공지능 시대에 따른 보건의료 서비스 및 제도, 건강정보의 변화를 탐색하고 관련된 쟁점을 종합하여 균형 있게 활용하고 개선방안을 제안한다."],["12보건05-04","기후변화가 건강에 미치는 영향을 탐색하고, 지속가능한 사회를 위한 개인⋅국가⋅세계의 협력과 연대, 옹호 활동의 실천 방안을 탐색한다."],["12보건05-05","개인과 사회의 건강 인식⋅선택⋅행위에 미치는 건강 신념⋅규범⋅관행⋅미디어의 영향을 분석하여 개인과 공동체의 건강관리에 유익한 건강문화 형성과 확산 방안을 제시한다."]],"사회문제 탐구":[["12사탐01-01","사회문제의 의미와 특징을 이해하고, 사회문제를 바라보는 주요 관점을 비교한다."],["12사탐01-02","사회문제에 대한 과학적 탐구의 필요성을 설명하고, 사회문제 탐구를 위한 연구 방법과 다양한 자료 수집 방법의 특징을 비교한다."],["12사탐01-03","다양한 자료 수집 방법을 적용한 실제 사례를 활용하여 수집된 자료를 분석하고 해석하는 방법을 설명한다."],["12사탐01-04","사회문제의 탐구 과정에서 요구되는 연구 윤리를 설명하고, 연구 윤리를 준수하며 사회문제를 탐구하는 태도를 가진다."],["12사탐02-01","일상생활에서 나타나는 성 불평등 문제의 실태를 조사하고, 원인과 해결 방안을 제시한다."],["12사탐02-02","청소년의 미디어 이용 과정에서 나타나는 문제를 조사하고, 원인과 해결 방안을 제시한다."],["12사탐03-01","저출산⋅고령화로 인해 발생하는 다양한 사회문제의 실태를 조사하고, 해결 방안을 제시한다."],["12사탐03-02","인공지능 발전 과정에서 나타날 수 있는 다양한 사회문제를 탐색하고, 대응 방안을 제시한다."],["12사탐04-02","탐구 계획에 적합한 자료 수집 방법을 적용하여 자신이 선정한 사회문제에 관한 자료를 수집한다."],["12사탐04-03","수집한 자료에 대한 분석과 해석을 토대로 사회문제에 대한 해결 방안을 제시한다."],["12사탐04-04","자신의 사회문제 탐구 과정과 결과를 연구 보고서로 작성하여 발표하고, 사회문제 해결을 위한 참여는 사회 구성원으로서의 권리이자 의무라는 점을 인식하며 해결 방안을 적극적으로 실천한다."]],"사회와 문화":[["12사문01-01","사회현상의 탐구를 위해 사회현상의 특징에 대한 이해와 사회학적 상상력이 필요함을 인식하고, 사회현상에 대한 다양한 관점을 비교한다."],["12사문01-02","사회현상에 대한 양적 연구 방법과 질적 연구 방법의 특징 및 연구 절차를 비교하고, 각 연구 방법을 활용한 연구 사례를 분석한다."],["12사문01-03","사회현상에 대한 다양한 자료 수집 방법의 특징을 비교하고, 각 자료 수집 방법을 활용한 연구 사례를 분석한다."],["12사문01-04","사회현상의 탐구에서 발생하는 연구자의 가치 개입 및 연구 윤리 관련 쟁점을 토론하고, 연구 윤리를 준수하며 사회현상에 대한 탐구를 수행한다."],["12사문02-01","사회 구조와 개인의 관계에 대한 이해를 바탕으로 개인의 사회화 과정, 사회화 기관 및 유형을 설명하고, 사회화에 대한 서로 다른 이론적 관점을 비교한다."],["12사문02-02","사회 집단 및 사회 조직의 유형과 변화 양상에 대한 이해를 바탕으로 사회 집단 및 사회 조직이 개인의 사회생활과 사회적 관계에 미치는 영향을 설명한다."],["12사문02-03","일탈 행동의 발생 요인이나 특성을 설명하는 다양한 일탈 이론을 비교하고, 일탈 행동에 대한 사회 통제의 유형과 사회 통제의 필요성 및 문제점을 분석한다."],["12사문02-04","사회 변동이 다양한 요인의 복합적인 상호 작용의 산물이라는 점을 설명하고, 현대 사회의 변동 과정에서 나타나는 다양한 사회 운동의 유형과 특징을 탐구한다."],["12사문03-01","대중문화에 대한 다양한 관점을 비교하고, 일상적으로 접하는 사례를 중심으로 대중문화가 개인과 사회에 미치는 영향을 토의한다."],["12사문03-02","미디어의 효과에 대한 이해를 바탕으로 미디어가 생산하는 메시지를 비판적으로 분석하고 대안적 메시지 생산에 능동적으로 참여한다."],["12사문03-03","하위문화와 주류 문화의 관계에 대한 이해를 바탕으로 다문화 사회의 이주민 문화에 대한 서로 다른 관점을 비교하고, 이주민 문화가 갖는 의의에 기초하여 문화 다양성을 증진하기 위한 방안을 제시한다."],["12사문03-04","문화 변동의 다양한 요인과 양상, 문화 변동 과정에서 발생하는 문제점을 이해하고, 문화의 세계화로 인해 나타나는 쟁점에 대해 탐구한다."],["12사문04-01","사회 불평등 현상을 이해하는 서로 다른 관점을 비교하고, 사회 이동과 사회 계층 구조의 유형 및 특징을 분석한다."],["12사문04-02","현대 사회에서 나타나는 다양한 사회 불평등 양상을 분석하고, 차별받는 사람들의 입장에 대한 공감을 바탕으로 다양한 불평등 현상에 대한 해결 방안을 모색한다."],["12사문04-03","복지 국가의 발전 과정에 대한 이해를 바탕으로 사회 복지 제도의 유형과 특징을 비교하고, 현대 사회에서 나타나고 있는 사회 복지를 둘러싼 쟁점을 토론한다."]],"삶과 종교":[["12삶종01-01","다양한 인간의 삶에서 종교의 의미와 역할, 종교성과 영성을 이해한다."],["12삶종01-02","종교적인 질문을 통해 청소년 시기에 경험하는 삶의 다양한 문제를 탐색한다."],["12삶종01-03","사회적 문제를 종교적 관점으로 바라보고 종교적 통찰과 지혜를 삶과 일상에 적용하고 실천하는 태도를 갖는다."],["12삶종02-01","다양한 종교의 기원과 창시자, 역사적 형성 과정을 탐색한다."],["12삶종02-02","다양한 종교의 경전과 전통, 교리와 문화, 공동체와 의례를 비교하여 특징을 분석한다."],["12삶종02-03","다양한 종교의 세계관과 윤리적 가치를 인식하고, 존중하는 태도를 기른다."],["12삶종03-01","일상생활과 통과 의례에 담긴 종교 문화유산을 이해하고 삶의 과정을 통과 의례를 중심으로 성찰한다."],["12삶종03-02","음악, 미술, 건축, 문학 영역에서 종교적 문화유산을 탐구하고 아름다움을 감상한다."],["12삶종03-03","다양한 종교 문화유산을 분야별로 분류하고 특징을 분석하며, 인류의 문화유산으로 존중하는 마음을 갖는다."],["12삶종03-04","다양한 분야의 종교 문화유산을 감상하고, 이를 창의적이고 융합적으로 표현한다."],["12삶종04-02","종교가 추구하는 공동의 선(善)을 이해하고, 변화하는 사회에 필요한 시민 의식과 태도를 갖는다."],["12삶종04-03","현대 사회의 문제에 대해 종교계가 제시하는 여러 해법을 이해함으로써 공동체의 문제 해결에 필요한 연대감과 책임감을 기른다."],["12삶종04-04","종교와 유사 종교를 구분할 수 있는 관점을 기른다."]],"생명과학":[["12생과01-01","생물 및 생명과학의 특성을 이해하고 생명과학의 성과를 협력적으로 소통할 수 있다."],["12생과01-02","세포에서부터 생태계까지 생명 시스템의 구성 단계의 특징을 바탕으로 체계적인 설명 자료를 만들 수 있다."],["12생과01-03","물질대사 과정에서의 에너지 전환 과정을 바탕으로 다양한 생명 활동에서의 에너지 사용을 추론할 수 있다."],["12생과01-04","기관계의 통합적 작용을 실제 인체 활동 과정에서 나타나는 생리적 변화의 사례를 바탕으로 설명하도록 한다."],["12생과01-05","물질대사 관련 질병 조사를 위한 방법을 고안하여 수행하고 대사성 질환을 예방하기 위한 올바른 생활 습관에 대해 토의하며 협력적으로 소통할 수 있다."],["12생과01-06","생태계의 구조를 이해하고 물질의 순환과 에너지의 흐름을 추론하여 생태계 구성 요소들의 중요성을 설명할 수 있다."],["12생과01-07","개체군과 군집의 특성을 이해하고 이들의 상호작용의 예를 조사하여 발표할 수 있다."],["12생과02-01","신경 세포의 구조와 기능을 이해하고, 신경 세포에서의 전도 과정을 모식도로 표현할 수 있다."],["12생과02-02","시냅스를 통한 신경 신호의 전달 과정을 이해하고, 약물이 시냅스 전달에 영향을 미치는 사례를 조사하여 발표할 수 있다."],["12생과02-03","사람 신경계의 구조와 기능을 이해하고 중추 신경계와 말초 신경계의 특징을 설명할 수 있다."],["12생과02-04","내분비계와 신경계 작용 원리와 상호작용의 이해를 바탕으로 우리 몸의 항상성이 유지되는 과정을 추론할 수 있다."],["12생과02-05","병원체의 종류와 특징을 이해하고 우리 몸의 방어 작용을 선천적 면역과 후천적 면역으로 구분하여 설명할 수 있다."],["12생과02-06","항원 항체 반응의 특이성을 이해하고, 혈액의 응집 반응 원리를 이용하여 혈액형을 판정할 수 있다."],["12생과02-07","백신의 종류와 작용 원리를 조사하고 질병의 예방 측면에서 백신의 필요성을 인식하여 협력적으로 소통할 수 있다."],["12생과03-01","염색체의 구조를 이해하고, DNA, 유전자의 관계를 설명할 수 있다."],["12생과03-02","생식세포 형성과정을 체세포분열 과정과 비교하고, 생식세포 형성의 중요성을 생명의 연속성 및 다양성과 관련지어 추론할 수 있다."],["12생과03-03","생물 진화의 원리를 이해하고, 생물 진화 연구의 다양한 사례를 조사하여 협력적으로 소통할 수 있다."],["12생과03-05","동물과 식물 분류군의 특징을 문 수준에서 이해하고, 생물의 유연관계를 계통수로 나타낼 수 있다."]],"생물의 유전":[["12유전01-02","사람 유전 연구 방법의 어려움을 이해하고, 사람의 유전 현상 분석을 근거로 유전 형질의 유전적 특성을 추론할 수 있다."],["12유전01-03","사람의 다유전자유전에 대해 이해하고, 유전 현상의 다양성 사례를 조사하여 과학적 근거를 활용하여 협력적으로 소통할 수 있다."],["12유전01-04","염색체와 유전자 이상에 대해 이해하고, 사람의 유전병을 발병 원인별 조사 계획을 세워 조사할 수 있다."],["12유전01-05","DNA의 구조와 유전물질 규명 관련 과학사적 연구 결과를 설명하기 위한 발표 자료를 창의적으로 제작할 수 있다."],["12유전01-06","원핵세포와 진핵세포의 유전자 구조와 유전체 구성을 이해하고, 공통점과 차이점을 비교하여 설명할 수 있다."],["12유전01-07","반보존적 DNA 복제 과정을 이해하고 그 의미를 추론하여 협력적으로 소통할 수 있다."],["12유전02-01","전사와 번역 과정을 거쳐 유전자가 발현되는 중심원리를 이해하고, 모형을 이용하여 유전자 발현 과정을 설명할 수 있다."],["12유전02-02","유전 부호를 이해하고, 유전 부호 표를 사용하여 유전 정보를 해독할 수 있다."],["12유전02-03","원핵생물과 진핵생물의 유전자 발현 조절 과정을 비교하기 위한 설명 자료를 다양한 매체를 활용하여 제작할 수 있다."],["12유전02-04","생물의 발생 과정에서 세포 분화가 유전자 발현 조절 과정을 통해 일어남을 추론할 수 있다."],["12유전02-05","생물의 유전자 발현 조절 및 발생에 대한 연구가 인류 복지에 기여한 사례를 조사하여 협력적으로 소통할 수 있다."],["12유전03-01","생명공학기술 발달 과정에서의 주요 사건을 조사하고 다양한 매체를 활용하여 발표할 수 있다."],["12유전03-02","단일클론항체, 줄기세포, 유전자 편집 기술이 난치병 치료에 활용된 사례를 조사하고, 이러한 치료법의 전망에 대해 협력적으로 소통할 수 있다."],["12유전03-03","생명공학기술 관련 학문 분야를 이해하고 우리 생활과 산업에 활용 사례를 조사하여 창의적으로 설명 자료를 제작할 수 있다."],["12유전03-04","유전자 변형 생물체(LMO)의 특징을 이해하고 인간과 생태계에 미치는 영향을 추론할 수 있다."],["12유전03-05","생명공학기술의 활용 과정에서 나타나는 문제점과 이에 대한 사회적 책임을 인식하고 생명윤리 쟁점에 대해 의사 결정할 수 있다."]],"생애 설계와 자립":[["12자립01-02","존중하는 만남과 이별의 과정에서 자신과 타인을 보호하는 방안을 제안하고, 다양한 정서적 지지 기반을 형성하여 정신적 건강을 유지하는 방안을 탐색한다."],["12자립01-03","일상에서 경험하는 다양한 상실과 비탄의 상황에 대처할 수 있는 마음 챙김 방안을 탐색한다."],["12자립01-04","일상생활에서 성인지 감수성을 높여 상호존중의 성문화를 실천한다."],["12자립01-05","사회구성원으로서의 자립적 삶의 태도를 갖기 위해 대인 관계와 관련한 개인적⋅사회적 이슈의 배경과 맥락을 파악하고 비판적으로 성찰한다."],["12자립02-01","경제적 자립을 위해 목표를 설정하고 다양한 수입 창출 방법을 비교 분석하여 자신의 생활양식에 맞는 방안을 설계한다."],["12자립02-02","균형을 중시하는 태도를 바탕으로 금융자산을 형성하고 이를 거래하는 방안을 탐색한다."],["12자립02-03","가정생활 자원의 나눔과 공유의 가치 실천을 위해 제한된 가정생활 자원을 최대한 활용할 수 있는 협력적 소비의 방안을 탐색한다."],["12자립02-04","청년기 신용관리의 중요성을 이해하고 금융과 관련된 이슈를 비판적으로 분석하여 미래의 금융 생활을 설계한다."],["12자립03-01","자신만의 인생 음식을 만들 수 있는 능력을 기르고, 건강을 유지하는 1인 식사의 선택 방안을 탐색하여 실천한다."],["12자립03-02","독립생활의 기초가 되는 안전한 주거를 선택할 때 필요한 정보와 고려해야 할 조건을 분석하여 선택한다."],["12자립03-03","자신의 생활공간에 대한 가치를 반영한 공간을 구상하고 관리하는 방안을 탐색한다."],["12자립03-04","청년자립을 돕고 건강한 일상생활을 유지할 수 있는 다양한 복지 서비스 정보를 탐색한다."],["12자립03-05","행복을 추구하기 위해 나만의 삶의 가치를 반영한 독립적 생활을 설계한다."]],"생태와 환경":[["12생환01-01","환경의 다양한 의미를 탐구하고, 역사적 사례 속에서 발견되는 인간의 삶과 환경 변화 사이의 상호 작용을 통해 환경과 인간 사이의 복합적인 관계를 해석한다."],["12생환01-02","다양한 환경관을 비교⋅분석하고, 윤리적 고려 범위가 인간에서 동물, 생명, 생태계로 확장되는 과정을 사회 변화 및 환경 변화와 연결지어 설명한다."],["12생환01-03","환경에 관한 윤리적 갈등 상황을 분석하여 현상을 바라보는 다양한 관점을 인식하고, 타인의 의견을 경청하며, 갈등 해결을 위한 책임감을 갖고 자신의 의견을 제시한다."],["12생환01-04","자신이 살고 있는 지역에 관심을 갖고, 더 나은 지역 환경을 위해 책임 있는 시민으로서 자신이 참여할 수 있는 방식을 제안한다."],["12생환02-01","환경 체계는 지구 생태계와 사회 체계로 구성된 복잡한 시스템임을 이해하고, 이들의 상호 작용을 파악하기 위해 시스템사고가 필요함을 인식한다."],["12생환02-02","물과 대기의 순환적 특성 및 과학적 원리를 탐구하고, 인간 활동이 물과 대기의 순환에 미치는 영향을 파악한다."],["12생환02-03","토양의 특성과 토양, 물, 대기, 생물의 상호 작용, 인간의 이용에 따른 시공간적 변화를 이해하고, 생태계와 인간 사회의 상호 작용 결과를 추론한다."],["12생환02-04","생태계의 부분과 전체가 서로 복잡하게 얽혀져 있음을 여러 규모의 사례를 통해 조사하고, 생물⋅문화 다양성의 환경적⋅사회적⋅경제적 가치를 발견한다."],["12생환03-01","물, 대기 등과 관련된 국내외 환경 문제와 쟁점을 상호 관련성 및 광역성 등과 관련지어 심층 탐구하고, 환경 문제와 쟁점이 환경 체계와 맺는 연결성을 파악한다."],["12생환03-02","토양 및 생물 등과 관련된 국내외 환경 문제와 쟁점을 탄력성, 비가역성 및 다양성 등과 관련지어 심층 탐구하고, 환경 문제와 쟁점의 주된 원인과 영향을 분석하여 시사점과 해결 방안을 도출한다."],["12생환03-03","자원과 에너지, 폐기물 등과 관련된 국내외 환경 문제와 쟁점을 시차성 및 유한성 등과 관련지어 데이터를 기반으로 심층 탐구하고, 개인 및 사회 차원의 합리적 의사 결정에 적용한다."],["12생환03-04","정치, 경제, 문화, 법과 제도 등과 관련된 환경 쟁점을 사회 구조와 산업 구조의 측면에서 심층 탐구하고, 환경 문제와 쟁점에 대한 인간의 책무성을 인식한다."],["12생환03-05","지역 및 지구 차원의 환경 쟁점과 사례를 심층 탐구하고, 지속가능성과 형평성의 측면에서 해결 방안을 제안하며, 자신이 주체적으로 참여할 수 있는 활동을 찾아 참여한다."],["12생환04-01","현재의 기후변화를 기후위기라고 하는 이유를 기후 시스템의 급변점 및 인류세 개념 등과 연결지어 탐구한다."],["12생환04-02","생물다양성 감소와 삶의 질 저하 등 기후변화로 인한 영향과 피해의 구체적인 사례를 탐구하여 기후변화 취약성, 기후정의와 연결지어 인식한다."],["12생환04-03","온실가스 배출 현황을 인간 활동의 사회적, 경제적, 정치적, 기술적 측면과 연결지어 탐구하여 기후변화의 원인을 다층적으로 인식한다."],["12생환04-04","기후변화 미래 시나리오를 살펴보고 희망하는 미래를 위해 어떤 경로를 선택해야 할지 토의하며, 기후변화 대응을 위한 사회적, 경제적, 정치적, 기술적 제안과 사례를 탐구한다."],["12생환04-05","기후변화 대응을 위해 우리나라와 자신의 지역에 적절한 방안과 과제가 무엇인지 도출하고, 학교와 지역을 위한 기후행동을 계획⋅이행하고 그 결과를 성찰한다."],["12생환05-01","지속가능발전목표(SDGs)를 분석하고, 행복한 삶의 기준에 대한 토론을 통해 지속가능한 사회를 만드는 다양한 방안을 탐색한다."],["12생환05-02","지구 공동체의 관점에서 생태시민의 역할과 책무에 대해 이해하고, 이를 통해 비인간 존재와 미래 세대에 대한 배려와 책임감을 기르며 자신의 삶에서 적용할 수 있는 방안을 찾아 실천한다."],["12생환05-03","음식, 주거, 교통, 생산과 소비 등에서 지속가능한 삶의 양식을 조사하고, 환경 정의 측면에서 지역, 국가, 국제 수준의 연대와 협력 활동을 살펴보며, 지속가능한 미래를 위한 개인적⋅사회적 차원의 활동에 주체적으로 참여한다."]],"생활과학 탐구":[["12생활01-01","인간의 특성에 대한 긍정적 태도를 바탕으로 인간 발달에 대한 이론과 발달의 특성을 탐구한다."],["12생활01-02","아동기까지의 삶의 질이 전 생애에 끼치는 장기적이며 결정적인 영향을 이해하여 아동 상담의 필요성과 사례를 탐구하여, 관련 분야로의 진로를 탐색한다."],["12생활01-03","사회변화에 따라 파생된 가족생활교육 및 가족생활 복지서비스의 필요성을 이해하고, 새로운 정책을 탐구하며, 관련된 분야로의 진로를 탐색한다."],["12생활01-04","소비문화를 선도하는 소비자가 되기 위해 현대 소비문화의 이해를 바탕으로 미래 소비 동향을 예측하여 소비 트렌드를 분석하고 제안한다."],["12생활01-05","소비자 심리를 이해하여 소비 행동을 예측해보며, 소비와 관련한 직업의 세계를 탐색하고 진로를 설계한다."],["12생활02-01","생활습관병의 원인을 분석하고, 올바른 관리법을 익혀 건강한 삶을 위한 실천 방안을 탐색하고 관련 분야로의 진로를 탐색한다."],["12생활02-02","식품 가공의 원리를 이해하고 올바른 정보 분별 능력을 길러 가공식품을 건강하고 안전하게 이용하는 방안을 탐색하며, 관련된 분야의 진로를 탐색한다."],["12생활02-03","올바른 식재료를 선택하고 조리 과정 중에 일어나는 성분 등의 변화를 이해하여 과학적 원리를 적용한 음식을 만든다."],["12생활02-04","패션디자인의 기본 개념과 유행하는 스타일을 파악하여 패션 산업의 동향을 탐색하며, 관련된 분야의 진로를 탐색한다."],["12생활02-05","패션디자인과 머천다이징에 대한 이해를 바탕으로 패션상품을 기획하고 디자인을 하며 하나의 브랜드를 기획한다."],["12생활02-06","정치⋅경제, 사회⋅문화의 변화에 따른 주거 트렌드를 탐구하고 인간다운 주거환경을 실현할 수 있는 주거복지 정책을 제안한다."],["12생활02-07","주거공간을 구성하고 있는 요소와 원리를 이해하여 라이프 스타일에 적합한 생활 공간을 기획하며, 관련된 분야의 진로를 탐색한다."],["12생활03-01","생활과학 분야와 관련된 사회적 변화와 산업 추세를 분석하여 생할과학 분야의 다양한 진로를 탐색하고 요구하는 능력을 길러 체계적으로 진로를 설계한다."],["12생활03-02","현재와 미래의 인간 삶의 기본이 되는 의식주 및 소비생활에 관련된 요구를 분석하여 체인지 메이커의 역할을 수행하며 창업의 아이디어를 제안한다."]],"세계 문화와 영어":[["12세영01-02","문화 관련 주요 개념을 적용하여 문화 현상을 분석하고 새로운 관점으로 설명한다."],["12세영01-03","타 문화 및 언어에 대한 존중을 바탕으로 문화 정보를 수용하고 자신의 의견을 표현한다."],["12세영01-06","다른 문화권의 관습, 규범, 가치, 사고방식, 행동 양식 또는 의사소통 방식을 이해하고 자신의 문화 인식 및 관점을 비판적으로 성찰한다."],["12세영01-07","자발적⋅지속적 관심과 흥미를 가지고 다양한 문화적 산물을 감상하고 표현한다."],["12세영01-08","세계 영어에 대한 이해를 바탕으로 적절한 전략과 태도를 갖추어 의사소통에 참여한다."]],"세계사":[["12세사01-01","현생 인류의 삶과 문명의 형성을 생태환경과의 관계 속에서 파악한다."],["12세사01-02","동아시아, 인도 세계의 형성을 문화의 상호 작용과 관련지어 이해한다."],["12세사01-03","서아시아, 지중해, 유럽 세계의 형성과 문화적 특징을 종교의 확산과 관련지어 분석한다."],["12세사02-01","이슬람 세계와 몽골 제국의 팽창에 따른 교류 양상을 파악한다."],["12세사02-02","유럽의 신항로 개척과 재정⋅군사 국가의 성립이 가져온 변화를 분석한다."],["12세사02-03","세계적 상품 교역이 가져온 사회적⋅경제적 변화를 이해한다."],["12세사03-01","청, 무굴 제국, 오스만 제국의 통치 정책과 사회, 문화의 변화를 이해한다."],["12세사03-02","미국 혁명, 프랑스 혁명을 시민 사회 형성과 관련지어 파악한다."],["12세사03-03","제1⋅2차 산업 혁명이 가져온 사회, 경제, 생태환경의 변화를 분석한다."],["12세사03-04","아시아와 아프리카 지역에서 전개된 국민 국가 건설 운동의 양상과 성격을 비교한다."],["12세사04-01","제1⋅2차 세계 대전을 인권, 과학 기술 문제와 관련지어 파악한다."],["12세사04-02","냉전의 전개 양상에 따라 나타난 사회, 문화의 변화를 분석한다."],["12세사04-03","현대 세계의 과제를 해결하기 위해 인류가 기울여온 노력을 탐구한다."]],"세계시민과 지리":[["12세지01-01","세계화의 의미를 지리적 스케일에 따라 이해하고, 세계화와 지역화의 관계 속에서 세계시민의 역할을 탐색한다."],["12세지01-02","지역 통합과 분리 현상의 사례와 주요 원인을 탐구하고, 이를 바탕으로 지역 변화의 역동성을 파악한다."],["12세지01-03","지리정보기술이 세계시민의 삶과 연계되는 다양한 모습을 이해하고, 지리적 문제 해결 및 의사 결정에 활용되는 사례를 조사한다."],["12세지02-01","세계의 다양한 기후에 대한 이해를 바탕으로 기후를 활용하거나 극복한 사례를 찾아 인간 생활과의 관계를 탐색한다."],["12세지02-02","세계 주요 지형과 인간 생활의 상관성을 파악하고, 지형의 개발과 보존을 둘러싼 갈등 사례를 통해 지속가능한 이용 방안을 토론한다."],["12세지02-03","세계 주요 종교의 특징 및 종교 경관의 의미를 이해하고, 각 종교가 인간 생활에 미치는 영향을 탐구한다."],["12세지02-04","세계의 다양한 음식과 축제를 지리적으로 설명하고, 문화 다양성을 보존하기 위한 방법을 모색한다."],["12세지03-01","세계 인구 분포 및 구조를 통해 세계 인구 문제를 이해하고, 국제적 이주가 인구 유출 지역과 유입 지역에 미치는 영향을 탐구한다."],["12세지03-02","주요 식량 자원의 생산과 소비 양상을 통해 세계 식량 문제가 발생하는 구조적 원인을 파악하고, 식량의 안정적인 생산과 공급을 위한 각국의 대응 전략을 비교⋅분석한다."],["12세지03-03","초국적 기업을 중심으로 한 글로벌 경제 체제의 형성 과정을 탐색하고, 글로벌 경제에서의 공간적 불균등을 해소하기 위한 국제적 협력과 개인적 실천 방안에 대해 조사한다."],["12세지04-01","세계 주요 에너지 자원의 생산과 소비 현황을 조사하고, 다양한 친환경 에너지원의 특징에 대한 이해를 바탕으로 지속가능한 에너지 생산 방안을 제시한다."],["12세지04-02","세계 주요 환경 문제의 유형과 실태를 설명하고, 생태전환적 삶에 비추어 현재의 생활방식을 비판적으로 점검한다."],["12세지04-03","다양한 지정학적 분쟁을 국제 정세의 변화와 관련지어 조사하고, 세계 평화와 정의에 기여할 수 있는 방안을 찾아 실천한다."]],"세포와 물질대사":[["12세포01-01","탄수화물과 지질의 종류와 주요 기능을 이해하고 생물체에 들어있는 탄수화물과 지질을 관찰할 수 있다."],["12세포01-02","핵산과 단백질의 기본 구조와 세포에서의 주요 기능을 조사하여 설명할 수 있다."],["12세포01-03","동물세포와 식물세포를 구성하는 세포 소기관의 구조와 기능을 이해하고, 세포 소기관 들의 유기적 관계를 추론하여 협력적으로 소통할 수 있다."],["12세포01-04","원핵세포와 진핵세포의 공통점과 차이점을 설명할 수 있다."],["12세포01-05","세포막의 구조와 특성을 이해하고, 세포막을 통한 물질 수송 과정을 추론할 수 있다."],["12세포02-01","물질대사는 생명체에서 생명을 유지하기 위해 일어나는 화학 반응임을 이해하고 에너지의 출입이 동반됨을 추론할 수 있다."],["12세포02-02","생명 활동에 필요한 에너지를 공급하는 과정에서 광합성과 세포호흡 그리고 ATP의 역할을 설명할 수 있다."],["12세포02-03","효소의 종류와 특성을 이해하고 효소의 활성에 영향을 미치는 요인에 대한 실험을 설계하여 수행할 수 있다."],["12세포02-04","효소의 작용 기작을 이해하고, 생명체 내에서 일어나는 효소 작용의 중요성에 대해 다양한 매체를 활용하여 협력적으로 소통할 수 있다."],["12세포02-05","효소가 우리 생활이나 산업에 다양하게 이용되는 사례를 조사하여 발표할 수 있다."],["12세포03-01","미토콘드리아의 구조를 이해하고 생명체 내에서의 미토콘드리아의 기능을 추론할 수 있다."],["12세포03-02","세포호흡 과정의 단계별 특징을 다양한 매체를 활용하여 협력적으로 소통할 수 있다."],["12세포03-04","산소호흡과 발효의 공통점과 차이점을 이해하고, 실생활에서 발효를 이용한 사례 조사 계획을 세워 조사할 수 있다."],["12세포03-05","엽록체의 구조를 이해하고 기능과 관련지어 설명할 수 있다."],["12세포03-06","광합성의 명반응과 탄소 고정반응을 단계별로 구분하여 특징을 이해하고 두 반응의 상호 관계를 추론할 수 있다."],["12세포03-07","광합성과 세포호흡의 전자 전달계를 비교하여 공통점과 차이점을 다양한 매체를 활용하여 설명할 수 있다."],["12세포03-08","광합성 관련 과학사적 연구 결과를 조사하여 시각화 자료를 창의적으로 제작하여 협력적으로 소통할 수 있다."]],"소프트웨어와 생활":[["12소생01-01","소프트웨어가 세상을 변화시킨 사례를 탐색하고 소프트웨어가 사회 변화에 미치는 영향을 분석한다."],["12소생01-02","실세계의 문제와 현상을 소프트웨어의 관점으로 바라보고 소프트웨어 발전에 따른 미래 사회의 변화를 예측한다."],["12소생01-03","소프트웨어 융합을 통한 문제 해결 사례를 바탕으로, 다양한 학문 분야에서 소프트웨어 와의 융합을 통해 문제를 해결하는 방법을 비교⋅분석한다."],["12소생02-01","피지컬 컴퓨팅 도구로 구현된 작품의 구성 및 작동 원리를 분석한다."],["12소생02-02","소프트웨어를 통해 아이디어를 표현하는 데 필요한 센서와 액추에이터를 선택하여 피지컬 컴퓨팅 시스템을 구성한다."],["12소생02-03","피지컬 컴퓨팅을 통해 미디어 아트 작품을 창작하고, 창작에 활용된 소프트웨어의 가치를 파악한다."],["12소생02-04","웨어러블 장치 작품을 창작하고 공유하는 과정을 통해 소프트웨어의
