조사하고 정보를 요약하거나 분석한다."],["12심중05-03","상호문화적 관점에서 한중 문화를 비교하고 문화적 다양성을 이해한다."],["12심중05-04","중국 문화를 직간접적으로 체험하고, 다양한 매체를 활용하여 정보를 공유한다."],["12심중05-05","중국 문화와 자신의 관심 분야를 연계하여 조사･정리한 내용을 설명한다."],["12심중05-06","중국 문화에 대해 호기심을 갖고 수업이나 과제 활동에 적극적으로 참여한다."]],"심화 프랑스어":[["12심프01-01","낱말, 구, 문장의 의미를 파악한다."],["12심프01-02","의사소통 표현을 듣고 상황에 맞게 반응한다."],["12심프01-03","다양한 유형의 글이나 대화를 듣고 적절한 듣기 전략을 활용하여 정보를 파악하거나 추론한다."],["12심프01-04","다양한 상황의 듣기 자료나 상대방의 말을 경청하고 호응한다."],["12심프02-01","발음 규칙에 유의하며 낱말, 구, 문장을 자연스럽게 말한다."],["12심프02-02","의사소통 표현을 활용하여 상황에 맞게 대화한다."],["12심프02-03","다양한 주제에 대해 자신의 생각을 말한다."],["12심프02-04","상대방을 존중하며 적극적으로 대화에 참여한다."],["12심프03-01","발음 규칙을 이해하고 자료를 소리 내어 읽는다."],["12심프03-02","시각 자료나 서식을 읽고 정보 또는 맥락을 이해하거나 추론한다."],["12심프03-03","대화문이나 자료를 읽고 내용을 이해하거나 상황에 맞게 반응한다."],["12심프04-01","낱말, 구, 문장을 어법에 맞게 쓴다."],["12심프04-02","다양한 주제의 글과 서식을 상황과 목적에 맞게 작성한다."],["12심프04-03","적절한 쓰기 전략을 활용하여 다양한 유형의 글쓰기 학습을 계획하고 실천한다."],["12심프04-04","글쓰기에 흥미를 갖고 쓰기 활동에 적극적으로 참여한다."],["12심프05-01","프랑스어권의 문화 내용을 이해한다."],["12심프05-02","프랑스어권의 문화 내용을 프랑스어 의사소통에 활용한다."],["12심프05-03","프랑스어권의 문화 내용을 조사･정리한다."],["12심프05-04","프랑스어권 문화와 우리 문화와의 공통점과 차이점을 비교한다."],["12심프05-05","프랑스어권 문화에 관심을 가지고 탐구 활동에 적극적으로 참여한다."]],"아동발달과 부모":[["12아동01-01","자신의 현재에 이르는 성장 과정을 되돌아보며 자신과 부모와의 상호 작용을 성찰한다."],["12아동01-02","성숙한 사랑의 의미와 친밀한 관계 형성이 가지는 심리적 의의를 추론하여, 상호 존중의 태도를 바탕으로 한 이성 관계를 형성하는 방안을 제안한다."],["12아동01-03","배우자 선택과 관련한 나와 사회의 고정 관념을 비판적으로 성찰하여 배우자 선택 기준을 제안하고 가족 형성의 개인적⋅사회적 의의를 탐색한다."],["12아동01-04","현대 사회의 결혼과 가족에 대한 변화된 인식을 반영하여 부모됨의 의미를 추론하고 건강한 부모됨의 중요성을 인식한다."],["12아동01-05","임신과 출산의 과정이 부모 공동의 책임임을 인식하여 부부가 함께 준비하고 맞이하는 건강한 임신과 출산의 과정을 설계한다."],["12아동01-06","부부간의 성숙한 관계 지속을 방해하는 요인을 탐색해 보고 개인적 요구 및 부모로서의 삶의 균형의 맥락을 파악하고 실현을 위한 조건 및 방안 탐색하여 제안한다."],["12아동02-01","부모상에 대한 사회의 고정 관념을 성찰하고 책임 있는 부모로서의 역량을 키우는 방안을 탐색하며 자녀의 발달 단계별 부모의 역할을 추론한다."],["12아동02-02","부모가 자녀를 대하는 양육 태도가 자녀에게 미치는 영향을 인식하고 양육 태도를 비교 분석하여 바람직한 양육 태도를 선택한다."],["12아동02-03","발달의 개념 및 원리와 단계, 발달 영역 등 아동 발달의 기초를 인식하고 아동 돌봄의 각 단계에 적용하여 발달 특성을 분석한다."],["12아동02-04","각기 다른 발달 이론의 아동 발달을 바라보는 관점을 파악하고 아동의 발달적 요구에 적용하여 다각적으로 분석한다."],["12아동02-06","유아기, 아동기의 발달 특성을 인식하고 각각의 발달 단계에 따른 요구를 존중하는 돌보기 방법을 탐색하여 선택하고 제안한다."],["12아동02-07","자녀의 발달적 요구와 부모 개인의 요구가 충돌하는 배경과 맥락을 이해하고 자녀의 요구와 부모 개인의 요구 간 균형을 추구하는 방안을 제안한다."],["12아동02-08","아동의 안전한 돌봄 환경을 조성해야 하는 부모의 권리 및 의무를 인식하고 아동 학대 예방 및 아동 안전 확보 방안을 탐색한다."],["12아동02-09","아동의 건강한 성장을 지원하는 사회적 부모로서의 역할 수행의 의미를 인식하고 지역 사회 돌봄 방안 및 부모 지원 정책을 탐색하여 사회적 돌봄 방안을 제안한다."]],"아랍 문화":[["12아문01-01","아랍 문화 내용을 이해한다."],["12아문01-02","다양한 글이나 디지털 텍스트에서 아랍 문화에 관한 주제를 찾거나 내용을 요약한다."],["12아문01-03","아랍 문화 내용에 대해 조사하고 정리한 내용을 설명한다."],["12아문01-04","아랍인의 생활에 반영된 문화를 이해하고 아랍어 의사소통 상황에 활용한다."],["12아문01-05","아랍 문화와 자신의 관심 분야를 연계하여 자료를 조사하고, 조사한 내용을 정리․심화한다."],["12아문01-06","상호문화적 관점에서 한국 문화와 아랍 문화의 공통점과 차이점을 이해하고 표현한다."],["12아문01-07","아랍 문화에 대해 호기심을 가지고 수업이나 과제 활동에 적극적으로 참여한다."],["12아문01-08","아랍 문화를 체험하고, 다양한 매체를 활용하여 정보를 공유한다."]],"아랍어":[["12아어01-01","발음 규칙에 유의하여 낱말을 듣고 자음과 모음, 소리와 철자를 식별한다."],["12아어01-02","낱말, 간단한 구나 문장을 듣고 의미를 이해한다."],["12아어01-03","일상생활과 관련된 간단한 글이나 대화를 듣고 상황에 맞게 반응한다."],["12아어01-04","간단한 글이나 대화를 듣고 핵심어, 주제, 세부 내용을 파악한다."],["12아어02-01","발음 규칙에 유의하여 낱말, 간단한 구나 문장을 말한다."],["12아어02-02","낱말, 간단한 구나 문장으로 대상이나 상황에 대해 묘사하거나 설명한다."],["12아어02-03","간단한 문장이나 의사소통 표현을 활용하여 주제와 상황에 맞게 대화한다."],["12아어02-04","일상생활이나 친숙한 주제에 대해 자신의 생각이나 느낌을 말한다."],["12아어03-01","발음 규칙에 유의하여 낱말, 간단한 구나 문장을 소리 내어 정확하게 읽는다."],["12아어03-02","낱말, 간단한 구나 문장을 읽고 의미를 이해한다."],["12아어03-03","간단한 글이나 대화문을 읽고 세부 내용을 파악한다."],["12아어03-04","간단한 글이나 대화문을 읽고 핵심어나 주제, 맥락을 파악한다."],["12아어04-01","낱말, 간단한 구나 문장을 어법에 맞게 쓴다."],["12아어04-02","간단한 글이나 대화문을 상황과 목적에 맞게 작성한다."],["12아어04-03","상황과 맥락에 맞게 정보를 기입한다."],["12아어04-04","문장이나 의사소통 표현을 언어문화적 차이를 고려하여 작성한다."],["12아어05-01","아랍 문화 내용을 이해한다."],["12아어05-02","아랍 문화 내용을 조사하고 정리하여 설명한다."],["12아어05-03","아랍 문화 내용을 아랍어 의사소통 상황에 활용한다."],["12아어05-04","상호문화적 관점에서 한국 문화와 아랍 문화의 공통점과 차이점을 이해하고 표현한다."]],"아랍어 회화":[["12아회01-01","발음 규칙에 유의하여 낱말, 구, 문장을 듣고 말한다."],["12아회01-02","다양한 의사소통 표현을 듣고 상황에 맞게 반응한다."],["12아회01-03","일상적인 의사소통 표현이나 간단한 정보를 듣고 맥락을 파악한다."],["12아회01-04","일상생활과 관련된 글이나 대화를 듣고 내용을 이해한다."],["12아회01-05","의사소통 기본 표현을 활용하여 주어진 상황에 맞게 대화한다."],["12아회01-06","다양한 낱말, 구, 문장, 의사소통 표현을 활용하여 목적에 맞게 말한다."],["12아회01-07","글이나 대화를 듣고 자신의 생각이나 느낌을 말한다."],["12아회01-08","다양한 매체를 통해 듣거나 읽은 내용을 요약하여 말한다."],["12아회01-09","낱말, 구, 문장을 활용하여 다양한 상황을 묘사한다."],["12아회01-10","문장이나 의사소통 표현을 활용하여 일상적인 사실이나 주제를 설명한다."],["12아회01-11","의사소통 표현을 활용하여 일상적인 주제에 대해 질문하거나 대답한다."],["12아회01-12","대면 또는 비대면 의사소통 활동에 적극적으로 참여한다."],["12아회01-13","아랍의 주요 문화 내용을 의사소통 상황에 활용한다."]],"언어생활 탐구":[["12언탐01-01","자신의 언어생활에서 의미 있는 탐구 주제를 발견하여 탐구 절차에 따라 언어 자료를 수집하고 비판적으로 분석한다."],["12언탐01-02","언어 자료를 평가⋅해석하고 그 결과를 공유하며 자신과 공동체의 언어생활에 대한 민감성과 책임감을 지닌다."],["12언탐01-03","글과 담화의 소통 맥락을 고려하여 다양한 분야 및 교과의 언어 자료에 나타난 표현 특성과 효과를 탐구한다."],["12언탐01-04","가정, 학교, 사회의 언어 사용에 나타난 정체성의 실현 양상과 관계 형성의 양상을 탐구한다."],["12언탐01-05","다양한 매체 환경에서 사회적 담론이 형성되는 맥락과 과정을 탐구한다."],["12언탐01-06","품격 있는 언어생활의 특성을 이해하고 공공 언어 사용의 실제를 탐구한다."],["12언탐01-07","언어가 우리 삶에서 담당하는 역할을 이해하고, 주체적⋅능동적으로 바람직한 언어 문화를 실천한다."]],"여행지리":[["12여지01-01","다양한 여행 사례와 자신의 여행 경험을 통해 여행의 의미를 파악하고 여행이 삶과 세계 인식에 미치는 영향을 토의한다."],["12여지01-02","모빌리티의 변화와 발전에 따라 여행자의 이동, 위치, 장소가 어떻게 연결되고 관계를 맺는지 살펴보고, 다양한 지도 및 지리정보기술을 활용하여 안전한 여행 계획을 수립한다."],["12여지02-01","인간의 정주공간으로서의 도시를 새로운 관점에서 낯설게 바라보고, 여행지로서의 향유 가능성을 탐색한다."],["12여지02-02","다양한 문화 경관의 형성 배경과 의미를 이해하고, 감정이입과 공감의 자세로 여행지 주민을 배려하고 존중한다."],["12여지02-03","여행지의 기후 및 기후변화가 여행자와 여행지 주민에게 미치는 영향과 그 차이를 비교하고, 지리적 상상력을 동원한 간접여행을 통해 기후경관을 체험한다."],["12여지02-04","지형 경관이 지닌 자연적 가치, 심미적인 조화, 인간과의 상호 작용과 같은 지오사이트의 선정기준을 조사하고, 지오투어리즘 프로그램을 제안한다."],["12여지03-01","인류의 물질적, 정신적 발전 과정을 성찰할 수 있는 산업유산 및 기념물을 조사하고 여행지의 가치를 평가한다."],["12여지03-02","평화, 전쟁, 재난의 상징이 새겨진 지역에 대한 직간접적인 여행을 체험하고 이를 바탕으로 인권, 정의, 인류의 공존을 둘러싼 구조적 문제를 비판적으로 탐구한다."],["12여지03-03","문화 창조, 첨단 기술과 같은 새로움을 지향하는 지역의 사례를 조사하고, 내가 살고 있는 지역의 로컬 큐레이터로서 다양한 여행 콘텐츠의 발굴과 모니터링을 통해 지역의 의미와 가치를 탐색한다."],["12여지03-04","공정여행을 통해 여행지를 둘러싼 다양한 문제를 탐색하고, 여행자인 나와 여행지 주민인 그들이 연결된다는 점에서 공존의 의미와 생태 감수성에 대해 성찰한다."],["12여지04-01","미디어와 여행의 상호관계를 통해 여행의 변화양상을 조사하고 미래 사회의 여행자와 여행의 모습을 예측한다."],["12여지04-02","여행이 주는 가치의 재발견을 통해 자신만의 여행 포트폴리오를 구성하고 나의 삶을 변화시키는 일상 속의 다양한 여행을 실천한다."]],"역사로 탐구하는 현대 세계":[["12역현01-01","현대 세계를 전후 체제 형성의 역사를 중심으로 파악한다."],["12역현01-02","학습자가 생각하는 현대 세계의 과제를 선정⋅조사하고 그 특징을 분석한다."],["12역현02-01","제2차 세계 대전 이후 인권⋅평화를 위한 국제 사회의 노력과 한계를 파악한다."],["12역현02-02","냉전 시기 열전의 전개 양상을 찾아보고, 전쟁 당사국의 전쟁 경험을 비교한다."],["12역현02-03","세계 여러 지역의 전쟁 관련 기념 시설이 제시하는 기억 방식을 조사하여 분석한다."],["12역현03-01","세계 경제의 성장과 기술 혁신의 변화 양상을 조사한다."],["12역현03-02","대중 소비 사회의 형성과 생태환경의 문제 및 극복 노력을 사례 중심으로 탐구한다."],["12역현03-03","기후변화와 관련된 협약 및 보고서를 조사하고, 그 의미를 추론한다."],["12역현04-01","국제 분쟁 및 무력 갈등의 원인과 전개 양상을 사례 중심으로 파악한다."],["12역현04-02","탈냉전 이후 ‘제3 세계’ 국가의 권위주의 체제 변동에 따른 갈등 양상과 특징을 조사한다."],["12역현04-03","국내외 분쟁과 갈등을 해결하기 위한 역사 정책 사례를 탐구한다."],["12역현05-01","경제의 세계화 이후 사회⋅경제적 변화를 국가, 지역, 세계적 차원에서 파악한다."],["12역현05-02","다문화 사회의 갈등 문제를 역사적으로 파악하고, 이를 해결하기 위해 노력한 사례를 조사한다."],["12역현05-03","문화 다양성 관련 국제 규범의 형성 과정을 살펴보고, 그 의미와 한계를 탐구한다."]],"역학과 에너지":[["12역학01-01","물체에 작용하는 여러 가지 힘의 합력을 구하여 물체의 운동을 정량적으로 예측할 수 있다."],["12역학01-02","뉴턴 운동 법칙을 이용하여 물체의 포물선 운동을 정량적으로 설명하고, 포물선 운동 에서의 역학적 에너지를 구할 수 있다."],["12역학01-03","물체에 작용하는 힘의 방향에 따라 물체의 운동 방향이 변할 수 있음을 원운동 등 다양한 예를 들어 설명할 수 있다."],["12역학01-04","케플러 법칙으로부터 중력의 존재가 밝혀지는 과학사적 배경을 이해하고, 중력을 이용하여 인공위성과 행성의 운동을 분석하고 설명할 수 있다."],["12역학01-05","역학적 에너지 보존을 이용하여 행성에 따라 탈출 속도가 다름을 이해하고, 운동량 보존을 이용하여 우주선이 발사되어 궤도에 오르는 원리를 설명할 수 있다."],["12역학01-06","등가 원리와 시공간의 휘어짐으로 인해 블랙홀과 중력 시간 지연이 나타남을 이해하고, 일반 상대론에 흥미를 느낄 수 있다."],["12역학02-01","건축을 포함한 다양한 열에너지 관련 기술에 단열, 열팽창 등이 활용된 예를 조사함 으로써 과학의 유용성에 대한 가치를 인식할 수 있다."],["12역학02-02","열에 의한 물질의 상태 변화를 이해하고, 이상 기체의 온도, 압력, 부피의 관계를 설명할 수 있다."],["12역학02-03","계에 가해진 열이 계의 내부 에너지를 변화시키거나 외부에 일을 할 수 있음을 이해하고, 일상생활 속의 예를 찾음으로써 흥미를 느낄 수 있다."],["12역학02-04","다양한 열기관에서의 순환 과정과 열효율을 설명하고, 열기관의 개발과 활용이 인류 공동체에 미친 영향을 산업발전과 환경 측면에서 평가할 수 있다."],["12역학02-05","열의 이동, 기체의 확산과 같은 비가역 현상을 엔트로피를 이용하여 설명할 수 있다."],["12역학03-01","용수철 진자를 통해 단진동을 이해하고, 가속도와 변위 사이의 관계를 설명할 수 있다."],["12역학03-02"," 12운건01-02","일일, 주간, 월간 건강 운동 프로그램을 계획하고 자기 주도적으로 실천하여 건강을 관리하고, 건강 관련 분야 진로를 설계한다."],["12운건01-03","기술형 스포츠를 이용한 건강 관리 방법을 탐색하고, 일상에서 실천하며 생활화한다."],["12운건01-04","표현 활동을 이용한 건강 관리 방법을 탐색하고, 일상에서 실천하며 생활화한다."],["12운건02-01","운동 처방에 따른 트레이닝의 종류와 방법을 이해하여 체력 증진을 위한 트레이닝 프로그램을 계획하고 체력 운동에 적용하며 자기 주도적으로 체력을 관리한다."],["12운건02-02","운동 손상의 원인과 기전을 이해하고, 적절한 응급처치와 재활 운동을 통해 운동 손 상을 관리한다."]],"윤리문제 탐구":[["12윤탐01-01","삶에서 경험하는 문제를 사실문제와 윤리문제로 구분할 수 있고, 윤리문제에 대한 규범적 가치 판단의 기준이 다양함을 이해할 수 있다."],["12윤탐01-02","윤리문제 탐구의 의미를 파악하고, 윤리문제 탐구의 다양한 방법들을 이해할 수 있다."],["12윤탐02-01","행복의 의미와 행복에 대한 뇌과학의 연구 성과를 조사하고, 윤리적 삶과 행복의 관계를 탐구할 수 있다."],["12윤탐02-02","사생활 존중과 공익 사이의 갈등 사례를 조사하고, 이를 해결할 수 있는 방안을 제시할 수 있다."],["12윤탐02-03","사회적 차별 표현 사례를 조사하고, 이를 바라보는 다양한 관점을 이해하여 윤리적 해결 방안을 제시할 수 있다."],["12윤탐02-04","배타적 민족주의의 확산과 난민 문제를 탐구하고, 이를 해결할 수 있는 방안을 제시할 수 있다."],["12윤탐03-01","메타버스의 특징을 윤리적 관점에서 탐색하고, 메타버스에서 발생할 수 있는 윤리문제의 해결 방안을 제시할 수 있다."],["12윤탐03-02","빅데이터와 알고리즘의 편향성으로 인한 윤리문제를 인식하고 사회적 책임과 공정성의 관점에서 해결 방안을 탐구할 수 있다."],["12윤탐03-03","인공지능 활용 시 발생할 수 있는 윤리적 딜레마에 대해 토의하고, 인공지능의 바람직한 활용 방안을 제시할 수 있다."],["12윤탐04-01","반려동물과 관련한 윤리문제, 동물 복지를 둘러싼 논쟁 등을 윤리적 관점에서 탐구하여 생명에 대한 감수성을 길러 책임 있게 행동할 수 있다."],["12윤탐04-02","기후위기를 인류의 책임이라는 측면에서 분석하고, 에너지 전환과 탄소 중립을 둘러싼 다양한 입장에 대해 토론하여 기후위기 극복 방안을 제시할 수 있다."],["12윤탐05-01","자신이 희망하는 진로에서 발생할 수 있는 윤리문제를 선정하고 탐구 계획을 수립할 수 있다."],["12윤탐05-02","수립한 탐구 계획에 따라 윤리문제를 탐구하고 그 결과를 정리하여 발표할 수 있다."]],"윤리와 사상":[["12윤사01-01","공자사상에 바탕하여 맹자와 순자, 주희와 왕수인의 인성론을 비교하고, 인간 본성의 입장에 따른 윤리적 삶의 목표 및 방법론의 차이와 그 의의를 파악할 수 있다."],["12윤사01-02","노자의 유무상생⋅무위자연 사상과 장자의 소요유⋅제물론의 의의를 이해하고, 서로 다른 것들 간의 어울림을 통한 진정한 평화에 대해 성찰할 수 있다."],["12윤사01-03","불교의 사성제와 자비를 이해하고, 괴로움을 극복하는 방법을 실천할 수 있다."],["12윤사02-01","원효의 화쟁사상, 의천과 지눌의 선⋅교 통합 사상이 불교의 대립을 어떻게 화해시켰 는지 탐구하고, 한국불교의 특성과 통합정신의 중요성을 파악할 수 있다."],["12윤사02-02","도덕 감정의 발현 과정에 대한 퇴계와 율곡의 주장을 그 이유와 함께 비교⋅고찰하고, 일상의 감정을 도덕적으로 조절하는 방법을 제시할 수 있다."],["12윤사02-03","남명과 하곡, 다산의 사상을 통해 앎과 함의 관계에 대하여 성찰하고, 윤리적 실천 방안을 제안하여 실행할 수 있다."],["12윤사03-01","서양 윤리사상의 출발점에서 나타난 보편윤리, 영혼의 조화, 성품의 탁월성의 특징을 파악하고, 덕과 행복의 관계에 대하여 성찰할 수 있다."],["12윤사03-02","행복 추구에 대한 쾌락주의와 금욕주의의 입장을 비교하여 고찰하고, 진정한 행복을 위한 윤리적 실천 방법을 제시할 수 있다."],["12윤사03-03","그리스도교의 사랑의 윤리로서의 특징을 파악하고, 자연법 윤리 및 프로테스탄티즘 윤리에 나타난 신앙과 윤리의 관계를 성찰할 수 있다."],["12윤사03-04","옳고 그름의 기준에 대한 의무론과 결과론을 비교⋅분석하고, 옳고 그름에 대한 윤리적 관점을 정당화할 수 있다."],["12윤사03-05","실존주의와 실용주의, 도덕의 기원과 판단에 관한 과학적 탐구를 비판적으로 평가하고, 책임⋅배려 윤리에 대한 이해를 바탕으로 윤리적 삶의 의미와 지향을 설정할 수 있다."],["12윤사04-01","동⋅서양의 다양한 국가관을 비교⋅고찰하고, 오늘날의 관점에서 국가의 역할과 정당 성에 대한 체계적인 시각을 형성할 수 있다."],["12윤사04-02","시민의 자유와 권리, 공적 삶과 정치참여에 대한 자유주의와 공화주의의 관점을 비교⋅고찰하고, 시민과 공동체의 바람직한 관계를 모색할 수 있다."],["12윤사04-03","근대 대의민주주의의 대안으로 등장한 참여민주주의와 심의민주주의의 장단점을 분석 하고, 민주주의의 이상을 구현하기 위한 실천 방법을 제시할 수 있다."],["12윤사04-04","자본주의의 현실적 기여와 한계에 대해 조사⋅분석하고, 동⋅서양의 사회사상적 측면에서 자본주의의 개선 방향에 관해 탐구할 수 있다."]],"융합과학 탐구":[["12융탐01-01","과학이 다양한 분야와 연계하여 인류 사회의 문제해결에 기여하였음을 이해하고, 융합적 탐구의 유용성을 느낄 수 있다."],["12융탐01-02","예술에서의 창작이나 사회과학적 탐구 과정을 이해하고, 과학적 탐구 과정과의 공통점과 차이점을 비교할 수 있다."],["12융탐01-03","과학적 탐구 과정에서 사용되는 다양한 데이터의 종류를 이해하고, 지식의 창출 과정에서 데이터의 가치와 중요성을 인식할 수 있다."],["12융탐01-04","인공지능을 포함한 디지털 탐구 도구나 기술의 활용 사례를 조사하고, 과학적 탐구 과정에서 디지털 탐구 도구와 기술 활용의 의의를 평가할 수 있다."],["12융탐02-01","실생활에서 관찰이나 경험을 통해 직접 얻은 데이터나 공개된 데이터를 가공하여 융합적 탐구 문제를 스스로 발견할 수 있다."],["12융탐02-02","융합적 탐구 문제해결을 위한 가설이나 모형을 고안하고, 문제를 해결할 수 있는 방법이나 절차 등을 설계할 수 있다."],["12융탐02-03","디지털 탐구 도구를 포함한 다양한 도구를 활용하여 데이터를 수집하고, 수집한 데이터의 타당성과 신뢰성을 평가할 수 있다."],["12융탐02-04","융합적 탐구 과정을 통해 얻은 데이터를 탐구 목적이나 맥락에 맞게 시각 자료로 표현할 수 있다."],["12융탐02-05","평균, 표준편차 등을 바탕으로 데이터의 특성을 파악하고, 이를 토대로 가설이나 모형을 평가할 수 있다."],["12융탐02-06","데이터 분석 결과를 바탕으로 결론을 도출하고 평가할 수 있다."],["12융탐02-07","다양한 표현 방법을 활용하여 융합적 탐구 문제, 과정, 결과, 결론 등을 효과적으로 발표하고 토론할 수 있다."],["12융탐03-01","과학기술의 변화와 발전을 고려하여 미래 사회에 등장할 새로운 융합과학기술을 예측할 수 있다."],["12융탐03-02","오늘날 인류가 겪고 있는 난제를 융합과학기술을 활용하여 해결할 수 있는 방안에 대해 토의할 수 있다."],["12융탐03-03","융합과학 탐구 과정에서 준수해야 할 윤리에 대해 알아보고, 과학기술의 발달에 따라 발생할 수 있는 윤리적 쟁점을 토론할 수 있다."],["12융탐03-04","융합과학기술을 활용하여 사회 문제를 해결하는 과정에서 시민참여가 문제해결에 도움을 준 사례를 제시할 수 있다."]],"음악":[["12음01-01","다양한 주법과 표현 기법을 심화시켜 노래나 악기로 개성 있게 연주한다."],["12음01-02","음악 요소와 음악적 특징의 변화를 살려 노래나 악기로 발표하고 비평한다."],["12음01-03","소리의 상호작용을 인식하고 다양한 매체를 적용하여 표현하며 연주로 소통한다."],["12음01-04","다양한 상황과 맥락을 고려하여 연주를 생활 속에서 실천하며 서로 다른 연주 문화를 존중한다."],["12음02-01","음악을 듣고 다양한 음악 요소와 원리를 인지하며 분석한다."],["12음02-02","다양한 시대⋅사회⋅문화권의 음악을 듣고 음악적 특징과 구성의 변화를 해석한다."],["12음02-03","다양한 시대⋅사회⋅문화권의 음악을 듣고 맥락, 기능, 기여의 관점에서 비평한다."],["12음02-04","생활 속에서 음악을 들으며 감성, 정체성, 가치를 내면화하고 향유한다."],["12음02-05","시대별 국악을 듣고 비평하며, 국악을 계승⋅발전시키려는 태도를 갖는다."],["12음03-01","다양한 맥락과 연계되는 음악적 의도나 아이디어를 여러 매체나 방법에 적용하여 창작하고 성찰한다."],["12음03-02","오선보, 정간보 등의 다양한 기보법을 활용하여 주제에 맞게 악곡을 변화시킨다."],["12음03-03","음악 요소와 음악적 특징의 변화를 활용하여 다양한 형식의 음악을 만든다."],["12음03-04","생활 속에서 여러 영역과 융합한 음악을 만들며, 저작권의 중요성 및 음악의 역할과 기여에 대하여 인식한다."]],"음악 감상과 비평":[["12감비01-01","음악 요소와 악곡 구성의 원리를 이해하며 음악을 듣고 특징을 비교⋅분석하여 설명한다."],["12감비01-02","다양한 시대, 지역, 문화, 공동체의 음악을 집중하여 듣고 변화와 발전 양상을 파악한다."],["12감비01-03","음악을 듣고 음악에 내재된 미적 특성을 수용⋅공감하며 다양한 방법으로 표현한다."],["12감비01-04","생활 속에서 음악을 찾아 들으며 자신의 음악적 취향을 발견하고, 감상 경험을 공유 하며 상호 존중하는 태도를 갖는다."],["12감비02-01","사회⋅문화⋅시대적 의미, 음악적 특징, 맥락 등의 관점에서 음악을 듣고 비평한다."],["12감비02-02","사회, 문화, 산업 속의 음악을 듣고 음악의 역할과 필요성에 관해 토의하거나 토론한다."],["12감비02-03","생활 속 음악의 가치와 영향력을 이해하고 여러 분야와 연계하여 음악을 활용한다."],["12감비02-04","감상자와 비평자의 관점에서 음악을 듣고 비평하며 삶 속에서 향유하는 태도를 갖는다."]],"음악 연주와 창작":[["12연창01-01","다양한 연주 형태, 형식, 장르, 양식의 악곡을 자신의 해석을 담아 바른 발성과 주법으로 연주한다."],["12연창01-02","음악적 의도를 음악 요소와 구조에 반영하고 적합한 기보법이나 매체를 활용하여 창작한다."],["12연창01-03","음악에 대한 개인적⋅사회적 윤리의식을 갖추고 다양한 표현을 담아 공연을 구상하 거나 발전시킨다."],["12연창01-04","다양한 음악 문화의 공연 예절을 이해하고 서로의 음악 문화를 존중하며 배려하는 태도를 지닌다."],["12연창02-01","다양한 사회와 문화 속의 음악을 듣고, 연주와 창작 활동 양상을 해석하며 비평한다."],["12연창02-02","음악의 가치와 역할을 이해하여 연주 및 창작 활동에 능동적으로 참여한다."],["12연창02-03","다양한 소리와 매체, 음악적 아이디어를 연계하고 활용하여 공동체에 기여할 수 있는 공연을 기획한다."],["12연창02-04","다양한 영역과 융합하고 협업하는 연주⋅창작 활동을 통해 서로 포용하는 태도를 갖는다."]],"음악과 미디어":[["12음미01-01","음악에 활용되는 미디어의 종류와 특징을 조사하고 변화와 발전과정을 파악한다."],["12음미01-02","음악과 미디어의 관계를 분석하고 음악에 활용되는 미디어의 의미와 역할에 대해 토의하거나 토론한다."],["12음미01-03","다양한 미디어 음악을 감상하고 비평하며 음악에 활용되는 미디어의 가치를 인식한다."],["12음미01-04","미디어가 음악 산업에 미치는 영향을 비판적으로 분석하고 균형적 시각을 갖는다."],["12음미02-01","소리⋅악기⋅아이디어와 미디어 사이의 상호작용을 탐색하고 다양한 상황에 적용하여 표현한다."],["12음미02-02","음악에서 활용되는 미디어를 주체적으로 사용하여 개성 있게 연주하거나 창작한다."],["12음미02-03","미디어를 활용하여 다양한 분야와 연계⋅융합한 창의적인 음악 작품을 기획한다."],["12음미02-04","다양한 미디어와 디지털 기술의 음악적 활용에 대하여 올바른 윤리의식을 갖는다."]],"인간과 경제활동":[["12인경01-01","합리적인 의사 결정 과정을 실생활의 사례에 적용하여 이해하고 개인의 의사 결정에 따른 결과를 분석한다."],["12인경01-02","실생활에서 나타나는 비합리적 의사 결정의 사례를 통해 그 유형과 심리적⋅인지적 요인을 분석한다."],["12인경01-03","합리성을 추구하지만 공정성도 고려하는 의사 결정 과정을 실생활 사례를 통해 이해한다."],["12인경02-01","다양한 정보를 활용하여 취업 및 창업 등 자신에게 알맞은 직업을 탐색하고 그에 필요한 준비 과정을 설계한다."],["12인경02-02","직업 세계에서 발생하는 노동 문제를 분석하고 이를 해결할 수 있는 방안을 탐색한다."],["12인경02-03","혁신적 변화를 추구하는 기업가 정신의 의미를 실생활 사례를 통해 탐구한다."],["12인경03-01","다양한 소득 분배 이론을 실생활 사례에 적용하여 공정한 소득 분배의 원리를 이해한다."],["12인경03-02","자유 경쟁을 특징으로 하는 시장 경제와의 비교를 통해 자발적인 참여와 협동을 추구하는 사회적 경제의 의미를 탐구한다."],["12인경03-03","지식 정보 사회에서 정보 기술의 급격한 발전으로 형성되는 디지털 경제의 특징을 실생활 사례를 통해 분석한다."],["12인경04-01","4차 산업 혁명에 따른 새로운 산업 질서와 일자리 변화를 예측하고 미래 사회의 변화에 대응하는 방안을 탐색한다."],["12인경04-02","저출산⋅고령화에 따른 인구 변화가 경제 성장과 국가 재정 등에 미치는 영향을 분석한다."],["12인경04-03","탄소 배출을 둘러싼 선진국과 개발 도상국의 경제 정책을 비교⋅평가하여 기후변화에 대응하여 지속가능한 발전을 이룰 수 있는 방안을 탐색한다."]],"인간과 심리":[["12심리01-01","과학으로서 현대 심리학의 목표와 특징을 이해하고 심리학에 대한 호기심을 갖는다."],["12심리01-03","심리학 내 다양한 하위 분야가 실생활과 관련되거나 사회 발전에 기여한 사례를 탐색하고 자신의 진로 탐색과 연결한다."],["12심리02-01","뇌의 주요 구조와 심리적 기능의 관계, 경험⋅학습이 뇌 가소성에 미치는 영향을 탐구하여 행동의 생물학적 기초에 대한 새로운 시각을 갖는다."],["12심리02-02","전 생애 발달 과정에서 청소년기의 특징⋅발달 과업을 이해하고 성찰함으로써 자기 수용 태도를 함양한다."],["12심리02-03","지각⋅기억⋅학습의 기본 원리에 대한 이해를 바탕으로 실생활에서의 오류를 인지하고 학습 효율을 높이는 방안을 실천하여 자기 효능감을 증진한다."],["12심리02-04","성격과 동기 차원에서 주요 개인차의 개념을 이해하고 올바른 자기 이해에 활용한다."],["12심리02-05","부정⋅긍정 정서의 종류와 기능을 탐색하고 실생활에서 효과적인 정서 조절 방법을 이해하고 실천한다."],["12심리03-01","상황적 요인이 개인의 태도 변화와 집단 내 상호 작용에 미치는 영향을 분석하고 타인에 대한 개방적 태도를 가진다."],["12심리03-02","상황적 관점에서 사회 문제의 원인을 분석하고 창의적 해결 방안을 도출하여 실천한다."],["12심리03-03","갈등적 관계를 촉진하거나 완화하는 요인을 탐색하고 적용함으로써 사회 통합을 위한 의사소통 능력과 공동체 의식을 기른다."],["12심리03-04","협력적 관계의 형성과 발전에 기여하는 요인을 탐색하고 적용함으로써 타인을 배려하는 자세를 갖고 긍정적인 인간관계를 맺는 능력을 키운다."],["12심리04-01","적응⋅부적응의 의미와 유형을 탐색하여 인간 적응의 역동성⋅다양성을 이해하고 정신 장애에 대한 편견을 해소한다."],["12심리04-02","삶의 변화에 따른 스트레스 발생과 건강의 관계를 이해하고 효과적인 스트레스 대처 방안을 적용하여 회복 탄력성을 기른다."],["12심리04-03","행복의 의미에 대한 탐색에 기초하여 자기 자신의 행복관을 정립하고 개인과 사회 수준에서 행복을 증진할 수 있는 방안을 탐색하고 실천한다."]],"인간과 철학":[["12인철01-01","철학하는 삶의 특징을 이해하고 근원적인 물음을 탐구⋅발견하여 주체적으로 성찰하는 태도를 갖춘다."],["12인철01-02","철학적 사유의 특징과 철학하는 방법의 주요 요소를 분석하고 이를 생활 속 여러 문제에 적용한다."],["12인철01-03","몸과 마음의 관계를 비교⋅분석하고 인간 본성을 비판적으로 검토하여 진정한 나로 살아가는 습관을 익힌다."],["12인철01-04","인간의 한계 상황을 느끼고 깨달으며 삶의 여러 선택 상황에서 스스로 철학하기뿐 아니라, 함께 철학하기를 통하여 주체적이고 책임 있는 태도를 갖춘다."],["12인철02-01","개인과 공동체의 관계를 비판적으로 분석하여, 민주시민 사회의 구성원의 조건과 역할을 탐구한다."],["12인철02-02","소유와 공유의 가치를 논증적으로 탐색하고 경제적인 측면에서 이상적 공동체가 갖추어야 할 철학적 조건을 탐색한다."],["12인철02-03","정당한 권력과 정치의 사례를 탐색하며, 정의로운 공동체에 필요한 활동 요소들을 발견하고 실천한다."],["12인철02-04","역사와 미래의 관계에 대한 핵심 물음들을 탐구하여, 역사 변혁에 필요한 주체 의식과 공동체 의식을 기른다."],["12인철03-01","지식의 조건을 이해하고 세계에 대한 여러 종류의 앎과 가치들을 논증적으로 비교⋅탐색한다."],["12인철03-02","인식 조건에 따른 여러 가지 세계를 구성하는 요소와 그 기원을 탐색하고, 다양한 세계관을 공감적인 태도로 바라보는 자세를 익힌다."],["12인철03-03","자연 생태계의 가치와 인간의 책임을 인식하고 구체적인 사례를 조사⋅탐구하여 상생과 공존의 생활 태도를 체득한다."],["12인철03-04","디지털 생태계와 미래 생활 세계의 특성을 통찰하고 관련된 철학적 주제를 발견⋅탐구하여 환경 변화에 부응하는 가치관을 기른다."],["12인철04-01","언어가 지닌 인간의 창조 능력의 성격과 특징을 이해하고, 이를 통해 구성하는 상상적⋅초월적 세계들과 그 가치들을 탐색한다."],["12인철04-02","미의 기준을 둘러싼 여러 입장을 이해하고 아름다움에 대한 생활 속 여러 사례를 비교⋅분석하여 미적 가치관을 정립한다."],["12인철04-03","아름다움과 선함의 가치를 비교⋅성찰하여 좋은 삶에 필요한 것이 무엇인지 이해하고 창조적으로 여가를 선용하는 자세를 익힌다."],["12인철04-04","대중문화 속 창작의 의미를 비판적으로 이해하고 철학적 탐구 공동체 활동을 통해 미래 세상에 필요한 창조 활동을 구현하는 태도를 기른다."]],"인공지능 기초":[["12인기01-01","인공지능의 지능적 판단에 대한 이해를 바탕으로 인공지능을 활용한 실생활 및 다양한 학문 분야의 문제 해결 사례를 비교⋅분석한다."],["12인기01-02","인공지능에서 탐색의 중요성을 이해하고 문제 해결을 위한 탐색 과정을 설계한다."],["12인기01-03","맹목적 탐색과 정보 이용 탐색의 차이를 중심으로 지능적 탐색의 원리를 파악한다."],["12인기01-04","지능적 탐색이 필요한 문제를 찾아보고 문제 해결을 위해 정보 이용 탐색 알고리즘을 적용한다."],["12인기01-05","규칙과 사실을 활용하여 지식을 표현하고, 새로운 지식을 추론하여 생성한다."],["12인기02-01","기계학습을 적용할 문제를 정의하고, 문제 해결에 필요한 데이터를 선정하여 수집한다."],["12인기02-02","수집한 데이터를 가공하여 핵심 속성을 추출한다."],["12인기02-03","문제 해결에 적합한 기계학습의 유형과 알고리즘을 선정한다."],["12인기02-04","훈련 데이터를 이용하여 학습을 진행하고, 테스트 데이터를 사용하여 성능을 평가한다."],["12인기02-05","인공신경망과 딥러닝의 특성에 대한 이해를 바탕으로 활용 분야를 탐색한다."],["12인기02-06","딥러닝을 활용하여 실생활 및 다양한 학문 분야의 문제를 해결하고, 성능을 평가한다."],["12인기03-01","인공지능의 발전으로 인한 사회 변화를 살펴보고, 인공지능으로 해결할 수 있는 사회적 문제를 분석한다."],["12인기03-02","인공지능에 의해 변화하는 인간의 삶과 직업의 양상에 대해 이해하고 진로를 탐색한다."],["12인기03-03","인공지능에 대한 비판적 자세를 바탕으로 인공지능과 인간의 공존 방안을 도출한다."],["12인기03-04","인공지능의 활용사례와 윤리적 딜레마 상황을 인공지능 윤리 관점에서 분석한다."],["12인기04-01","지속가능발전목표를 해결하기 위해 인공지능을 적용할 수 있는 방안을 탐색하고, 인공 지능 프로젝트 활동에 적합한 주제를 도출한다."],["12인기04-02","인공지능 문제 해결 과정에 기반하여 프로젝트 수행 계획을 구안한다."],["12인기04-03","인공지능 프로젝트를 수행하는 과정에서 협력적인 문제 해결 자세를 바탕으로 인공지능 소프트웨어를 개발한다."],["12인기04-04","인공지능의 사회적 영향을 고려하여 인공지능 소프트웨어를 개발하고, 평가 결과를 반영하여 성능을 개선한다."]],"인공지능 수학":[["12인수01-01","인공지능의 개념을 이해하고 학습 방식을 수학적으로 해석할 수 있다."],["12인수01-02","인공지능에서 수학을 활용한 역사적 사례를 탐구하고 설명할 수 있다."],["12인수01-03","빅데이터의 개념과 특성을 알고 인공지능에서 빅데이터를 활용한 사례를 찾을 수 있다."],["12인수02-01","집합과 벡터를 이용하여 텍스트 데이터를 목적에 맞게 표현할 수 있다."],["12인수02-02","빈도수 벡터를 이용하여 텍스트 데이터를 요약하고 유용한 정보를 추출할 수 있다."],["12인수02-03","인공지능이 텍스트를 특성에 따라 분석하는 수학적 방법을 설명할 수 있다."],["12인수03-01","행렬을 이용하여 이미지 데이터를 목적에 맞게 표현할 수 있다."],["12인수03-02","행렬의 연산을 이용하여 이미지 데이터를 다양하게 변환할 수 있다."],["12인수03-03","인공지능이 이미지를 자동으로 분류하는 수학적 방법을 설명할 수 있다."],["12인수04-01","데이터를 분석하여 사건이 일어날 확률을 구하고 이를 예측에 이용할 수 있다."],["12인수04-02","다양한 추세선의 비교를 통해 최적화된 추세선의 필요성을 인식하게 한다."],["12인수04-03","손실함수를 이해하고 최적화된 추세선을 찾을 수 있다."],["12인수04-04","경사하강법을 이해하고 최적화된 예측을 위한 인공지능의 학습 방법을 설명할 수 있다."],["12인수05-01","수학적 원리를 이용하여 인공지능이 실생활 문제를 합리적으로 해결하는 사례를 찾을 수 있다."],["12인수05-02","인공지능과 관련된 수학 주제를 선정하여 탐구할 수 있다."]],"인문학과 윤리":[["12인윤01-01","내 몸과 마음의 관계를 탐구하고, 심신의 통합성을 자각하여 도덕적 주체로서 자신을 이해하고 존중할 수 있다."],["12인윤01-02","삶의 주체인 나에 대한 성찰을 바탕으로 고통과 쾌락의 근원 및 양상을 탐구하여, 고통과 쾌락에 지혜롭게 대처하는 자세를 갖출 수 있다."],["12인윤02-01","관계 속에서 살아가는 나에 대한 성찰을 통해 상호성을 만끽하는 삶을 모색하고 실천할 수 있다."],["12인윤02-02","우정과 사랑의 의미를 탐구하고, 행복한 삶의 기반인 진정한 우정과 참된 사랑의 관계를 형성하기 위해 노력할 수 있다."],["12인윤03-01","동⋅서양에서 바라보는 자유와 평등의 의미와 근거를 알고, 자유롭고 평등한 사람의 모습을 탐구하여 책임 있는 삶의 자세를 추구할 수 있다."],["12인윤03-02","불평등이 발생하는 원인 및 실질적 기회균등을 구현하기 위한 조건을 탐구하여, 자유롭고 평등한 삶을 위한 정의의 원칙을 도출할 수 있다."],["12인윤04-01","서로 다른 의견들이 발생하고 충돌하는 양상과 이유를 파악하고, 민주적인 방식으로 다양한 의견을 포용하는 방법과 절차를 모색하여 실천할 수 있다."],["12인윤04-02","가상세계와 현실세계의 같고 다른 점이 무엇인지 탐구하고, 가상세계에서도 자신과 타인을 존중하는 자세를 갖출 수 있다."],["12인윤05-01","자아실현과 직업생활의 상호성을 이해하고, 삶의 방식으로서 소유와 존재의 의미를 탐구하여 나와 타인의 이익을 조화롭게 추구하는 삶의 태도를 함양할 수 있다."],["12인윤05-02","기후위기 문제를 비판적으로 인식하고, 지속가능한 삶을 위해 인간과 자연에 대한 이 분법적 관점을 넘어선 상생의 원칙들을 수립하여 일상에서 실천할 수 있다."],["12인윤06-01","인간의 불완전성에 대한 성찰을 바탕으로 불안한 현대사회를 살아가는 데 있어 종교의 역할과 가치를 탐구하여, 종교에 대한 바람직한 관점을 정립할 수 있다."],["12인윤06-02","인생의 유한성을 자각하고, 자아에 대한 성찰 및 다양한 가치 탐색을 통하여 내 삶의 의미를 묻고 답을 찾아가는 도덕적 주체로서 살아갈 수 있다."]],"일본 문화":[["12일문01-01","일본 문화 내용을 이해한다."],["12일문01-02","일본 문화에 관한 다양한 글이나 디지털 텍스트에서 주제를 찾거나 내용을 요약한다."],["12일문01-03","일본 문화 내용을 조사하고 정보를 분석･정리한다."],["12일문01-04","다양한 매체를 활용하여 일본 문화 내용을 설명한다."],["12일문01-05","일본 문화 내용을 상호문화적 관점에서 온오프라인으로 의견을 공유한다."],["12일문01-06","언어문화･비언어 문화를 포함한 일본 문화 내용을 일본어 의사소통 상황에 맞게 표현한다."],["12일문01-07","일본 문화와 자신의 관심 분야를 연계하여 정보를 조사하고, 내용을 정리･심화한다."],["12일문01-08","일본 문화에 대해 호기심을 가지고 수업이나 과제 활동에 적극적으로 참여한다."]],"일본어":[["12일어01-01","음성적 특징에 유의하여 듣고 문자와 낱말을 식별한다."],["12일어01-02","낱말, 간단한 구나 문장을 듣고 의미와 내용을 이해한다."],["12일어01-03","일상생활과 관련된 간단한 글이나 대화를 듣고 핵심어나 대의를 파악하거나 추론한다."],["12일어01-04","간단한 글이나 대화를 경청하고 적절하게 반응한다."],["12일어02-01","음성적 특징에 유의하여 낱말, 간단한 구나 문장을 말한다."],["12일어02-02","간단한 구나 문장으로 자신의 생각이나 느낌을 말한다."],["12일어02-03","간단한 의사소통 기본 표현을 활용하여 상황에 맞게 말한다."],["12일어02-04","지위나 친밀도를 고려하고 언어문화적 차이를 존중하며 상황에 맞게 말한다."],["12일어02-05","상대방의 말을 존중하며 대화에 적극적으로 참여한다."],["12일어03-01","음성적 특징에 유의하여 낱말, 한자, 간단한 구나 문장을 소리 내어 읽는다."],["12일어03-02","낱말, 간단한 구나 문장을 읽고 의미를 이해한다."],["12일어03-03","간단한 글이나 대화문을 읽고 대의나 세부 내용을 파악하거나 추론한다."],["12일어03-04","간단한 디지털 텍스트를 읽고 주요 정보를 이해한다."],["12일어04-01","가나와 학습용 한자, 낱말을 바르게 쓴다."],["12일어04-02","간단한 구나 문장을 표기법과 어법에 맞게 쓴다."],["12일어04-03","간단한 대화문이나 글을 상황과 목적에 맞게 작성한다."],["12일어04-04","지위나 친밀도, 언어문화적 차이를 고려하여 간단한 글을 형식에 맞게 작성한다."],["12일어05-01","일본 문화 내용을 이해한다."],["12일어05-02","일본 문화 내용을 조사･정리하여 다양한 콘텐츠를 제작한다."],["12일어05-03","일본 문화 내용을 상호문화적 관점에서 온오프라인으로 의견을 공유한다."],["12일어05-04","언어문화･비언어 문화를 포함한 일본 문화 내용을 의사소통 상황에 활용한다."],["12일어05-05","일본 문화에 대해 호기심을 가지고 수업이나 과제 활동에 적극적으로 참여한다."]],"일본어 회화":[["12일회01-01","음성적 특징에 유의하여 낱말, 간단한 구나 문장을 듣고 자연스럽게 말한다."],["12일회01-02","일상생활과 관련된 간단한 글이나 대화를 듣고 내용을 파악한다."],["12일회01-03","간단한 구와 문장을 활용하여 다양한 상황을 묘사하거나 설명한다."],["12일회01-04","구체적인 사실이나 사건에 대해 온오프라인으로 정보를 교환하며 대화한다."],["12일회01-05","다양한 관심 주제에 대해 조사하고 자신의 의견이나 생각을 말한다."],["12일회01-06","의사소통 기본 표현을 활용하여 상황과 맥락에 맞게 말한다."],["12일회01-07","상대방의 말을 듣고 의도를 파악하거나 추론하여 대화를 이어간다."],["12일회01-08","일상생활과 관련하여 세부 정보를 묻거나 대답한다."],["12일회01-09","다양한 매체를 통해 접한 내용을 요약하여 말한다."],["12일회01-10","지위나 친밀도, 언어문화적 차이를 고려하여 상황에 맞게 말한다."],["12일회01-11","상대방을 존중하며 의사소통 활동에 흥미와 자신감을 가지고 적극적으로 참여한다."]],"전자기와 양자":[["12전자01-01","전하 주위의 전기장을 정량적으로 구하고, 전기력선과 등전위면으로부터 전기장의 세기와 방향을 추리할 수 있다."],["12전자01-02","정전기 유도와 유전분극을 설명하고, 일상생활에서 적용되는 예를 찾을 수 있다."],["12전자01-03","자기력선을 이용하여 전류가 흐르는 도선 주위의 자기장의 세기와 방향을 추리할 수 있다."],["12전자01-04","로런츠 힘이 발생하는 조건을 알고, 로런츠 힘과 관련된 현상과 기술을 설명할 수 있다."],["12전자01-05","자기선속의 변화로 전자기 유도를 이해하고, 변압기, 인덕터 등 전자기 유도의 활용 기술을 설명할 수 있다."],["12전자01-06","저항, 축전기, 인덕터를 활용하는 장치를 찾아 에너지 관점에서 정성적으로 설명할 수 있다."],["12전자01-07","다이오드, 트랜지스터 등 반도체 소자를 활용하는 전자회로를 분석하고, 현대 문명에서 반도체의 중요성을 인식할 수 있다."],["12전자02-01","빛의 간섭과 회절을 알고, 홀로그램 등 현대의 정밀 기술에 활용되는 예를 찾을 수 있다."],["12전자02-02","렌즈와 거울을 이용한 광학 기기의 원리와 수차를 설명할 수 있다."],["12전자02-03","편광의 원리를 이해하고, 이를 활용한 디지털 정보 기술의 사례를 조사할 수 있다."],["12전자02-04","광전효과에서 빛과 물질이 상호작용하는 방식을 알고, 디지털 영상 정보, 광센서, 태양전지 등 광전효과와 관련된 다양한 기술을 조사할 수 있다."],["12전자02-05","레이저의 특징과 빛이 증폭되는 원리를 알고, 레이저가 디지털 광통신 등 여러 영역에서 활용됨을 조사하여 현대 문명에서 레이저의 중요성을 인식할 수 있다."],["12전자03-01","단일 양자 수준의 이중 슬릿 실험을 통해서 입자-파동 이중성을 확인하고, 단일 양자의 분포에 대한 실험 결과를 확률 파동의 간섭을 토대로 해석할 수 있다."],["12전자03-03","터널 효과를 설명하고, 관련된 현상과 기술을 조사하여 발표할 수 있다."],["12전자03-04","현대의 원자모형을 불확정성 원리와 확률을 기반으로 설명하고, 보어의 원자모형과 비교할 수 있다."],["12전자03-05","별에서 핵융합에 의해 에너지가 생성되고 빛이 방출되는 원리를 알고, 별빛의 스펙 트럼에 기반하여 별의 구성 원소를 추리할 수 있다."]],"정보":[["12정01-01","유무선 네트워크의 특성을 이해하고, 컴퓨팅 시스템 간 공유, 협력, 소통을 위한 네트 워크 환경을 구성한다."],["12정01-02","사물인터넷의 구성과 동작 원리를 분석하고, 사물인터넷 기술로 인한 개인의 삶과 사회의 변화를 예측한다."],["12정01-03","문제 해결에 적합한 피지컬 컴퓨팅 시스템 장치를 선택하여 사물인터넷 시스템을 설계한다."],["12정02-01","디지털 데이터 압축의 개념과 필요성을 이해하고, 압축의 효율성을 분석하여 평가한다."],["12정02-02","암호화의 개념을 이해하고, 암호화를 활용하여 데이터를 안전하게 관리하는 사례를 비교⋅분석한다."],["12정02-03","빅데이터의 개념과 특징에 대한 이해를 바탕으로, 문제 해결에 적합한 데이터를 수집한다."],["12정02-04","빅데이터 분석 도구를 활용하여 데이터를 시각화하고 그 의미와 가치를 해석한다."],["12정03-01","복잡한 문제를 해결 가능한 작은 문제로 분해하고 모델링한다."],["12정03-03","데이터를 탐색하는 다양한 알고리즘의 특징과 효율을 비교⋅분석한다."],["12정03-04","자료형의 종류와 특성을 알고, 적합한 자료형을 선택하여 프로그램을 작성한다."],["12정03-05","표준입출력과 파일입출력을 활용한 프로그램을 작성한다."],["12정03-06","다차원 데이터 구조를 활용한 프로그램을 작성한다."],["12정03-07","다양한 제어 구조를 복합적으로 활용한 프로그램을 작성한다."],["12정03-08","객체를 구현하는 클래스와 인스턴스를 활용하여 프로그램을 작성한다."],["12정03-09","실생활 및 다양한 학문 분야의 문제 해결을 위한 프로그램을 협력적으로 설계⋅구현한다."],["12정03-10","문제 해결을 위한 프로그램의 성능을 평가하고 공유한다."],["12정04-01","지능 에이전트의 개념과 특성을 이해하고, 인간과 인공지능의 관계를 분석한다."],["12정04-02","기계학습의 개념을 이해하고, 지도학습과 비지도학습의 차이를 비교⋅분석한다."],["12정04-03","기계학습을 활용하여 해결할 수 있는 문제와 그렇지 않은 문제를 구분하고, 사회문제 해결에 기계학습을 적용한다."],["12정05-01","디지털 기술이 사회에 미치는 영향력을 분석하고 발전 방향을 예측하여 진로를 설계한다."],["12정05-02","보호해야 할 정보와 공유해야 할 정보를 구분하고, 올바른 정보 보호 방법을 실천한다."],["12정05-03","정보보안의 필요성을 이해하고, 보안 기술을 활용하여 디지털 윤리를 실천한다."]],"정치":[["12정치01-01","정치의 의미와 공동체 유지 발전에 정치가 필요한 이유를 이해하고, 일상생활에서 나타나는 정치의 사례를 찾아 분석한다."],["12정치01-02","민주주의 이념을 이해하고, 이를 구현하기 위한 다양한 민주주의의 모델을 탐색한다."],["12정치01-03","민주 정치의 역사적 발전 과정을 이해하고, 현대 민주 정치의 다양한 사상적 배경을 비교⋅분석한다."],["12정치01-04","민주주의를 실현하기 위한 원리를 탐색하고, 이러한 원리를 일상생활에 적용한다."],["12정치02-01","민주 국가의 정치과정을 분석하고, 시민이 정치과정에 참여해야 하는 이유를 탐색한다."],["12정치02-02","민주 정치에서 정당의 의미와 역할을 탐구하고, 다양한 정치 참여의 방법을 비교, 분석한다."],["12정치02-03","대의제에서 선거의 중요성과 선거 제도의 다양한 유형을 이해하고, 우리나라 선거 제도의 특징과 문제점을 분석한다."],["12정치02-04","미디어를 통한 정치 참여 방법의 특징과 문제점을 분석하고, 유권자이자 피선거권자로서 미디어를 비판적으로 활용하는 태도를 지닌다."],["12정치03-01","정치권력의 의미와 특징을 이해하고, 근대 이후 국가 권력이 형성되는 원리를 이해한다."],["12정치03-02","민주 국가의 정부 형태인 대통령제와 의원 내각제의 특징을 비교하여 이해하고, 우리나라 정부 형태의 특징을 헌법을 통해 분석한다."],["12정치03-03","입법부, 행정부, 사법부의 역할을 이해하고, 이들 간의 상호 관계를 권력 분립의 원리에 기초하여 분석한다."],["12정치03-04","중앙 정부와의 관계 속에서 지방 자치의 의의를 이해하고, 우리나라 지방 자치의 현실과 과제를 탐구한다."],["12정치04-01","국제 사회의 특징과 변화 과정을 이해하고 국제 정치를 바라보는 관점을 비교하여 분석한다."],["12정치04-02","다양한 국제 문제의 원인을 분석하고, 이를 해결하기 위해 국가를 비롯한 여러 주체가 수행하는 활동을 분석한다."],["12정치04-03","우리나라를 둘러싼 국제 관계를 이해하고, 외교적 관점에서 한반도를 둘러싼 국제 질서를 분석한다."],["12정치04-04","국제 사회에서 발생하는 다양한 갈등의 원인을 분석하고 세계시민으로서 갈등을 해결하는 자세를 갖는다."]],"주제 탐구 독서":[["12주탐01-01","주제 탐구 독서의 의미를 이해하고 관심 있는 분야에서 탐구할 주제를 탐색한다."],["12주탐01-02","학업과 진로 탐색을 위해 주제 탐구의 독서 목적을 수립하고 주제를 선정한다."],["12주탐01-03","관심 분야의 책과 자료가 지닌 특성을 파악하며 주제 탐구 독서를 한다."],["12주탐01-04","주제와 관련된 책이나 자료를 탐색하면서 신뢰할 수 있고 가치 있는 정보를 선정하여 분석하며 읽는다."],["12주탐01-05","주제에 관련된 책과 자료를 종합하여 읽으며 자신의 관점과 견해를 형성한다."],["12주탐01-06","매체를 포함한 다양한 방법으로 주제 탐구 독서의 과정이나 결과를 사회적으로 공유하고 소통한다."],["12주탐01-07","주제 탐구 독서를 생활화하여 주도적으로 삶을 성찰하고 계발한다."]],"중국 문화":[["12중문01-01","중국인의 생활에 반영된 문화를 이해하고 중국어 의사소통 상황에 활용한다."],["12중문01-02","중국의 다양한 문화에 대해 조사하고 정보를 분석･정리한다."],["12중문01-03","상호문화적 관점에서 한중 문화를 비교하여 공통점과 차이점을 이해한다."],["12중문01-04","다양한 중국 문화를 직간접적으로 체험하고, 다양한 매체를 활용하여 정보를 공유한다."],["12중문01-05","디지털 매체를 활용하여 얻은 정보를 비판적으로 분석하고 해석하여 자신의 의견을 표현한다."],["12중문01-06","중국 문화와 자신의 관심 분야를 연계하여 조사･정리한 내용을 설명한다."],["12중문01-07","중국 문화에 대해 호기심을 갖고 수업이나 과제 활동에 적극적으로 참여한다."]],"중국어":[["12중어01-01","발음을 듣고 성모, 운모, 성조를 변별한다."],["12중어01-02","낱말이나 구, 간단한 문장을 듣고 의미를 파악한다."],["12중어01-03","일상생활과 관련된 간단한 대화문이나 짧은 글을 듣고 의미를 파악한다."],["12중어01-04","짧은 글이나 대화를 듣고 말의 의도를 추측하거나 그에 상응하는 반응을 보인다."],["12중어02-01","낱말이나 구, 간단한 문장을 발음에 유의하여 말한다."],["12중어02-02","낱말이나 구, 간단한 문장을 활용하여 질문하거나 대답한다."],["12중어02-03","학습한 의사소통 표현을 상황에 맞게 자신감을 가지고 말한다."],["12중어02-04","다양한 매체를 활용하여 적극적으로 자신의 생각과 느낌을 말한다."],["12중어03-01","한어병음이나 기초적인 한자를 식별하고 소리 내어 읽는다."],["12중어03-02","낱말이나 구, 간단한 문장을 발음에 유의하여 읽고 의미를 파악한다."],["12중어03-03","간단한 대화문이나 글, 시각 자료를 읽고 주제나 의미를 파악한다."],["12중어03-04","디지털 매체상의 간단한 글을 찾아 읽고 주제나 의미를 파악한다."],["12중어04-01","낱말이나 구, 간단한 문장을 한어병음이나 한자로 정확하게 쓴다."],["12중어04-02","낱말의 용법과 기본 어순에 유의하여 짧은 문장을 작성한다."],["12중어04-03","다양한 유형의 텍스트에서 요구되는 간단한 정보를 기입한다."],["12중어04-04","상황이나 목적에 맞게 간단한 글을 작성한다."],["12중어05-01","중국 문화 내용을 이해하여 중국어 의사소통 상황에 활용한다."],["12중어05-02","중국 문화 내용을 조사하고 정보를 요약하거나 분석한다."],["12중어05-03","상호문화적 관점에서 한중 문화를 비교하고 문화적 다양성을 이해한다."],["12중어05-04","중국 문화를 직간접적으로 체험하고, 다양한 매체를 활용하여 정보를 공유한다."],["12중어05-05","중국 문화에 대해 호기심을 갖고 수업이나 과제 활동에 적극적으로 참여한다."]],"중국어 회화":[["12중회01-01","낱말이나 구, 문장을 듣고 의미를 파악한다."],["12중회01-02","발음과 억양에 유의하여 정확하게 말한다."],["12중회01-03","상대방의 말을 듣고 그에 상응하는 반응을 보인다."],["12중회01-04","보거나 듣거나 읽은 내용을 바탕으로 주요 의미와 맥락을 파악한다."],["12중회01-05","듣기 활동 중 다양한 매체를 활용하여 필요한 정보와 자료를 검색한다."],["12중회01-06","상황과 맥락에 맞게 의사소통 표현을 활용하여 질문하거나 답한다."],["12중회01-07","보거나 듣거나 읽은 내용을 간단하게 요약하거나 설명한다."],["12중회01-08","다양한 매체를 활용하여 적극적으로 자신의 생각과 느낌을 말한다."],["12중회01-09","경청하고 공감하며 대화에 적극적으로 참여한다."],["12중회01-10","중국, 중국어와 자신의 관심 분야를 연계하여 조사･정리한 내용을 설명한다."],["12중회01-11","중국어에 대해 호기심을 갖고 수업이나 과제 활동에 적극적으로 참여한다."]],"지구과학":[["12지구01-01","해수의 물리적, 화학적 성질을 이해하고, 실측 자료를 활용하여 해수의 온도, 염분, 밀도, 용존 산소량 등의 분포를 분석⋅해석할 수 있다."],["12지구01-02","심층 순환의 발생 원리와 분포를 알고, 표층 순환 및 기후변화의 관련성을 추론할 수 있다."],["12지구01-03","중위도 저기압과 고기압이 통과할 때 날씨의 변화를 일기도, 위상 영상, 레이더 영상을 종합하여 예측할 수 있다."],["12지구01-04","태풍의 발생, 이동, 소멸 과정 및 태풍 영향권에서 날씨를 예측하고, 뇌우, 집중호우, 폭설, 강풍, 황사 등 주요 악기상의 생성 메커니즘과 대처 방안을 제시할 수 있다."],["12지구01-05","대기와 해양의 상호작용의 사례로서 해수의 용승과 침강, 엘니뇨-남방진동(ENSO)의 현상의 진행 과정 및 관련 현상을 설명할 수 있다."],["12지구01-06","기후변화의 원인을 자연적 요인과 인위적 요인으로 구분하여 설명하고, 인간 활동에 의한 기후변화 문제를 과학적으로 해결하는 방법을 탐색할 수 있다."],["12지구02-01","지층 형성의 선후 관계를 결정짓는 법칙들을 활용하여 상대 연령을 비교하고, 방사성 동위 원소를 이용한 광물의 절대 연령 자료로 암석의 절대 연령을 구할 수 있다."],["12지구02-02","지질시대를 기(紀) 수준에서 구분하고, 지층과 화석을 통해 지질시대의 생물과 환경 변화를 해석할 수 있다."],["12지구02-03","변동대에서 마그마가 생성되고, 그 조성에 따라 다양한 화성암이 생성됨을 설명할 수 있다."],["12지구02-04","변성작용의 종류와 지각 변동에 따른 구조를 변동대와 관련지어 설명하고, 지구시스 템에서 암석이 순환함을 추론할 수 있다."],["12지구02-05","우리나라의 대표적인 지질공원의 지질학적 형성 과정을 추론하고, 지역사회와 함께하는 지질공원의 지속가능한 발전방안을 제안할 수 있다."],["12지구03-01","태양-지구-달 시스템에서의 식 현상을 이해하고 모형을 이용하여 태양계 행성의 겉 보기 운동을 설명할 수 있다."],["12지구03-02","별의 분광형 결정 및 별의 분류 과정을 이해하고, 흑체복사 법칙을 이용하여 별의 물 리량을 추론할 수 있다."],["12지구03-03","다양한 질량을 가진 별의 진화 과정을 H-R도에 나타내고 해석할 수 있다."],["12지구03-04","허블의 은하 분류 체계에 따른 은하의 특징을 비교하고 외부은하의 자료를 이용하여 특이 은하의 관측적 특징을 추론할 수 있다."],["12지구03-05","허블-르메트르 법칙으로 우주의 팽창을 이해하고 우주의 진화에 대한 다양한 설명 체계의 의의를 현대 우주론의 관점에서 비교할 수 있다."]],"지구시스템과학":[["12지시01-01","지구의 탄생 이후 지구 대기, 원시 바다, 생명체 탄생 등의 과정을 통한 지구시스템 각 권역의 형성 과정을 추론할 수 있다."],["12지시01-02","지구시스템이 진화해온 역사에서 물, 탄소, 산소의 순환 과정을 통해 지권, 수권, 기권이 변화해 왔음을 추적할 수 있다."],["12지시01-03","판구조론의 발달사와 관련지어 판을 움직이는 맨틀의 상부 운동과 플룸에 의한 구조 운동을 구분할 수 있다."],["12지시01-04","암석의 순환 과정에서 화산 활동의 역할과 화산 활동으로 생성되는 암석의 특성을 추론할 수 있다."],["12지시01-05","지진파의 종류와 특성을 이해하고, 지진파를 이용하여 지구 내부구조를 알아내는 과정을 탐구할 수 있다."],["12지시02-01","에크만 수송과 관련지어 지형류의 발생 원리를 설명할 수 있다."],["12지시02-02","해파의 발생 과정을 이해하고, 천해파와 심해파의 차이점을 비교⋅설명할 수 있다."],["12지시02-03","해일이 발생하는 여러 가지 원인을 이해하고, 피해 사례와 대처 방안을 제안할 수 있다."],["12지시02-04","조석의 발생 과정을 이해하고 자료 해석을 통해 각 지역에서의 조석 양상을 설명할 수 있다."],["12지시03-01","대기를 구성하는 기체들이 선택적 흡수체임을 이해하고, 온실효과 및 태양 자외선 차단 효과, 물의 존재 등으로 지구 생명체 존재 조건을 추론할 수 있다."],["12지시03-02","지표와 대기의 열 출입과 관련된 물리 과정 및 전 지구 평균 열수지를 해석할 수 있다."],["12지시03-03","기온의 연직 분포와 대기의 안정도와의 관계를 이해하고, 단열변화를 통해 안개나 구름이 생성되는 과정 및 강수 과정을 분석할 수 있다."],["12지시03-04","기압의 연직 분포로 정역학적 균형을 이해하고, 대기 중 연직 운동의 발생 원인을 추론할 수 있다."],["12지시03-05","지균풍, 경도풍, 지상풍의 발생 원리와 관련된 힘의 작용을 설명할 수 있다."],["12지시03-06","행성파의 발달 과정을 이해하고, 지상 고⋅저기압 발달에서 편서풍 파동의 역할을 평가할 수 있다."]],"지식 재산 일반":[["12지재01-01","역사적 발명 사례를 통하여 발명의 역사를 탐구하고, 지식재산의 가치와 중요성을 인식한다."],["12지재01-02","지식재산권의 개념을 이해하고 지식재산의 종류와 특성을 비교 분석한다."],["12지재01-03","신지식재산권의 종류와 특징을 이해하고, 사례를 분석한다."],["12지재01-04","상표권, 디자인권의 등록요건을 분석하며, 저작물을 분류해보고 저작물의 성립조건을 분석한다."],["12지재01-05","발명과 지식재산권의 관계를 파악하고, 지식재산권의 사회⋅경제⋅문화적 영향을 평가 하여 지식재산권에 대한 관심과 흥미를 키운다."],["12지재01-06","지식재산권의 권리화 과정과 심사 제도를 분석하고, 지식재산권 분야에 대한 진로를 탐색한다."],["12지재02-01","지식재산권의 종류에 따른 침해와 분쟁 사례 분석을 통하여 지식재산권 보호 개념과 중요성을 이해한다."],["12지재02-02","지식재산권 침해에 따른 적절한 대응과 예방을 위한 방안을 제시한다."],["12지재02-03","지식재산권 보호 제도를 탐구하고 지식재산권 보호와 활용의 윤리적 실천 방안을 탐색한다."],["12지재02-04","지식재산권의 가치를 활용한 기술 사업화 사례 탐구를 통해 지식재산 활용 방안을 제시한다."],["12지재02-05","기술 창업을 위해 기업가에게 필요한 역량을 탐색하고 지식재산 활용을 위한 윤리적 실천 능력을 기른다."],["12지재02-06","직무 발명 제도의 사례를 통하여 지속가능한 발명 분위기 조성을 위한 직무 발명 보상 제도의 필요성을 이해한다."],["12지재03-01","사용자의 요구를 경청 및 공감을 통하여 발명 문제를 발견하고 정의하며, 해결방안 탐색 및 범주화 과정을 통하여 창의성과 도전 정신을 기른다."],["12지재03-02","지식재산권 정보를 수집하고 관련 선행 기술을 조사하여 비판적 사고와 융합적 관점에서 특허, 디자인, 상표의 권리화 가능성을 높일 수 있는 최적의 해결 방안을 선정한다."],["12지재03-03","발명 아이디어를 스케치, 모델링, 도면 작성 등을 통하여 발명 문제 해결 방안을 시각적으로 구체화한다."],["12지재03-04","특허 명세서의 구성과 작성 방법을 이해하고, 발명을 보호할 수 있도록 청구항의 범위를 설정하여 명세서를 작성한다."],["12지재03-05","특허 출원의 과정을 이해하고, 작성한 명세서를 출원 및 권리화하는 과정을 체험하며, 프로젝트를 평가하는 과정을 통해 지식재산 창업 정신을 기른다."]],"직무 수학":[["12직수01-01","직무 상황에서 수 개념과 사칙연산의 문제를 해결하고 그 유용성을 인식할 수 있다."],["12직수01-02","큰 수를 어림하여 문제를 해결하고, 어림값을 이용하여 수의 크기를 비교할 수 있다."],["12직수01-03","시간, 길이, 무게, 들이의 표준 단위를 알고, 단위를 환산할 수 있다."],["12직수02-01","비의 개념을 직무 상황에 연결하여 적용할 수 있다."],["12직수02-02","비율을 백분율로 표현할 수 있고 직무 상황에 연결하여 적용할 수 있다."],["12직수02-03","두 양 사이의 대응 관계를 나타낸 표에서 규칙을 찾아 설명할 수 있다."],["12직수02-04","증가와 감소, 주기적 변화 등의 관계를 나타내는 그래프를 설명할 수 있다."],["12직수02-05","일차방정식 또는 일차부등식을 활용하여 직무 상황의 문제를 해결할 수 있다."],["12직수03-01","입체도형의 겨냥도와 전개도를 그릴 수 있고, 겨냥도와 전개도를 이용하여 입체도형의 모양을 만들 수 있다."],["12직수03-02","입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있고, 이러한 표현을 보고 입체 도형의 모양을 판별할 수 있다."],["12직수03-03","도형의 이동, 합동과 닮음을 직무 상황에 연결하여 문제를 해결할 수 있다."],["12직수03-04","직무 상황에서 나타나는 평면도형의 둘레와 넓이를 구할 수 있다."],["12직수03-05","직무 상황에서 나타나는 입체도형의 겉넓이와 부피를 구할 수 있다."],["12직수04-01","직무 상황에서 경우의 수를 구할 수 있다."],["12직수04-02","어떤 현상이 나타날 가능성을 수치화하여 설명할 수 있다."],["12직수04-03","직무 상황의 자료를 목적에 맞게 표와 그래프로 정리할 수 있다."],["12직수04-04","직무 상황의 다양한 표와 그래프를 해석할 수 있다."],["12직수04-05","다양한 자료의 특성을 파악하여, 직무 목적에 적합한 표나 그래프로 나타내고 합리적인 의사 결정을 할 수 있다."]],"직무 영어":[["12직영01-01","진로 및 직무 관련 주제에 관하여 주요 내용을 파악한다."],["12직영01-02","직무 수행과 관련된 말이나 대화를 듣고 상황 및 화자 간의 관계를 파악한다."],["12직영01-03","진로 탐색 및 직무 수행과 관련된 일이나 사건의 절차나 순서를 파악한다."],["12직영01-04","직무 수행과 관련된 정보에 대해 적절한 의사소통 전략을 적용하여 묻고 답한다."],["12직영01-05","직무 수행과 관련된 사실적 정보를 다양한 매체를 활용하여 재구성하여 전달한다."],["12직영01-06","진로 탐색 및 직무 수행 상황이나 목적에 맞는 서식의 글을 작성한다."],["12직영01-07","직무와 관련된 문화의 다양성에 대해 공감하며 협력적으로 소통하는 태도를 가진다."],["12직영01-08","직무 의사소통과 관련하여 개인의 권리와 정보 보안에 대한 책무성을 인식한다."]],"직무 의사소통":[["12직의01-01","직무 의사소통의 목적과 맥락, 매체, 참여자 특성을 이해하고 적절한 표현을 사용하여 능동적으로 소통한다."],["12직의01-02","직무 공동체의 다양한 소통 문화와 직무 환경 변화에 적합하게 자기를 소개하고 면접에 참여한다."],["12직의01-03","효과적인 진로 탐색 및 직무 수행을 위해 다양한 방법으로 정보를 수집하고 분석하여 내용을 이해하고 평가한다."],["12직의01-04","적절한 매체를 사용하여 직무에 필요한 정보를 체계적으로 관리하고 활용한다."],["12직의01-05","정보를 효과적으로 조직하여 직무의 목적⋅대상⋅상황에 적합하게 표현한다."],["12직의01-06","직무 수행 과정에서 발생하는 의사소통 문제와 대인 관계 갈등에 대해 대화와 협의로 대처하고 조정한다."],["12직의01-07","직무 공동체의 의사 결정 과정에 적극적으로 참여하여 대안을 탐색하고 합리적으로 문제를 해결한다."],["12직의01-08","직무 상황에서 구성원들과 다양한 매체를 활용하여 적극적으로 협업하고 언어 예절을 갖추어 소통한다."],["12직의01-09","개인의 권리와 정보 보안에 대한 책무를 인식하면서 직무 의사소통에 참여한다."],["12직의01-10","직무 환경의 변화에 대응하여 지속적으로 자기를 계발하고, 직무 의사소통에 능동적 이고 협력적으로 참여하는 태도를 지닌다."]],"진로와 직업":[["12진로01-01","관심 분야 직업인의 삶과 진로 특성을 탐구함으로써 관심 직업 및 전공 분야에서 요구되는 진로 특성을 이해한다."],["12진로01-02","나의 진로 특성을 통합적으로 이해하고, 관심 직업과 전공 분야에서 요구되는 특성 및 수행과 관련지어 나의 진로 특성을 점검하고 강점은 강화하고 부족한 점은 보완한다."],["12진로01-03","직업 윤리의 중요성을 이해하고 건강하고 안전한 일터를 만드는 직업인의 사회적 책임을 인식한다."],["12진로01-04","일, 학습, 여가의 가치와 상호 관계를 이해하고 자신의 직업 가치를 성찰한다."],["12진로02-01","미래 직업 세계를 탐색하고, 관심 분야의 직업 세계 변화를 예측 및 탐색한다."],["12진로02-02","관심 직업의 진로 경로에 따라 요구되는 역량을 탐구한다."],["12진로02-03","관심 직업의 구체적인 정보를 수집하고 나에게 필요한 내용을 선별하여 활용한다."],["12진로02-04","관심 직업과 관련된 진학 또는 취업 정보를 탐색한다."],["12진로02-05","지속 가능한 진로 개발을 위해 다양한 진로 경로를 탐색하고 평생 학습의 중요성을 이해한다."],["12진로02-06","창업가 정신을 적용하여 관심 분야의 문제 해결을 시도하고 새로운 가치를 발견한다."],["12진로02-07","고용 관계의 권리와 책임을 이해하고, 상호 존중의 자세를 지닌다."],["12진로03-01","진로의사결정의 요인과 변화 가능성을 고려하여 의사 결정을 재평가함으로써 보완하고 지속적으로 점검한다."],["12진로03-02","잠정적인 진로 목표를 설정하고 고등학교 졸업 이후의 장단기 진로 계획을 설계한다."],["12진로03-03","나의 진로 목표에 따라 진학 또는 취업에 필요한 학업 계획을 세우고 실천한다."],["12진로03-04","진로 계획의 실천을 위해 자기 관리를 하며, 환경적 변화에 대응하여 유연하게 진로를 준비한다."]],"창의 공학 설계":[["12창공01-01","공학의 의미와 특성을 이해하고, 공학적 산출물에 대한 가치를 인식한다."],["12창공01-02","공학의 발달이 인류 문명에 미친 영향을 파악하고, 인류가 공존할 수 있는 지속가능한 미래공학을 전망한다."],["12창공01-03","창의 공학 설계를 통한 문제해결 과정을 이해하고, 창의적인 해결방안에 대한 가치를 인식한다."],["12창공01-04","공학에서의 창의성 개념을 이해하고, 창의적 사고 기법과 창의 공학 설계 사례를 탐구하여 창의 공학 설계에 대한 흥미와 관심을 가진다."],["12창공01-05","창의 공학 설계 과정에서의 팀워크와 의사소통의 중요성을 인식하고, 팀워크와 의사 소통의 기본 역량을 탐구하고 팀 구성원으로서의 협력적 태도를 가진다."],["12창공01-06","창의 공학 설계를 통한 다양한 산출물을 비교, 분석하여 올바른 제품의 개발 방법에 대해 탐구한다."],["12창공02-01","공학적 문제해결에 필요한 팀 구성 방법과 구성원 간의 바람직한 협업 및 역할을 이해하고 공학적 문제해결 상황에 적합한 팀을 구성한다."],["12창공02-02","창의 공학 설계 프로젝트를 통해 융합적인 성격의 공학 문제 상황을 탐구하고 해결하는 과정에서 창의 공학 설계의 융합적 특성을 이해하며, 창의성과 자신감, 공학에 대한 긍정적인 태도와 가치를 가진다."],["12창공02-03","공학적 문제의 정의를 위해 사용자의 조사, 관찰, 체험 등의 사용자 공감 방법을 적용하여 사용자 요구 분석을 통해 문제를 정의한다."],["12창공02-04","공학적 문제 해결 방안 탐색을 위해 확산적 사고 기법을 활용하여 다양한 해결책을 창출하고 범주화한다."],["12창공02-05","수렴적 사고 기법을 적용하며 탐색 된 해결책들을 평가하여 최적의 대안을 선정하여 합리적인 해결책을 선정한다."],["12창공02-06","공학적 문제 해결 방안을 탐색하거나 선정 시 아이디어를 시각화하여 의사소통한다."],["12창공02-07","선정된 아이디어를 디지털 기반의 설계 도구를 이용하여 설계도를 그린다."],["12창공02-08","시제품 제작에 적합한 재료를 이해하고, 시제품 제작을 위해 재료의 특성을 비교 분석한다."],["12창공02-09","시제품 제작을 위한 다양한 도구의 종류와 특성을 이해하고 재료에 따른 올바른 도구를 선택 및 사용한다."],["12창공02-10","준비된 재료와 도구를 활용하여 안전하게 시제품을 제작하고, 제작 과정을 기록하고 공유한다."],["12창공02-11","창의 공학 설계의 과정과 산출물을 평가하고, 평가 결과를 바탕으로 시제품을 수정, 보완한다."]],"체육1":[["12체육1-01-01","신체활동이 건강에 영향을 미치는 기전과 효과를 탐구한다."],["12체육1-01-02","생애주기별 건강 관리 방법에 따라 건강을 체계적으로 관리하여 자아 존중감을 높인다."],["12체육1-01-03","건강 관리 측면에서 고려해야 할 다양한 안전 요소를 이해하고, 안전사고에 적절하게 대처한다."],["12체육1-02-01","전략형 스포츠 문화의 개념과 특성을 탐색한다."],["12체육1-02-02","전략형 스포츠의 경기 기능을 과학적 원리에 따라 분석하고, 적극적으로 개선한다."],["12체육1-02-03","전략형 스포츠의 경기 방법 및 전략을 이해하고, 경기 상황에 맞게 응용한다."],["12체육1-03-01","생태형 스포츠 문화의 개념과 특성을 탐색하고, 스포츠 환경에 대한 생태 감수성을 실천한다."],["12체육1-03-02","생태형 스포츠의 경기 기능을 과학적 원리에 따라 분석하고, 적극적으로 개선한다."],["12체육1-03-03","생태형 스포츠의 경기 방법 및 전략을 이해하고, 경기 상황에 맞게 응용한다."]],"체육2":[["12체육2-01-01","체력 증진을 위한 과학적 원리와 특성을 이해하고, 체력 증진 운동에 적용한다."],["12체육2-01-02","체력을 과학적으로 분석하고, 종합적 관리 방법에 따라 체력을 증진한다."],["12체육2-01-03","체력 증진 운동에서 안전의 중요성을 이해하고 체력 증진 운동 시 발생할 수 있는 신체 위기 상황에 침착하게 대처한다."],["12체육2-02-01","기술형 스포츠 문화의 개념과 특성을 탐색하고, 지속적인 경기 참여를 통해 신체적 자기효능감을 높인다."],["12체육2-02-02","기술형 스포츠의 경기 기능을 과학적 원리에 따라 분석한다."],["12체육2-02-03","기술형 스포츠의 경기 방법 및 전략을 이해하고 경기 상황에 맞게 응용한다."],["12체육2-03-01","표현 활동 문화의 유형, 개념, 특성을 이해하고, 다양한 표현 활동 문화를 탐색한다."],["12체육2-03-02","표현 활동의 미적 원리를 이해하고, 표현 동작을 심층적으로 분석하여 창의적으로 동작을 수행한다."],["12체육2-03-03","표현 주제에 맞게 창의적으로 작품을 창작하고 감상⋅비평함으로써 심미적 안목을 갖는다."]],"통합과학1":[["10통과1-01-01","자연을 시간과 공간에서 기술할 수 있음을 알고, 길이와 시간 측정의 현대적 방법과 다양한 규모의 측정 사례를 조사할 수 있다."],["10통과1-01-02","과학 탐구에서 중요한 기본량의 의미를 알고, 자연 현상을 기술하는 데 단위가 가지는 의미와 적용사례를 설명할 수 있다."],["10통과1-01-03","과학 탐구에서 측정과 어림의 의미를 알고, 일상생활의 여러 가지 상황에서 측정 표준의 유용성과 필요성을 논증할 수 있다."],["10통과1-01-04","자연에서 일어나는 다양한 변화를 측정⋅분석하여 정보를 산출함을 알고, 이러한 정보를 디지털로 변환하는 기술을 정보 통신에 활용하여 현대 문명에 미친 영향을 인식한다."],["10통과1-02-01","천체에서 방출되는 빛의 스펙트럼을 분석하여 우주 초기에 형성된 원소와 천체의 구성 물질을 추론할 수 있다."],["10통과1-02-02","우주 초기의 원소들로부터 태양계의 재료이면서 생명체를 구성하는 원소들이 형성되는 과정을 통해 지구와 생명의 역사가 우주 역사의 일부분임을 해석할 수 있다."],["10통과1-02-03","세상을 구성하는 원소들의 성질이 주기성을 나타내는 현상을 통해 자연의 규칙성을 도출하고, 지구와 생명체를 구성하는 주요 원소들이 결합을 형성하는 이유를 해석할 수 있다."],["10통과1-02-05","지각과 생명체를 구성하는 물질들이 기본 단위체의 결합을 통해서 형성된다는 것을 규산염 광물, 단백질과 핵산의 예를 통해 설명할 수 있다."],["10통과1-02-06","지구를 구성하는 물질을 전기적 성질에 따라 구분할 수 있고, 물질의 전기적 성질을 응용하여 일상생활과 첨단기술에서 다양한 소재로 활용됨을 인식한다."],["10통과1-03-01","지구시스템은 태양계라는 시스템의 구성요소임을 알고, 지구시스템을 구성하는 권역들 간의 물질 순환과 에너지 흐름의 결과로 나타나는 현상을 논증할 수 있다."],["10통과1-03-02","지권의 변화를 판구조론 관점에서 해석하고, 에너지 흐름의 결과로 발생하는 지권의 변화가 지구시스템에 미치는 영향을 추론할 수 있다."],["10통과1-03-03","중력의 작용으로 인한 지구 표면과 지구 주위의 다양한 운동을 설명할 수 있다."],["10통과1-03-04","상호작용이 없을 때 물체가 가속되지 않음을 알고, 충격량과 운동량의 관계를 충돌 관련 안전장치와 스포츠에 적용할 수 있다."],["10통과1-03-06","생명 시스템의 유지에 필요한 세포 내 정보의 흐름을 유전자로부터 단백질이 만들어지는 과정을 중심으로 설명할 수 있다."]],"통합과학2":[["10통과2-01-01","지질시대를 통해 지구 환경이 끊임없이 변화해 왔으며 이러한 환경 변화가 생물다양성에 미치는 영향을 추론할 수 있다."],["10통과2-01-02","변이의 발생과 자연선택 과정을 통해 생물의 진화가 일어나고, 진화의 과정을 통해 생물다양성이 형성되었음을 추론할 수 있다."],["10통과2-01-03","자연과 인류의 역사에 큰 변화를 가져온 광합성, 화석 연료 사용, 철의 제련 등에서 공통점을 찾아 산화와 환원을 이해하고, 생활 주변의 다양한 변화를 산화와 환원의 특징과 규칙성으로 분석할 수 있다."],["10통과2-01-04","대표적인 산⋅염기 물질의 특징을 알고, 산과 염기를 혼합할 때 나타나는 중화 반응을 생활 속에서 이용할 수 있다."],["10통과2-01-05","생활 주변에서 에너지를 흡수하거나 방출하는 현상을 찾아 에너지의 흡수 방출이 우리 생활에 어떻게 이용되는지 토의할 수 있다."],["10통과2-02-01","생태계 구성요소를 이해하고 생물과 환경 사이의 상호 관계를 설명할 수 있다."],["10통과2-02-02","먹이 관계와 생태 피라미드를 중심으로 생태계 평형이 유지되는 과정을 이해하고, 환경의 변화가 생태계에 미칠 수 있는 영향에 대해 협력적으로 소통할 수 있다."],["10통과2-02-03","온실효과 강화로 인한 지구온난화의 메커니즘을 이해하고, 엘니뇨, 사막화 등과 같은 현상이 지구 환경과 인간 생활에 미치는 영향과 대처 방안을 분석할 수 있다."],["10통과2-02-05","발전기에서 운동 에너지가 전기 에너지로 전환되는 과정을 이해하고, 열원으로서 화석 연료, 핵에너지를 이용하는 발전소가 인간 생활에 미치는 영향을 조사⋅발표할 수 있다."],["10통과2-02-06","에너지 효율의 의미와 중요성을 이해하고, 지속가능한 발전과 지구 환경 문제 해결에 신재생 에너지 기술을 활용하는 방안을 탐색할 수 있다."],["10통과2-03-01","감염병의 진단, 추적 등을 사례로 과학의 유용성을 설명하고, 미래 사회 문제 해결에서 과학의 필요성에 대해 논증할 수 있다."],["10통과2-03-02","빅데이터를 과학기술사회에서 사용하고 있는 사례를 조사하고, 빅데이터 활용의 장점과 문제점을 추론할 수 있다."],["10통과2-03-03","인공지능 로봇, 사물인터넷 등과 같이 과학기술의 발전을 인간 삶과 환경 개선에 활용하는 사례를 찾고, 이러한 과학기술의 발전이 미래 사회에 미치는 유용성과 한계를 예측할 수 있다."],["10통과2-03-04","과학기술의 발전 과정에서 발생할 수 있는 과학 관련 사회적 쟁점(SSI)과 과학기술 이용에서 과학 윤리의 중요성에 대해 논증할 수 있다."]],"통합사회1":[["10통사1-01-01","인간, 사회, 환경을 바라보는 시간적, 공간적, 사회적, 윤리적 관점의 의미와 특징을 사례를 통해 파악한다."],["10통사1-01-02","인간, 사회, 환경의 탐구에 통합적 관점이 요청되는 이유를 도출하고 이를 탐구에 적용한다."],["10통사1-02-01","시대와 지역에 따라 다르게 나타나는 행복의 기준을 사례를 통해 비교하여 평가하고, 삶의 목적으로서 행복의 의미를 성찰한다."],["10통사1-02-02","행복한 삶을 실현하기 위한 조건으로 질 높은 정주 환경의 조성, 경제적 안정, 민주주의 발전 및 도덕적 실천의 필요성에 관해 탐구한다."],["10통사1-03-01","자연환경이 인간의 생활에 미치는 영향에 관한 과거와 현재의 사례를 조사하여 분석하고, 안전하고 쾌적한 환경에서 살아가는 것이 시민의 권리임을 주장한다."],["10통사1-03-02","자연에 대한 인간의 다양한 관점을 사례를 통해 비교하고, 인간과 자연의 바람직한 관계를 제안한다."],["10통사1-03-03","환경 문제 해결을 위한 정부, 시민사회, 기업 등의 다양한 노력을 조사하고, 생태시민으로서 실천 방안을 모색한다."],["10통사1-04-01","자연환경과 인문환경의 영향을 받아 형성된 다양한 문화권의 특징과 삶의 방식을 탐구한다."],["10통사1-04-02","문화 변동의 다양한 양상을 이해하고, 현대 사회에서 전통문화가 지니는 의의를 탐색한다."],["10통사1-04-03","문화적 차이에 대한 상대주의적 태도의 필요성을 이해하고, 보편 윤리의 차원에서 자문화와 타문화를 평가한다."],["10통사1-04-04","다문화 사회의 현황을 조사하고, 문화적 다양성을 존중하는 태도를 바탕으로 갈등 해결 방안을 모색한다."],["10통사1-05-01","산업화, 도시화로 인해 나타난 생활공간과 생활양식의 변화 양상을 조사하고, 이에 따른 문제점의 해결 방안을 제안한다."],["10통사1-05-02","교통⋅통신 및 과학기술의 발달과 함께 나타난 생활공간과 생활양식의 변화 양상을 조사하고, 이에 따른 문제점의 해결 방안을 제안한다."],["10통사1-05-03","자신이 거주하는 지역을 사례로 공간 변화가 초래한 양상 및 문제점을 탐구하고, 공동체의 구성원으로서 지역사회의 변화를 위한 방안을 모색하고 이를 실천한다."]],"통합사회2":[["10통사2-01-01","근대 시민 혁명 등을 통해 확립되어 온 인권의 의미와 변화 양상을 이해하고, 현대 사회에서 주거, 안전, 환경, 문화 등 다양한 영역으로 인권이 확장되고 있는 사례를 조사한다."],["10통사2-01-02","인간 존엄성 실현과 인권 보장을 위한 헌법의 역할을 파악하고, 시민의 권익을 보호하기 위한 다양한 시민 참여의 방안을 탐구하고 이를 실천한다."],["10통사2-01-03","사회적 소수자 차별, 청소년의 노동권 등 국내 인권 문제와 인권지수를 통해 확인할 수 있는 세계 인권 문제의 양상을 조사하고, 이에 대한 해결 방안을 모색한다."],["10통사2-02-01","정의의 의미와 정의가 요구되는 이유를 파악하고, 다양한 사례를 통해 정의의 실질적 기준을 탐구한다."],["10통사2-02-02","개인과 공동체의 관계를 기준으로 다양한 정의관을 비교하고, 이를 구체적인 사례에 적용하여 설명한다."],["10통사2-02-03","사회 및 공간 불평등 현상의 사례를 조사하고, 정의로운 사회를 만들기 위한 다양한 제도와 시민으로서의 실천 방안을 제안한다."],["10통사2-03-01","자본주의의 역사적 전개 과정과 그 특징을 조사하고, 시장과 정부의 관계를 중심으로 다양한 삶의 방식을 비교 평가한다."],["10통사2-03-02","합리적 선택의 의미와 그 한계를 파악하고, 지속가능발전을 위해 요청되는 정부, 기업가, 노동자, 소비자의 바람직한 역할과 책임에 관해 탐구한다."],["10통사2-03-03","금융 자산의 특징과 자산 관리의 원칙을 토대로 금융 생활을 설계하고, 경제적, 사회적 환경의 변화가 금융과 관련한 의사 결정에 미치는 영향을 탐구한다."],["10통사2-03-04","자원, 노동, 자본의 지역 분포에 따른 국제 분업과 무역의 필요성을 이해하고, 지속가능발전에 기여하는 국제무역의 방안을 탐색한다."],["10통사2-04-01","세계화의 다양한 양상을 살펴보고, 세계화 시대의 문제점과 그에 대한 해결 방안을 제안한다."],["10통사2-04-02","평화의 관점에서 국제 사회의 갈등과 협력의 사례를 조사하고, 세계 평화를 위한 행위 주체의 바람직한 역할을 탐색한다."],["10통사2-04-03","남북 분단과 동아시아의 역사 갈등 상황을 분석하고, 이를 토대로 우리나라가 세계 평화에 기여할 수 있는 방안을 제안한다."],["10통사2-05-01","세계의 인구 분포와 구조 등에 대한 이해를 토대로 현재와 미래의 인구 문제 양상을 파악하고, 그 해결 방안을 제안한다."],["10통사2-05-02","지구적 차원에서 에너지 자원의 분포와 소비 실태를 파악하고, 기후변화에 대한 대응과 지속가능한 발전을 위한 제도적 방안과 개인적 노력을 탐구한다."],["10통사2-05-03","미래 사회의 모습을 다양한 측면에서 예측하고, 이를 바탕으로 세계시민으로서 자신의 미래 삶의 방향을 설정한다."]],"프랑스 문화":[["12프문01-01","프랑스어권의 문화 내용을 이해한다."],["12프문01-02","프랑스어권의 문화 내용을 프랑스어 의사소통에 활용한다."],["12프문01-03","다양한 매체를 활용하여 프랑스어권 문화에 대해 조사･정리한다."],["12프문01-04","프랑스어권 문화에 관한 자료를 분석하고 설명한다."],["12프문01-05","자신의 관심 분야와 연계하여 프랑스어권 문화 자료를 조사하고 정리･심화한다."],["12프문01-06","상호문화적 관점에서 한국 문화와 프랑스어권 문화의 공통점과 차이점을 이해한다."],["12프문01-07","프랑스어권 문화에 대해 호기심을 가지고 탐구 활동에 적극적으로 참여한다."]],"프랑스어":[["12프어01-01","발음 규칙에 유의하여 철자, 낱말을 식별한다."],["12프어01-02","낱말이나 간단한 구, 문장을 듣고 의미를 파악한다."],["12프어01-03","간단한 의사소통 표현을 듣고 내용을 추론하거나 상황에 맞게 반응한다."],["12프어01-04","듣기 자료나 상대방의 말을 경청하고 호응한다."],["12프어02-01","낱말이나 간단한 구, 문장을 발음 규칙에 유의하며 따라 말한다."],["12프어02-02","간단한 의사소통 표현을 활용하여 상황에 맞게 대화한다."],["12프어02-03","일상적이고 친숙한 주제에 대해 자신의 생각을 말한다."],["12프어02-04","상대방을 존중하며 적극적으로 대화에 참여한다."],["12프어03-01","발음 규칙을 이해하고 낱말이나 간단한 구, 문장을 소리 내어 읽는다."],["12프어03-02","간단한 시각 자료나 서식을 읽고 정보를 파악한다."],["12프어03-03","간단한 대화문이나 자료를 읽고 내용을 이해하거나 상황에 맞게 반응한다."],["12프어04-01","낱말이나 간단한 구, 문장을 어법에 맞게 쓴다."],["12프어04-02","간단한 글과 서식을 상황과 목적에 맞게 작성한다."],["12프어04-03","글쓰기에 흥미를 갖고 쓰기 활동에 적극적으로 참여한다."],["12프어05-01","프랑스어권의 문화 내용을 이해한다."],["12프어05-02","프랑스어권의 문화 내용을 프랑스어 의사소통에 활용한다."],["12프어05-03","프랑스어권의 문화 내용을 조사･정리한다."],["12프어05-04","프랑스어권 문화를 상호문화적 관점에서 우리 문화와 비교한다."],["12프어05-05","프랑스어권 문화에 관심을 갖고 탐구 활동에 적극적으로 참여한다."]],"프랑스어 회화":[["12프회01-01","낱말, 구, 문장을 듣고 발음 규칙에 유의하며 따라 말한다."],["12프회01-02","의사소통 표현을 듣고 상황에 맞게 반응하거나 답한다."],["12프회01-03","의사소통 표현을 활용하여 목적에 맞게 말한다."],["12프회01-04","의사소통 표현을 활용하여 자신의 주변 상황에 대해 묘사한다."],["12프회01-05","다양한 주제의 대화나 자료를 듣고 내용에 대해 묻거나 답한다."],["12프회01-06","다양한 주제의 대화나 자료를 듣고 내용을 파악하여 반응한다."],["12프회01-07","다양한 주제의 대화나 자료를 듣고 맥락이나 의도를 파악하여 자신의 의견을 말한다."],["12프회01-08","일상적인 주제에 대해 자신의 의견이나 감정을 표현한다."],["12프회01-09","일상적인 주제에 대해 상황과 목적에 맞게 묻거나 답한다."],["12프회01-10","듣기 자료나 상대방의 말을 경청하고 호응한다."],["12프회01-11","상대방을 존중하며 적극적으로 대화에 참여한다."]],"한국사1":[["10한사1-01-01","고대 국가의 형성과 성장 과정을 파악한다."],["10한사1-01-02","고려의 통치 체제와 지배 세력의 변화를 이해한다."],["10한사1-01-03","조선의 성립과 정치 운영의 변화를 파악한다."],["10한사1-01-04","조선 후기에 등장한 새로운 변화 양상을 이해한다."],["10한사1-02-01","근대 이전 국제 관계와 대외 교류의 시대적 특징을 비교한다."],["10한사1-02-02","근대 이전의 수취 체제 변화를 농업 중심의 경제생활과 관련하여 탐구한다."],["10한사1-02-03","근대 이전 사회 구조를 신분제를 중심으로 분석한다."],["10한사1-02-04","근대 이전의 사상과 문화를 국제 교류와 관련하여 탐구한다."],["10한사1-02-05","근대 이전 한국사 주제를 설정하여 탐구하고, 그 결과를 다양한 방법으로 표현한다."],["10한사1-03-01","조선의 개항을 국제 질서의 변동과 연관하여 분석한다."],["10한사1-03-02","여러 세력이 추진한 근대 국가 수립의 다양한 노력을 이해한다."],["10한사1-03-03","개항 이후 사회⋅경제 변화를 파악하고, 서구 문물의 도입이 문화에 미친 영향을 탐구한다."],["10한사1-03-04","일제의 국권 침탈 과정을 조사하고, 이에 맞선 국권 수호 운동의 흐름을 파악한다."]],"한국사2":[["10한사2-01-01","일제의 식민 통치 정책을 제국주의 질서의 변동과 연관하여 이해한다."],["10한사2-01-02","일제의 식민 통치가 초래한 경제 구조의 변화와 그것이 경제생활에 미친 영향을 분석한다."],["10한사2-01-03","국내외에서 전개된 민족 운동의 흐름을 이해한다."],["10한사2-01-04","일제의 식민 통치로 인한 사회 및 문화의 변화와 대중운동의 양상을 파악한다."],["10한사2-01-05","일제의 침략 전쟁에 맞서 전개된 독립 국가 건설 운동의 양상을 분석한다."],["10한사2-02-01","냉전 체제가 한반도 정세에 미친 영향을 파악하고, 자유민주주의에 기초한 대한민국 정부 수립 과정을 탐색한다."],["10한사2-02-02","6⋅25 전쟁과 분단의 고착화 과정을 국내외의 정세 변화와 연관하여 이해한다."],["10한사2-02-03","4⋅19 혁명에서 6월 민주 항쟁에 이르는 민주화 과정을 탐구한다."],["10한사2-02-04","산업화의 성과를 파악하고, 그것이 사회 및 환경에 미친 영향을 인식한다."],["10한사2-02-05","사회⋅경제의 변화에 따른 문화 변동과 일상생활의 변화 사례를 조사한다."],["10한사2-03-01","6월 민주 항쟁 이후 각 분야에서 전개된 민주화의 과정을 탐구한다."],["10한사2-03-02","외환 위기의 극복 과정을 이해하고, 사회와 문화의 변동을 파악한다."],["10한사2-03-03","한반도 분단과 동아시아의 갈등을 극복하고 평화를 실현하기 위한 방안을 모색한다."]],"한국지리 탐구":[["12한탐01-01","다양한 현상에 대해 지리적 관점으로 질문을 던지고, 질문에 답을 하기 위한 탐구 계획을 수립한다."],["12한탐01-02","야외조사 및 지리정보기술을 활용한 데이터 수집방법을 연습하고, 탐구 질문에 맞춰 데이터를 수집, 분석, 시각화한다."],["12한탐02-01","식품의 생산, 유통, 소비과정을 조사함으로써 음식을 통한 생산자와 소비자, 상품, 장소의 연결성을 이해하고, 상품사슬을 조직하는 윤리적인 방식의 가능성과 한계를 파악한다."],["12한탐02-02","핫플레이스의 특징, 생성과정, 정체성 이슈를 조사하고, 지역 자원을 활용한 관광 활성화 방안을 제안한다."],["12한탐02-03","모빌리티와 모바일, 빅데이터, 플랫폼의 결합이 시⋅공간 활용에 미치는 영향을 설명하고, 모빌리티 공유서비스가 일상생활에 미친 영향과 문제점을 조사해 대안을 제시한다."],["12한탐03-01","통계 자료를 활용해 우리나라 인구 및 가구구조의 변화를 시각화 및 분석하고, 저출생, 고령화, 다문화 가구의 증가에 대응하기 위한 방안을 모색한다."],["12한탐03-02","식생활 변화 및 세계화에 따른 우리나라 농업의 변화를 이해하고, 지속가능한 농업과 농촌을 위한 정책을 제안한다."],["12한탐03-03","산업구조의 전환이 지역 경제에 미치는 영향을 이해하고, 이를 바탕으로 최근 급속하게 성장한 지역과 위기의 징후가 나타나는 지역의 성격과 특징을 비교한다."],["12한탐03-04","수도권 집중에 따른 지방소멸과 국토 불균등 발전 문제에 대한 인식을 바탕으로 국가 및 지역 수준의 국토균형발전 방안을 제안하고 실현 가능성을 평가한다."],["12한탐04-01","세계유산으로 등재된 한반도 자연경관의 가치를 탁월성과 보편성의 측면에서 설명하고, 이를 토대로 등재 가능한 자연경관을 추천한다."],["12한탐04-02","도시화, 농업, 관광지 개발로 인한 산지, 하천, 해안지역의 변화를 조사하고, 환경과 개발에 대한 관점이 자연환경의 복원 및 지속가능한 활용에 미치는 영향을 파악한다."],["12한탐04-03","우리나라 및 우리 지역에서 주로 발생하는 자연재해의 유형과 특징을 분석하고, 이를 토대로 자연재해의 경감 대책을 조사하고 평가한다."],["12한탐04-04","우리나라의 에너지원별 발전에 관한 주요 쟁점을 조사하고, 탄소중립 달성을 위한 에너지 정책을 제안한다."],["12한탐05-01","북한의 지리적 특징과 당면과제에 대한 이해를 바탕으로 남북협력의 가능성을 모색한다."],["12한탐05-02","한반도를 둘러싼 국가 간 경계와 접경지역을 분석하고, 동아시아 지역의 발전과 평화⋅공존을 위한 지정학적 전략을 토론한다."]],"행성우주과학":[["12행우01-01","태양계 탐사선의 활동을 통해 알아낸 성과를 이해하고, 인공위성을 활용한 우주탐사의 필요성을 토론할 수 있다."],["12행우01-03","태양계를 지배하는 힘이 태양의 중력임을 이해하고, 케플러의 세 가지 법칙을 이용하여 태양계 구성 천체들의 운동을 설명할 수 있다."],["12행우01-04","행성과 소천체의 정의를 구분하여 이해하고, 소천체 탐사 자료를 통해 이들의 특징을 추론할 수 있다."],["12행우01-05","외계 행성계 탐사의 원리를 이해하고, 외계 행성에 생명체가 존재할 수 있는 조건과 외계 생명체의 존재 가능성에 대해 논증할 수 있다."],["12행우02-01","태양의 광구와 대기에서 나타나는 현상을 설명하고, 이러한 현상이 다양한 파장의 관측 자료에서 어떻게 나타나는지 비교⋅분석할 수 있다."],["12행우02-02","별의 시차와 밝기를 이용하여 거리를 측정하는 다양한 방법을 비교⋅평가할 수 있다."],["12행우02-03","별의 시선속도와 접선속도의 합으로 공간 운동이 나타남을 이해하고, 별자리를 구성하는 별들의 장시간에 걸친 형태 변화를 추론할 수 있다."],["12행우02-05","광도곡선의 특징을 비교하여 맥동변광성과 폭발 변광성을 구분하고, 폭발 변광성 중 초신성 관측 자료를 통해 알 수 있는 과학적 사실을 추론할 수 있다."],["12행우03-01","성단의 C-M도를 이용하여 성단의 나이와 거리를 비교하고, 맥동변광성의 주기-광도 관계를 이용하여 우리은하의 구조와 규모를 추론할 수 있다."],["12행우03-02","성간 소광 자료를 통해 성간 티끌의 존재를 추론하고, 성간 티끌의 특징을 설명할 수 있다."],["12행우03-03","은하의 회전 속도 곡선을 이용하여 질량 분포를 이해하고 은하에 빛을 내지 않는 물질의 존재를 추론할 수 있다."],["12행우03-04","대규모로 이루어진 외부은하의 적색 편이 탐사의 성과를 이해하고, 은하의 공간 분포를 파악함에 있어서 분광 관측 자료의 중요성을 인식할 수 있다."],["12행우03-05","은하의 공간 분포 자료를 통해 은하의 집단을 이해하고, 은하 장성, 보이드 등 우주의 거시적인 구조를 현대 우주론과 관련지어 설명할 수 있다."]],"현대사회와 윤리":[["12현윤01-01","윤리학의 성격과 특징을 바탕으로 윤리적 존재로서의 인간 본성을 이해하고, 현대사회의 다양한 윤리 문제를 탐구 및 토론할 수 있다."],["12현윤01-02","동양 및 서양의 윤리사상, 사회사상의 접근들을 비교 분석하고, 이를 현대 사회의 다양한 윤리 문제와 쟁점에 적용하여 윤리적 해결 방안을 도출할 수 있다."],["12현윤02-01","삶과 죽음을 동⋅서양 윤리의 입장에서 성찰하고, 현대사회에서 발생하는 생명윤리 문제를 다양한 윤리적 관점에서 설명할 수 있다."],["12현윤02-02","사랑과 성에 관한 다양한 입장과 성차별의 윤리적 문제를 이해하고, 현대사회의 결혼 및 가족 문제를 윤리적 관점에서 탐구할 수 있다."],["12현윤02-03","자연을 바라보는 동⋅서양의 관점을 비교⋅설명할 수 있으며 오늘날 환경 문제의 사례와 심각성을 조사하고, 이에 대한 윤리적 해결 방안을 제시할 수 있다."],["12현윤03-01","과학기술 연구에 대한 다양한 관점을 조사하여 비교⋅설명할 수 있으며 이를 과학기술의 사회적 책임 문제에 적용하여 비판 또는 정당화할 수 있다."],["12현윤03-02","정보통신 기술과 뉴미디어의 발달에 따른 윤리 문제들을 제시할 수 있으며 이에 대한 해결 방안을 정보윤리와 미디어 윤리의 관점에서 제시할 수 있다."],["12현윤03-03","윤리적인 인공지능을 위하여 인간과 인공지능의 관계를 설명하고, 인공지능으로 인해 발생하는 윤리 문제의 해결 방안을 인공지능 윤리의 관점에서 제시할 수 있다."],["12현윤04-01","직업의 의의와 다양한 직업군에 따른 직업윤리를 제시할 수 있으며 공동체 발전을 위한 청렴한 삶과 노동의 가치에 대한 사회적 존중의 필요성을 설명할 수 있다."],["12현윤04-02","개인선과 공동선의 조화가 필요한 이유를 설명할 수 있으며, 시민의 정치참여 필요성과 시민불복종의 조건 및 정당성을 제시할 수 있다."],["12현윤04-03","공정한 분배를 이루기 위한 정책을 분배 정의 이론을 통해 비판 또는 정당화할 수 있으며, 사형 제도와 형벌을 교정적 정의의 관점에서 비판 또는 정당화할 수 있다."],["12현윤05-01","미적 가치와 윤리적 가치를 예술과 도덕의 관계 차원에서 설명할 수 있으며 현대의 대중문화의 순기능과 역기능을 윤리적 관점에서 이해하고 성찰할 수 있다."],["12현윤05-02","의식주 생활과 관련된 윤리 문제와 경제생활에서 발생하는 도덕적 선과 이윤 추구 사이의 갈등 및 소비문화의 문제점을 윤리적 관점에서 비판할 수 있다."],["12현윤05-03","다문화 이론을 통해 문화의 다양성을 존중해야 할 필요성을 인식하고 종교 갈등, 이주민 차별 등과 같은 다문화 관련 문제의 해결 방안을 제시할 수 있다."],["12현윤06-01","다양한 사회적 갈등의 양상을 제시하고 동⋅서양의 윤리 이론을 바탕으로 사회통합을 위한 방안을 제안할 수 있으며, 바람직한 소통과 담론을 실천할 수 있다."],["12현윤06-02","한반도의 통일과 평화에 관한 쟁점을 객관적으로 이해하고, 보편적인 윤리적 가치를 바탕으로 남북한의 화해를 위한 개인적⋅국가적 노력을 구체적으로 제시할 수 있다."],["12현윤06-03","국제 사회의 윤리 문제를 국제 정의의 관점에서 비판적으로 설명하고, 국제 사회에 대한 책임과 기여를 윤리적 관점에서 정당화하고 실천 방안을 제시할 수 있다."]],"화법과 언어":[["12화언01-01","언어를 인간의 삶과 관련지어 이해하고, 국어와 국어생활이 시간의 흐름에 따라 변화하는 양상을 분석한다."],["12화언01-02","표준 발음을 이해하고 정확하게 발음하는 국어생활을 한다."],["12화언01-03","품사와 문장 구조에 대한 지식을 활용하여 언어 자료를 분석하고 설명한다."],["12화언01-04","단어의 짜임과 의미, 단어 간의 의미 관계를 중심으로 어휘를 이해하고 담화에 적절히 활용한다."],["12화언01-05","담화의 맥락에 적절한 어휘와 문법 요소를 선택하여 화자의 태도를 드러낸다."],["12화언01-06","담화의 구조를 고려하여 적절한 어휘와 문장으로 응집성 있는 담화를 구성한다."],["12화언01-07","다양한 유형의 담화와 매체를 대상으로 언어의 공공성을 이해하고 평가한다."],["12화언01-08","자아 개념이 의사소통 방식에 미치는 영향을 인식하고 협력적인 관계 형성에 적절한 방식으로 대화한다."],["12화언01-09","정제된 언어적 표현 전략 및 적절한 준언어적⋅비언어적 표현 전략을 활용하여 발표한다."],["12화언01-10","화자의 공신력을 이해하고 효과적인 설득 전략을 활용하여 연설한다."],["12화언01-11","토의에서 주제와 관련된 다양한 자료를 통해 공동체의 문제를 분석하고 합리적으로 해결한다."],["12화언01-12","주장, 이유, 근거를 비판적으로 검토하여 논증의 타당성, 신뢰성, 공정성에 대해 반대 신문하며 토론한다."],["12화언01-13","상황에 맞는 협상 전략을 사용하여 서로 만족할 수 있는 대안을 찾아 의사 결정을 한다."],["12화언01-14","기호를 활용한 사회적 행위로서의 국어생활을 성찰하고 문제점을 개선하는 태도를 지닌다."],["12화언01-15","언어 공동체의 담화 관습을 이해하고, 다양성을 존중하는 의사소통 문화 형성에 기여하는 태도를 지닌다."]],"화학":[["12화학01-01","화학이 현대 과학⋅기술⋅사회의 발전에 기여한 사례를 조사⋅발표하며 화학에 흥미와 호기심을 가질 수 있다."],["12화학01-02","다양한 단위를 몰로 환산할 수 있음을 이해하고, 물질의 양을 몰 단위로 표현할 수 있다."],["12화학01-03","여러 가지 반응을 화학 반응식으로 나타내고, 화학 반응에서 물질의 양적 관계를 설명할 수 있다."],["12화학02-01","실험을 통해 화학 결합의 전기적 성질을 설명할 수 있다."],["12화학02-03","원자와 분자를 루이스 전자점식으로 표현하고, 전자쌍 반발 이론을 근거로 분자의 구조를 추론하여 모형으로 나타낼 수 있다."],["12화학02-04","물질의 물리적, 화학적 성질을 분자의 구조와 연관 짓고, 이에 대한 호기심을 가질 수 있다."],["12화학03-01","가역 반응에서 나타나는 화학 평형 상태의 특징을 설명할 수 있다."],["12화학03-02","화학 반응에서 반응물과 생성물의 농도 자료를 통해 평형 상수의 의미를 설명할 수 있다."],["12화학03-03","반응 지수의 의미를 알고, 이를 평형 상수와 비교하여 반응의 진행 방향을 예측할 수 있다."],["12화학03-04","농도, 압력, 온도 변화에 따른 화학 평형의 이동을 이해하고, 이를 일상생활 속 현상을 설명하는 데 적용하여 화학의 유용함을 느낄 수 있다."],["12화학04-01","물의 자동 이온화와 물의 이온화 상수를 이해하고, 수소 이온의 농도를 pH로 표현할 수 있다."],["12화학04-02","몰 농도의 의미를 이해하고, 원하는 몰 농도의 용액을 만들 수 있다."],["12화학04-04","중화 적정 실험을 계획하고 수행하여 미지 시료의 농도를 찾을 수 있다."]],"화학반응의 세계":[["12반응01-02","이온화 상수를 이용하여 산과 염기의 상대적인 세기를 추론하고, 약산과 약염기 수용액의 pH를 구할 수 있다."],["12반응01-03","중화 적정 실험의 pH 변화를 데이터에 근거하여 해석할 수 있다."],["12반응01-04","이온화 상수를 이용하여 염의 가수 분해를 설명할 수 있다."],["12반응01-05","화학 평형으로 생체 내 완충 작용을 설명하고, 화학 원리의 신비로움을 느낄 수 있다."],["12반응02-01","전자의 이동과 산화수 변화로 산화⋅환원 반응을 이해하고, 반쪽 반응식을 활용하여 산화⋅환원 반응식을 완성할 수 있다."],["12반응02-02","화학 전지의 발전 과정을 조사하여 실용 전지의 구조적 공통점을 추론할 수 있다."],["12반응02-03","화학 전지의 원리를 산화⋅환원 반응으로 설명하고, 표준 환원 전위를 이용하여 전위차를 구할 수 있다."],["12반응02-04","전기 분해의 원리를 산화⋅환원 반응으로 설명하고, 산업 현장에서 활용되는 전기 분해의 예를 조사하여 발표할 수 있다."],["12반응02-05","생명 현상 및 화학 전지에서 이용되는 다양한 산화⋅환원 반응과 그 반응에 이용된 물질의 역할을 조사하여 화학의 신비로움을 느낄 수 있다."],["12반응03-01","일상생활에 유용한 탄소 화합물을 작용기에 따라 분류할 수 있다."],["12반응03-02","간단한 탄소 화합물의 화학 반응 예를 찾아 작용기의 변화로 설명할 수 있다."],["12반응03-03","단위체의 중합 반응으로 다양한 고분자가 합성되는 것을 이해하여 화학 반응의 유용성을 인식할 수 있다."],["12반응03-04","탄소 화합물의 반응을 통해 합성된 새로운 물질이 과학⋅기술⋅사회 발전에 끼친 영향을 조사하여 화학의 유용성을 깨달을 수 있다."]],"확률과 통계":[["12확통01-01","중복순열, 같은 것이 있는 순열을 이해하고, 그 순열의 수를 구하는 방법을 설명할 수 있다."],["12확통01-02","중복조합을 이해하고, 중복조합의 수를 구하는 방법을 설명할 수 있다."],["12확통01-03","이항정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["12확통02-01","확률의 개념을 이해하고 기본 성질을 설명할 수 있다."],["12확통02-02","확률의 덧셈정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["12확통02-03","여사건의 확률을 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["12확통02-04","조건부확률을 이해하고, 이를 실생활과 연결하여 문제를 해결할 수 있다."],["12확통02-05","사건의 독립과 종속을 이해하고, 이를 판단할 수 있다."],["12확통02-06","확률의 곱셈정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."],["12확통03-01","확률변수와 확률분포의 뜻을 설명할 수 있다."],["12확통03-02","이산확률변수의 기댓값(평균)과 표준편차를 구할 수 있다."],["12확통03-03","이항분포의 뜻과 성질을 이해하고, 평균과 표준편차를 구할 수 있다."],["12확통03-04","정규분포의 뜻과 성질을 이해하고, 이항분포와의 관계를 설명할 수 있다."],["12확통03-05","모집단과 표본의 뜻을 알고, 표본추출의 방법을 설명할 수 있다."],["12확통03-06","표본평균과 모평균, 표본비율과 모비율의 관계를 이해하고 설명할 수 있다."],["12확통03-07","공학 도구를 이용하여 모평균 및 모비율을 추정하고 그 결과를 해석할 수 있다."]],"국제 정치":[["12국정01-01","국제 정치의 특징을 국내 정치와 비교하여 설명할 수 있다."],["12국정01-02","근대 이후 세계사적 흐름과 관련하여 국제 정치 체제의 변화 과정을 탐색할 수 있다."],["12국정01-03","국제 정치와 관련된 정치적 현실주의와 자유주의적 이상주의를 비교·분석할 수 있다."],["12국정01-04","국제 정치를 보는 다양한 이론들의 특징 및 한계점에 대해 설명할 수 있다."],["12국정01-05","국제 정치의 행위 주체와 그 역할의 변화 과정을 파악할 수 있다."],["12국정02-01","국제 분쟁의 의미를 파악하고 국제 분쟁의 원인과 양상에 대하여 설명할 수 있다."],["12국정02-02","대표적인 국제 분쟁 사례를 역사적 관점에서 살펴보고, 국제 정치 체제의 변화에 미친 영향을 파악할 수 있다."],["12국정02-03","국제 분쟁을 해결하기 위한 국제기구들의 활동을 탐색하고, 그 성과와 문제점에 대하여 토론할 수 있다."],["12국정03-01","외교의 의미를 이해하고 그 기능을 설명할 수 있다."],["12국정03-02","국제 사회에서 널리 활용되고 있는 외교 수단과 방법을 파악할 수 있다."],["12국정03-03","외교 정책 결정 과정을 설명하는 여러 가지 이론들을 비교·분석할 수 있다."],["12국정03-04","국제 정치 현실과 관련하여 우리나라가 지향해야 할 외교 정책의 과제를 탐색할 수 있다."],["12국정04-01","개화기 이후 역사적 발전 단계에 따라 우리나라와 주변국 간의 국제 관계 변화를 설명할 수 있다."],["12국정04-02","최근 우리나라와 미국, 일본, 중국, 러시아 등과의 국제 관계에 대하여 토론할 수 있다."],["12국정04-03","오늘날 세계 속에서 우리나라의 정치, 경제, 환경 등 여러 분야에서의 위상에 대한 자료를 수집하고 분석할 수 있다."],["12국정04-04","남북 분단의 원인을 파악하고 남북한의 통일 정책을 비교·분석할 수 있다."],["12국정04-05","통일 환경의 조성과 당위성을 한반도 주변 동북아시아 관계와 국제 관계 속에서 파악할 수 있다."]],"국제 경제":[["12국경01-01","세계화의 일반적 의미와 특징에 대한 이해를 토대로 경제 영역에서 세계화가 가져온 변화를 파악할 수 있다."],["12국경01-02","세계화로 인한 국가 간 무역량의 변화, 각 지역이 무역에서 차지하는 비중의 변화 등 최근 세계 무역의 동향 변화에 대해 분석할 수 있다."],["12국경01-03","비교 우위 이론을 이해하고, 기회비용, 특화 등의 개념에 기초하여 교역을 통해 경제적 이득을 획득할 수 있음을 설명할 수 있다."],["12국경01-04","현실에서 비교 우위가 아닌 다른 요인에 의해서도 무역이 이루어질 수 있는 것을 규모의 경제, 무역 비용, 정부의 무역 정책 등과 관련지어 설명할 수 있다."],["12국경01-05","국제 수지표 작성의 의의와 중요성에 대한 이해를 바탕으로 국제 수지 계정을 구성하는 항목들을 설명할 수 있다."],["12국경01-06","상품, 서비스, 자본 이동에 따른 국제 수지표의 변화를 분석하고 주요국과 우리나라의 국제 수지 동향을 파악할 수 있다."],["12국경02-01","중상주의에서 자유 무역주의 체제로의 교역 체제 변화 과정을 탐색할 수 있다."],["12국경02-02","관세 및 무역에 관한 일반협정(GATT) 체제에서 세계 무역 기구(WTO) 체제로의 변화가 세계 경제에 가져온 변화를 두 체제의 차이점과 관련지어 비교･분석할 수 있다."],["12국경02-03","자유 무역과 보호 무역의 장점과 단점을 비교하고 각 무역 정책을 선택하는 국가들의 정치･경제적 상황에 대해 분석하고 추론할 수 있다."],["12국경02-04","신자유주의의 내용과 등장 배경을 파악하고, 신자유주의가 국제 경제에 미친 영향을 비판적으로 평가할 수 있다."],["12국경02-05","보호 무역 정책의 대표적 수단인 관세의 의미와 유형을 이해하고, 관세가 소비자와 생산자에게 미치는 영향을 분석할 수 있다."],["12국경02-06","비관세 장벽의 의미, 종류, 특징 및 사례를 조사하고 최근 전 세계 국가의 비관세 무역 장벽의 추이를 분석해 이러한 흐름이 세계 경제에 미치는 영향을 제시할 수 있다."],["12국경03-01","환율의 의미와 표기 방법을 이해하고, 외환 시장에서 환율이 결정되는 원리를 파악할 수 있다."],["12국경03-02","환율 변동이 개별경제 주체와 국가 경제에 미치는 영향을 파악하고, 수입과 수출, 물가, 경제 성장, 금리 등이 환율을 변동시키는 과정을 사례를 통해 설명할 수 있다."],["12국경03-03","금본위제에서 브레튼우즈 체제, 변동 환율제도에 이르기까지 국제 통화 체제 변천 과정을 역사적 사실을 토대로 제시할 수 있다."],["12국경03-04","고정 환율제도와 변동 환율제도의 내용과 특징을 비교하고, 각 국가가 채택한 환율제도를 조사할 수 있다."],["12국경03-05","국제 통화의 유동성과 신인도의 의미를 이해하고 이를 통해 기축 통화가 갖추어야 할 조건을 파악할 수 있다."],["12국경03-06","달러를 기축 통화로 하는 현 국제 통화 체제의 쟁점을 파악하고 안정적 국제 통화 질서를 이룰 방안을 모색할 수 있다."],["12국경04-01","경제 통합의 의미와 형태를 파악하고, 사례를 통해 경제 통합의 경제적 효과와 문제점 등을 탐구할 수 있다."],["12국경04-02","우리나라가 맺은 자유 무역 협정이 경제에 미친 영향과 문제점을 분석하고, 이를 바탕으로 세계 경제에서 한국 경제가 살아남기 위한 대응 방안을 모색할 수 있다."],["12국경04-03","국제 금융 시장의 의미를 이해하고 자본 거래 자유화 등과 같은 금융의 세계화 현상에 대해 탐구할 수 있다."],["12국경04-04","금융 시장의 개방이 각국에 미친 긍정적, 부정적 영향을 파악하고, 국제 금융 시장의 개방으로 인해 생겨나는 문제점을 해결하기 위한 각국의 노력을 설명할 수 있다."],["12국경04-05","세계화로 인해 기업의 활동 범위가 넓어지고 해외 진출이 활발해지는 현상에 대해 탐구하여 다국적 기업의 의미, 사례, 특징 및 다국적 기업이 우리나라 경제에 미치는 영향을 설명할 수 있다."],["12국경04-06","기업 세계화의 의미와 필요성 그리고 세계화에 성공한 사례를 탐구한 후,이에 기초해 우리나라 기업의 세계화 전략을 제시할 수 있다."]],"국제법":[["12국법01-01","국제 사회의 성립과 국제법의 발전 과정에 대한 이해를 통해 국제법의 개념, 성격, 의의를 파악할 수 있다."],["12국법01-02","국제법의 연원에 대한 이해를 바탕으로 조약, 국제관습법, 법의 일반 원칙을 비교･분석할 수 있다."],["12국법01-03","우리나라에서 국제법과 국내법의 관계를 헌법 조항과 판례를 통해 분석하고, 다른 나라의 사례와 비교할 수 있다."],["12국법02-01","국가, 국제기구, 지역 공동체, 개인 등 다양한 국제 사회 주체들의 특성을 비교･분석할 수 있다."],["12국법02-02","국제법의 가장 대표적인 주체인 ‘국가’의 개념과 성립 요건, 국가 승인 제도 및 국가 승계에 대하여 분석할 수 있다."],["12국법02-03","국가 관할권, 국가의 기본적 권리와 의무, 국가 책임 등의 의미와 주요 내용을 비교･분석할 수 있다."],["12국법03-01","국제법이 적용되는 공간으로 국가 영역(영토, 해양, 항공)과 국제 사회 공역(우주, 남극 등)을 이해하고, 각각의 영역에 적용되는 국제법의 주요 내용을 비교･분석할 수 있다."],["12국법03-02","국제법의 대상으로서 개인의 속성을 국적, 외국인의 지위, 범죄인 인도, 난민 보호, 인권 보호의 관점에서 분석할 수 있다."],["12국법03-03","국제 사회의 안전을 보장하기 위한 방안들을 살펴보고 국제 분쟁 해결을 위한 국제 사법 재판소의 역할을 평가할 수 있다."],["12국법03-04","다양한 국제 분쟁 사례와 그 해결 과정을 조사하여, 국제법의 분쟁 해결 기능과 역할을 분석할 수 있다."],["12국법04-01","조약의 개념과 다양한 국제 조약의 종류를 조사하고, 조약의 체결 과정, 적용과 해석, 무효와 종료에 대해 비교･분석할 수 있다."],["12국법04-02","우리나라의 관점에서 외교의 중요성을 이해하고 우리나라가 가입한 조약에 대해 조사･분석할 수 있다."],["12국법04-03","외교의 필요성과 목적을 이해하고 외교 사절의 유형, 파견과 접수 방법, 특권과 면제의 종류를 조사할 수 있다."],["12국법05-01","국제 사회의 발전 과정에서 등장한 국제법 주체로서의 국제기구와 지역 공동체의 개념을 비교할 수 있다."],["12국법05-02","다양한 국제기구가 담당하고 있는 역할을 정치, 경제, 사회, 인권, 환경 등 다양한 분야의 관점에서 파악하고, 법적 문제와 어떤 관련성을 갖는지 탐구할 수 있다."],["12국법05-03","국제 연합의 설립 배경을 이해하고 주요 기관인 총회, 안전 보장 이사회, 사무국, 국제 사법 재판소의 역할을 조사할 수 있다."],["12국법05-04","국제 연합의 역할이 지니는 한계를 분석하고, 국제 사회의 발전을 위한 국제 연합의 개혁 방안을 제시할 수 있다."],["12국법05-05","우리나라가 가입한 국제기구를 조사하고 우리나라가 수행하고 있는 활동들에 대해 법적 쟁점을 중심으로 평가할 수 있다."]],"지역 이해":[["12지역01-01","다양한 수준에서 사용되는 지역 개념의 이해를 토대로 하여 지역을 연구해 온 역사적 전통을 체계적으로 파악할 수 있다."],["12지역01-02","등질 지역과 기능 지역, 지역 경계와 점이 지대 등 지역 구분의 개념을 파악하여, 지역에 대한 계통적, 통합적 시각을 가질 수 있다."],["12지역01-03","세계화(globalization)에 따른 여러 현상의 지리적 전개에 대한 이해를 토대로 세계 경제 구조의 재편과 공간적 분화를 설명할 수 있다."],["12지역01-04","지역 정체성의 변화에 대한 인식을 바탕으로 지방화(localization)와 지역 고유성에 대하여 설명할 수 있다."],["12지역01-05","지역의 특수성과 지역 차, 경관론적 관점 등 지역 이해를 위한 다양한 관점을 파악할 수 있다."],["12지역01-06","지역 사회 연구, 국가 연구, 글로벌 세계 연구 등 지역 이해의 대상이 다양함을 인식할 수 있다."],["12지역01-07","지역 자료 수집 방법, 사례 연구 및 비교·분석 방법, 학제적 접근 방법의 특성과 각각의 장단점을 비교·분석할 수 있다."],["12지역02-01","환경 결정론, 가능론 등 인간과 자연환경 간의 관계를 설명하는 이론에 대한 비판적 분석을 토대로 인간 생활과 자연환경 간의 바람직한 관계에 대한 대안을 모색할 수 있다."],["12지역02-02","세계적인 시각에서 지형의 특색을 파악하고, 지형과 인간 생활과의 관계를 사례 지역을 중심으로 설명할 수 있다."],["12지역02-03","세계적인 시각에서 기후와 식생 및 토양의 분포 특성을 파악하고, 이들과 인간 생활의 관계를 사례 지역을 중심으로 설명할 수 있다."],["12지역02-04","문화 경관, 문화 절대주의와 상대주의, 문화의 이원성과 다원성에 대한 이해를 바탕으로 바람직한 지역 이해의 관점에 대해 토론할 수 있다."],["12지역02-05","언어와 종교 경관, 민족 문화 경관의 사례를 통해 문화적 특성에 따라 지역의 경관이 형성된 과정을 설명할 수 있다."],["12지역02-06","자연환경과의 상호 작용을 통해 형성된 사회적 공간의 변화 과정에 대한 이해를 통해 바람직한 사회적 공간에 대한 대안을 탐구할 수 있다."],["12지역02-07","정주 공간으로서의 촌락과 도시 경관에 대한 세계적 시각의 탐구를 토대로 하여 각각의 경관이 형성되는 과정을 사례 지역을 중심으로 설명할 수 있다."],["12지역03-01","문화권 구분에 작용하는 다양한 요인을 설명할 수 있다."],["12지역03-02","세계를 여러 문화권으로 구분하고 이를 통해 지역을 이해할 수 있는 관점을 함양할 수 있다."],["12지역03-03","유럽, 아시아, 아프리카의 지역적 특성을 설명할 수 있다."],["12지역03-04","아메리카, 오세아니아의 지역적 특성을 설명할 수 있다."],["12지역03-05","국가 혹은 특정 지역 내 하위 지역에 대한 특성을 사례 중심으로 파악할 수 있다."],["12지역03-06","경제 발전, 인구 이동 등 사회적 요인에 따른 지역 특성의 변화를 설명할 수 있다."],["12지역04-01","세계 수준에서의 지역별 경제적 격차에 대한 원인을 분석하고 해결 방안을 모색할 수 있다."],["12지역04-02","지역 갈등과 공존의 사례를 탐색하여 지역 간 정치적 갈등의 해결 방안을 제시할 수 있다."],["12지역04-03","세계 경제 블록화, 초국가주의 출현과 발전 양상의 특성을 설명할 수 있다."],["12지역04-04","언어･종교･민족(인종) 등 문화의 차이로 인해 갈등이 발생하는 지역을 조사하고, 그 원인과 해결 방안에 대하여 탐구할 수 있다."],["12지역04-05","사회･문화적 공존 지역의 지리적 특성을 파악하고 공존의 필요성을 탐색할 수 있다."],["12지역04-06","교통 및 정보 통신 수단의 발달 과정, 글로벌 네트워크의 형성이 지역 발전에 미친 긍정적 및 부정적 영향을 종합적으로 평가할 수 있다."],["12지역04-07","지속 가능한 발전 및 이를 위한 국제 연합과 국제기구의 활동에 대한 이해를 바탕으로 글로벌 사회의 공존과 공영 방법에 대해 토론할 수 있다."]],"한국 사회의 이해":[["12한사01-01","대한민국의 건국 이념인 홍익인간의 의미는 무엇인지 역사적･철학적으로 조명할 수 있다."],["12한사01-02","대한민국 헌법의 원칙과 역사적 형성 과정을 설명할 수 있다."],["12한사01-03","민주주의의 근본이념, 기본 원리, 전제 조건 등에 대한 이해를 바탕으로 자유 민주주의가 더욱 발전하기 위한 과제가 무엇인지 탐색할 수 있다."],["12한사01-04","정치 제도의 민주적 운영을 위한 다양한 방법과 시민의 자발적, 능동적 참여를 위한 다양한 방법을 조사･탐구할 수 있다."],["12한사01-05","사례 분석을 통해 개인의 인권 보호와 사회 질서 유지 간의 긴장, 권리를 둘러싼 분쟁의 합리적 해결을 위한 대안 모색을 바탕으로 갈등의 조정과 중재의 정치적 과정을 탐색할 수 있다."],["12한사02-01","자본주의의 일반적 특징, 사유 재산과 영리 추구, 경쟁의 이익과 시장의 한계 등 자본주의 전반에 관한 이해를 바탕으로 우리나라 경제 체제의 특징을 설명･평가할 수 있다."],["12한사02-02","정부 주도 경제 정책 시행의 공과(功過) 및 그에 따른 평가를 바탕으로 우리 경제의 여러 가지 문제를 진단하고, 문제 해결을 위한 다양한 대안을 제시할 수 있다."],["12한사02-03","미래의 우리 경제 사회가 어떻게 변화할 것인가를 전망하여 개인적･사회적･국가적 측면에서 대응 방안을 제시할 수 있다."],["12한사02-04","한국 자본주의 발전의 특성, 정부 주도 성장 전략과 경제 성장 과정에서 나타난 불균형 심화 등의 문제점을 파악하고 개선책을 모색할 수 있다."],["12한사02-05","신자유주의 경제 질서에 대한 균형적 시각을 견지하면서 한국 경제가 직면한 쟁점과 국제 협력의 과제를 분석할 수 있다."],["12한사03-01","다양한 일상생활 속 전통문화의 특성에 대한 이해를 바탕으로 한국인의 정서와 사회관 및 인생관을 탐구할 수 있다."],["12한사03-02","전통 신앙 및 여러 가지 통과 의례 등을 통해 한국인의 정신세계와 가치관을 파악하고, 한국인의 역사관, 미래관, 사회관, 인생관 등을 탐구할 수 있다."],["12한사03-03","한국의 자생 종교 및 외래 종교(불교, 유교, 기독교 등)와 현대 한국 사회에서 볼 수 있는 종교 현상 등에 대한 종합적인 검토를 바탕으로 한국인의 정서 및 한국 사회를 문화적으로 평가할 수 있다."],["12한사03-04","우리의 전통문화를 존중하고 계승･발전시키기 위해 역사성과 실용성, 주체성을 바탕으로 현재와 과거, 미래를 조화시켜 새로운 문화를 창조하는 태도와 가치를 함양할 수 있다."],["12한사03-05","국가유산 보호를 위한 다양한 방법에 관심을 가지고 전통문화의 대중화를 위한 전개 방법 등을 탐색할 수 있다."],["12한사04-01","한국 사회의 인구 통계학적 변화 과정의 추세를 도표나 통계를 통해 분석하여, 저출산 및 고령화 현상의 원인과 문제점을 도출하고 해결방안을 제시할 수 있다."],["12한사04-02","우리나라의 경제 성장 과정에 나타난 소득 양극화, 지역 간 불균형 등의 문제점을 파악하고, 이를 해결하기 위한 방안을 정부 정책과 연계하여 탐구할 수 있다."],["12한사04-03","국내 거주 외국인의 증가 현상에 주목하여 다문화 사회에서 나타나는 문제점을 문화 다양성과 문화 상대주의적 관점에서 해결할 수 있는 방안을 탐구할 수 있다."],["12한사04-04","한반도를 둘러싼 국제 사회 환경의 변화에 대한 이해를 바탕으로 남북 관계의 개선을 위한 노력을 분석하고, 평화적인 통일 방안 및 통일 한국의 미래상을 탐구하여 통일 사회에 대비할 수 있다."],["12한사04-05","최근 한국 사회의 세대 간 갈등 현상을 정치･경제･문화적 측면에서 조사하여, 그 원인과 문제점을 도출하고 이를 해결하기 위한 방안을 제시할 수 있다."]],"비교 문화":[["12문화01-01","문화의 의미와 주요 특성을 다양한 사례를 통해 분석할 수 있다."],["12문화01-02","인류 역사에서 문화가 인간의 진화와 어떤 관련을 맺고 있는지 탐색할 수 있다."],["12문화01-03","문화 연구에 기초가 되는 문화 비교의 관점을 설명할 수 있다."],["12문화01-04","총체론적 관점, 문화 상대론적 관점, 비교론적 관점 등 문화를 이해하는 다양한 접근 방식을 비교하고, 바람직한 문화 이해의 방법과 태도를 탐색할 수 있다."],["12문화01-05","문화 연구의 주요 방법인 현지 조사의 자료 수집 및 분석 방법과 각 단계별 유의점을 구체적 사례에 적용할 수 있다."],["12문화02-01","언어는 한 사회 구성원들이 공유하는 문화적 관습의 결과물임을 설명할 수 있다."],["12문화02-02","언어에 대한 분석이 해당 문화를 이해하는 데 중요한 정보를 제공함을 도출할 수 있다."],["12문화02-03","가족과 친족, 경제 체제, 권력과 계층, 종교와 의례 등 각종 사회 제도가 문화와 밀접한 관련을 맺으며 성립, 발전되는 것임을 설명할 수 있다."],["12문화02-04","여러 사회 제도와 문화의 관계를 파악하고 사회 제도가 세대 간에 전승되는 양상을 탐색할 수 있다."],["12문화02-05","사회의 문화 체계가 환경과의 상호 작용을 통해 형성되는 과정을 조사할 수 있다."],["12문화02-06","인간이 환경에 적응하는 과정에서 각종 기술, 제도, 문화적 체계를 발전시켜 왔음을 이해하고 문화와 환경이 어떠한 관계를 지니는지 분석할 수 있다."],["12문화03-01","도시화, 근대화, 서구화, 탈산업화, 정보화, 세계화 등의 사회 변화로 인해 야기된 문화 변동의 양상을 여러 사례를 통해 설명할 수 있다."],["12문화03-02","문화 접변, 문화적 다양성, 정체성 위기 등 문화 변동의 결과로 나타난 현상들을 조사·분석할 수 있다."],["12문화03-03","다른 문화를 경험할 때 느끼는 문화 충격과 문화 적응 과정을 이해하고 이에 적절히 대응할 수 있다."],["12문화03-04","문화 읽기 또는 문화 기술 체험 등을 통해 자문화에 대한 성찰적 태도와 타 문화에 대한 폭넓은 이해를함양하고 이를 실천할 수 있다."],["12문화03-05","지역 문화의 다양성 감소 및 전 지구적 문화 동질화 현상이 의미하는 바를 사례를 통해 설명할 수 있다."],["12문화03-06","문화 변동의 과정에서 고유의 문화적 정체성을 바탕으로 전통문화와 지역 문화를 창조하는 방안을 탐색하여 제시할 수 있다."],["12문화04-01","대륙 문화권, 국가별 문화권, 향토사별 문화권 및 기후 지역별 문화권과 같은 다양한 문화권 분류 기준과 각 문화권의 특성을 비교·분석할 수 있다."],["12문화04-02","종교 체계의 특성에 대한 이해를 토대로 여러 종교의 발전 과정에서 형성된 다양한 종교적 전통을 상호 비교할 수 있다."],["12문화04-03","종교에 따라 문화권이 분류되며, 각 종교별로 특수한 자연관과 세계관이 있음을 탐색할 수 있다."],["12문화04-04","언어와 같은 상징체계의 기본적 속성에 대한 이해를 바탕으로, 어족이나 언어 사용 범위에 따른 다양한문화권의 특징을 비교·분석할 수 있다."],["12문화04-05","각 문화권이 독특하게 보유하고 있는 신화의 의미와 그 안에 담긴 세계관을 살펴봄으로써 신화의 보편성과 다양성을 추론할 수 있다."],["12문화04-06","사회 계층, 조직, 연령, 세대, 성, 지역 등에 따라 형성된 각 하위문화의 특징과 이들이 사회에서 차지하는 의미 등을 비교·분석할 수 있다."]],"세계 문제와 미래 사회":[["12세문01-01","지정학의 의미, 지정학적 관계의 중요성을 설명할 수 있다."],["12세문01-02","세계 대전, 국지적 전쟁과 국제 테러 등 지정학적 갈등의 유형과 원인을 사례를 통해 탐구할 수 있다."],["12세문01-03","물리적･구조적･문화적 폭력의 의미를 각 사례에 적용하여 설명할 수 있다."],["12세문01-04","소극적 평화와 적극적 평화의 의미를 실제 사례에 적용하여 구분할 수 있다."],["12세문01-05","국제 연합을 중심으로 국제 사회의 분쟁 해결 및 평화 정착을 위한 다양한 국제기구의 활동을 조사하고, 비판적으로 평가할 수 있다."],["12세문02-01","인권 개념이 등장하게 된 시대적 배경과 인권의 발전 과정을 이해하고 설명할 수 있다."],["12세문02-02","시대 변화에 따라 새롭게 요구되는 인권의 내용을 탐구하여 제시할 수 있다."],["12세문02-03","인종 차별, 난민, 정치적 억압, 아동 학대, 집단 학살 등 현대 사회의 인권 침해의 유형과 실태를 사례 중심으로 조사하고 문제점을 파악할 수 있다."],["12세문02-04","국제 사면 위원회를 포함하여 세계의 주요 인권 단체와 다양한 인권 보호 활동의 사례를 조사하고 비판적으로 분석할 수 있다."],["12세문03-01","지구 온난화, 물 부족, 사막화, 대기 오염 등 세계의 주요한 환경 문제의 유형과 실태를 조사하여 발표할 수 있다."],["12세문03-02","지구 환경 문제의 원인을 분석하고 대안을 모색하여 제시할 수 있다."],["12세문03-03","에너지 자원 분포와 고갈 실태, 에너지 문제의 특징과 원인을 조사하여 분석할 수 있다."],["12세문03-04","자원 민족주의로 인한 갈등과 자원 전쟁 등 에너지를 둘러싼 분쟁의 해결책을 모색하여 제시할 수 있다."],["12세문03-05","환경에서 지속 가능성의 의미를 설명할 수 있다."],["12세문03-06","다양한 종류의 친환경 대안 에너지의 생산과 소비 방식을 조사하여 지속 가능한 지구 환경 구축 방안을 제시할 수 있다."],["12세문04-01","다양한 사례를 중심으로 세계적인 이주의 원인, 이주의 유형과 특성을 지구적, 국지적 규모에서 분석할 수 있다."],["12세문04-02","주류 문화와 소수 문화의 관계, 도시 내부의 이주민 공동체의 형성, 이주에 따른 문화적 갈등의 사례와 그 융합을 위한 해결 사례를 조사하여 제시할 수 있다."],["12세문04-03","이주와 관련된 다양한 국제기구를 소개하고 그 역할을 파악하여 설명할 수 있다."],["12세문04-04","자문화 중심주의와 문화 상대주의적 관점을 비교하여 설명할 수 있다."],["12세문04-05","다양한 문화 보호를 위한 문화 다양성 개념 및 문화 다양성 협약, 다문화 교육의 의의에 대한 이해를 바탕으로 차이를 존중하는 태도를 실천할 수 있다."],["12세문05-01","지식 정보 사회의 특징, 정보화로 인한 긍정적인 변화와 문제점을 분석할 수 있다."],["12세문05-02","제도와 의식 측면에서 정보 격차나 인권 침해 등의 문제를 해결하는 방안을 모색하여 제시할 수 있다."],["12세문05-03","과학 기술의 발전 양상, 과학 기술과 생명 윤리, 인간 존엄성 등의 가치문제를 비판적으로 평가할 수 있다."],["12세문05-04","과학 기술에 대한 성찰을 바탕으로 과학 기술의 올바른 사용 방법을 모색하여 제시할 수 있다."],["12세문05-05","세계화의 의미와 배경, 세계화로 인한 정치･경제･사회･문화적 변화 양상, 세계화와 지역화의 관계를 실제 사례를 통해 파악할 수 있다."],["12세문05-06","전 지구적 문제에 관심을 가지고 해결하기 위해 노력하는 세계 시민 의식을 함양하고 이를 일상생활에서 실천할 수 있다."]],"국제 관계와 국제기구":[["12기구01-01","세계화와 지역화의 의미를 이해하고 그 원인을 파악할 수 있다."],["12기구01-02","세계화가 국제 관계에 끼친 영향을 정치, 군사, 경제, 문화 등의 측면에서 설명할 수 있다."],["12기구01-03","세계화와 관련지어 국제 행위 주체들의 역할 변화를 설명할 수 있다."],["12기구01-04","국제기구가 설립된 배경과 목적에 대해 설명할 수 있다."],["12기구02-01","세계사의 흐름 속에서 안보의 개념 및 유형을 파악할 수 있다."],["12기구02-02","국제 안보 질서 체제의 변화 과정에 대해 설명할 수 있다."],["12기구02-03","제2차 세계 대전 이후 국가 및 국제 안보 구축을 위한 국제기구들에 대한 자료를 수집하여 발표할 수 있다."],["12기구02-04","국제 안보를 위한 국제 연합의 역할 및 성격, 문제점에 대해 설명할 수 있다."],["12기구02-05","한국과 북한, 미국, 중국, 일본, 러시아 등 한반도 주변 국가와의 관계를 살펴보고 평화 통일의 필요성을 도출할 수 있다."],["12기구03-01","자유 무역주의 이론과 관련하여 근대 이후 국제 무역 질서의 변화 과정을 설명할 수 있다."],["12기구03-02","제2차 세계 대전 이후 국제 무역 체제를 관련 국제기구들과 연관 지어 파악할 수 있다."],["12기구03-03","세계 무역 기구(WTO)의 성립 배경과 활동에 대해 설명할 수 있다."],["12기구03-04","공적 개발 원조(ODA)와 관련된 국제기구에 대한 이해를 바탕으로 국제 경제 협력의 필요성을 도출할 수 있다."],["12기구03-05","우리나라가 가입한 국제 경제 협력체를 중심으로 우리나라와 아시아의 경제 협력 관계에 대해 토론할 수 있다."],["12기구04-01","20세기 이후 국제 통화 질서의 변화 과정을 설명할 수 있다."],["12기구04-02","제2차 세계 대전 이후 국제 금융･통화 질서를 구축하기 위한 국제 금융･통화 체제와 국제기구들에 대한 자료를 수집하고 비교할 수 있다."],["12기구04-03","세계 금융 위기의 원인과 영향에 대해 설명할 수 있다."],["12기구04-04","국제 통화 체제의 불안 및 세계 금융 위기가 우리나라에 미친 영향을 파악하고, 문제 해결 방안에 대한 자료를 수집하고 비교･분석할 수 있다."],["12기구04-05","국제 금융 및 통화 안정을 위한 아시아 국가 간 협력의 필요성을 국제기구와 관련지어 토론할 수 있다."],["12기구05-01","환경과 에너지 문제가 국제적으로 주목받게 된 계기와 그 변화 과정을 설명할 수 있다."],["12기구05-02","환경과 에너지 문제를 해결하기 위한 여러 가지 국제 협정의 특징과 문제점을 파악할 수 있다."],["12기구05-03","우리나라의 경제 현실과 국제 협력의 필요성을 고려하여 환경과 에너지 문제 해결에 대한 합리적 해결방안을 제시할 수 있다."]],"현대 세계의 변화":[["12현세01-01","17세기와 18세기 서구 사회의 변화를 중세와 근대의 차이라는 관점에서 비교하여 설명할 수 있다."],["12현세01-02","근대 사회의 형성을 가져온 시민 혁명을 영국과 미국, 프랑스의 사례를 통해 탐구할 수 있다."],["12현세01-03","산업 혁명에 따른 자본주의의 발달이 근대 사회에 미친 영향을 정치·경제적 관점에서 분석할 수 있다."],["12현세02-01","유럽이 제국주의 경쟁에 나선 배경과 결과에 대한 탐구를 바탕으로 당시의 식민 지배 상황을 조사할 수 있다."],["12현세02-02","제국주의에 저항한 식민 지역의 저항 운동을 사례를 통해 분석하고, 세계적으로 민족주의가 확산된 과정을 탐구할 수 있다."],["12현세02-03","국가 간, 국가 내 이데올로기가 분열된 과정을 사례를 통해 조사할 수 있다."],["12현세02-04","다양한 이데올로기 갈등을 정치·경제적 관점에서 분석할 수 있다."],["12현세03-01","제1차 세계 대전과 제2차 세계 대전의 원인과 결과를 분석할 수 있다."],["12현세03-02","양차 대전이 초래한 국제 질서의 변화 과정을 탐구할 수 있다."],["12현세03-03","냉전 체제의 국제 사회 특징을 동서 갈등과 남북 갈등의 관점에서 비교·분석할 수 있다."],["12현세03-04","미국과 소련의 양극 체제가 이완되는 과정에서 새롭게 대두된 패권 체제의 약화와 동서 경제 교류의 확대 등 과도기적 상황을 역사적 사건 중심으로 분석할 수 있다."],["12현세04-01","냉전의 종식과 탈냉전의 새로운 흐름에 대해 전환기적 현상을 중심으로 평가할 수 있다."],["12현세04-02","중국의 부상으로 인한 국제 질서의 변화 과정과 정치·경제적 영향을 파악하고 분석할 수 있다."],["12현세04-03","신자유주의의 확산이 국제 사회에 미친 영향을 분석하고, 그 과정에서 발생한 정치·경제적 갈등 및 협력 현상을 사례 중심으로 탐구할 수 있다."],["12현세04-04","환경, 에너지, 바이오(식량, 전염병 등), 인권, 테러 등과 관련하여 국제 사회가 지향해야 하는 미래 가치를도출하고, 바람직한 대안을 통해 세계 시민성을 함양할 수 있다."]],"사회 탐구 방법":[["12사방01-01","과학적 탐구의 정의를 이해하고, 과학적 탐구를 위해 요구되는 연구 방법의 의미와 구성 요소를 조사할 수 있다."],["12사방01-02","인류 과학의 발달사를 사회 과학과 자연 과학으로 구분하여 파악할 수 있다."],["12사방01-03","19세기 이후 사회 과학 연구에 커다란 영향을 미친 실증주의의 개념과 특징을 파악하고, 사회 과학 방법론과 자연 과학 방법론의 유사점과 차이점을 비교･분석할 수 있다."],["12사방01-04","양적 연구와 질적 연구 방법론의 차이를 중심으로 각 방법론의 특징과 주요 가정들을 탐구할 수 있다."],["12사방01-05","양적 연구와 질적 연구의 자료 수집 방법을 비교･분석할 수 있다."],["12사방02-01","조사 연구, 내용 분석 연구(또는 문헌 분석 연구), 질적 사례 연구(또는 문화 기술적 연구), 실험 연구 등 여러 사회 과학 연구에서 많이 활용되는 주요 연구 방법의 의미와 목적을 설명할 수 있다."],["12사방02-02","각 연구 방법의 주요 절차와 특징적인 연구 기법을 실제 연구 사례를 통해 살펴보고, 각 연구 방법의 장단점을 비교･분석할 수 있다."],["12사방02-03","탐구 주제 및 탐구 목적에 따라 연구 방법이 달라질 수 있음을 설명할 수 있다."],["12사방02-04","하나의 연구 방법만을 사용하였을 경우에 나타나는 연구상의 한계점이 무엇인지 알아보고, 이를 극복하기 위해 단일 연구에 2개 이상의 연구 방법을 결합하여 사용한 연구 사례를 조사할 수 있다."],["12사방03-01","사회 탐구 설계의 의미와 필요성에 대해 설명할 수 있다."],["12사방03-02","사회 탐구 설계의 주요 요소 및 절차를 설명할 수 있다."],["12사방03-03","좋은 연구 설계가 갖추어야 할 조건을 양적 연구와 질적 연구로 구분하여 파악할 수 있다."],["12사방03-04","양적 연구와 질적 연구의 타당성과 신뢰성에 영향을 미칠 수 있는 요인을 각각 분석할 수 있다."],["12사방03-05","연구 윤리의 의미를 파악하고, 연구 설계 과정에서부터 연구 윤리에 대한 고려가 필요한 이유를 설명할 수 있다."],["12사방03-06","사회 탐구 설계 및 자료 수집 과정에서 발생할 수 있는 다양한 연구 윤리 위반 유형을 사례 중심으로 탐색할 수 있다."],["12사방04-01","다양한 국제 사회 현상과 관련된 탐구 사례를 분석하여, 연구 설계 및 연구 방법이 실제 사회 탐구에 어떻게 활용되었는지 총체적으로 탐색할 수 있다."],["12사방04-02","사회 탐구 사례에서 활용된 탐구 방법의 유용성을 분석하고, 각 방법에 맞는 정보 및 자료를 수집･분석하는 경험을 통해 향후 사회 탐구 방법 적용을 위한 시사점을 도출할 수 있다."],["12사방04-03","연구 수행을 위해 요구되는 계획서의 목적과 필요성을 이해하고, 연구 계획서의 구성 요소를 탐색할 수 있다."],["12사방04-04","연구 계획서의 사례를 살펴봄으로써 좋은연구 계획서가 지녀야 할 특징과 각 구성 요소들이 충족시켜야 할 조건을 설명할 수 있다."],["12사방04-05","연구 결과 보고서의 구성 요소를 살펴보고, ‘연구 계획서’와 ‘연구 보고서’가 서로 어떻게 다른지 비교할 수 있다."],["12사방04-06","동일한 연구 주제를 대상으로 작성된 양적 연구와 질적 연구의 보고서를 비교･분석하여 연구의 패러다임이나 연구의 유형에 따른 글쓰기 방식의 차이를 설명할 수 있다."]],"사회과제 연구":[["12사과01-02","다양한 인문･사회의 주제를 대상으로 사회과제 연구가 수행될 수 있음을 파악할 수 있다."],["12사과01-03","다양한 인문･사회의 주제가 어떻게 과제 연구의 대상으로 변환되는지 설명하고, 과제 연구 대상의 조건이나 특성을 제시할 수 있다."],["12사과01-04","사례를 통해 사회과제 연구를 수행하는 주요 절차를 검토하여 과제 연구의 전 과정을 총체적으로 설명할 수 있다."],["12사과02-01","과제 연구 수행을 위한 연구 계획 수립의 의미와 필요성을 파악할 수 있다."],["12사과02-02","연구 계획서의 사례를 통해 연구 계획서의 구성 요소와 각 요소의 작성 방식을 탐색하고 좋은 연구 계획서의 주요 요건들을 제시할 수 있다."],["12사과02-03","국제 계열 전문 교과에서 학습한 지식을 바탕으로 과제
